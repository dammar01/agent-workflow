name: ci

# The research and staging checks, run against the Exoma commit pyproject.toml pins. The
# runtime's own gates (version stamp, manifest, stdlib-only, unit, integrity, installer)
# run in Exoma's CI, where a failure is fixed.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both: the measurement harnesses read transcripts and spawn bash, and path
        # handling differs between the two.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the research check resolves every commit a decision names.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Pinned Exoma and development dependencies
        # --locked: the run uses the Exoma commit uv.lock records, or fails when the
        # lock no longer matches pyproject.toml.
        run: |
          python -m pip install uv
          uv sync --locked

      - name: Research records follow their schema
        # --git: every commit a decision names exists in this repository.
        run: uv run python tools/maintain/check_research.py --git

      - name: Research and staging suites
        # --keep-going so one failure does not hide the rest. --record writes the outcome
        # to the workspace quality stream, so `exoma --command report` can show a test pass
        # rate over time rather than only the latest run.
        run: uv run python tests/run.py --keep-going --record .
