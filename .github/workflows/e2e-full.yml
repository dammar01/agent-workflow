name: e2e-full

# The staging run: a real second agent, a real call, real quota, against the Exoma commit
# pyproject.toml pins. Manual only: it costs money on every run and needs a provider CLI
# plus credentials, neither of which belongs in an automatic trigger.
on:
  workflow_dispatch:
    inputs:
      session:
        description: 'Session id for the delegated run'
        required: false
        default: 'e2e-dispatch'
      provider:
        description: 'Second agent for the delegated run'
        required: false
        default: 'opencode'
      model:
        description: 'Model id the provider CLI accepts (the shipped seed leaves it unset)'
        required: true
      setup_timeout:
        description: 'Seconds per setup process (engineering limit, not measured latency)'
        required: false
        default: '120'
      delegated_timeout:
        description: 'Seconds per delegated runner process'
        required: false
        default: '900'
      runner:
        description: 'Runner label. GitHub-hosted runners have no provider CLI installed — use a self-hosted runner that does.'
        required: false
        default: 'self-hosted'

permissions:
  contents: read

jobs:
  delegated:
    # Deliberately not ubuntu-latest. A hosted runner has no opencode/codex/agy binary, so
    # `--full` would fail at the adapter with a command-not-found rather than telling you
    # anything about the runtime. Point this at a machine where the provider is installed
    # and authenticated, which in practice means the same machine a developer uses.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pinned Exoma
        run: |
          python -m pip install uv
          uv sync --locked

      - name: Report the provider that will answer
        # Fail early and legibly when the runner has no provider configured, rather than
        # halfway through a paid call.
        run: uv run python -m exoma --command doctor --work-dir . --pretty

      - name: End-to-end including delegated calls
        shell: python
        env:
          STAGING_SESSION: ${{ inputs.session }}
          STAGING_PROVIDER: ${{ inputs.provider }}
          STAGING_MODEL: ${{ inputs.model }}
          STAGING_SETUP_TIMEOUT: ${{ inputs.setup_timeout }}
          STAGING_DELEGATED_TIMEOUT: ${{ inputs.delegated_timeout }}
        run: |
          import os
          import subprocess
          import sys
          result = subprocess.run([
              "uv", "run", "python", "-I", "tools/e2e/e2e.py", "--full",
              "--session", os.environ["STAGING_SESSION"],
              "--provider", os.environ["STAGING_PROVIDER"],
              "--model", os.environ["STAGING_MODEL"],
              "--setup-timeout", os.environ["STAGING_SETUP_TIMEOUT"],
              "--delegated-timeout", os.environ["STAGING_DELEGATED_TIMEOUT"],
              "--report-json", "staging-report.json",
          ])
          sys.exit(result.returncode)
