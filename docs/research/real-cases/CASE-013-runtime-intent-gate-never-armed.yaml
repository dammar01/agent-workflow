schema_version: 3
id: CASE-013
title: The runtime half of the pre-flight gate never armed — its hook read a prompt field Claude Code does not send
recorded_on: 2026-10-04
visibility: public
environment: maintainer_development
repository_identity: agent-workflow
evidence_tier: creator_observation

context: |
  The bundle describes the pre-flight gate as two layers: the prompt rule, and a runtime layer
  in which the UserPromptSubmit hook `intent-gate-set` writes a `delegated.marker` for a prompt
  the NL-map resolves to a delegated command, and the PreToolUse hook `intent-gate-check`
  blocks gather tools while that marker exists.

task: |
  A maintainer session asked for an analysis and then a plan of this repository. Under the
  bundle's own description, the plan prompt should have armed the runtime gate.

workflow: |
  Auto-intent install (3.7.3 to 3.8.0 bundle), Windows, PowerShell hook flavour. The session
  ran in `/.local` mode, so the main agent gathered with Read/Grep/Bash itself.

observation: |
  - No `delegated.marker` was written in the session's runtime directory after the plan
    prompt, and no gather tool was blocked.
  - Both hook flavours read the prompt from `payload.user_prompt`
    (`intent-gate-set.ps1` line 38, `intent-gate-set.sh` line 31 before the fix). Claude Code's
    UserPromptSubmit payload carries the prompt as `prompt`. Fed a payload with `prompt` and a
    `/.plan` text, the shipped PowerShell hook wrote no marker; fed the same text as
    `user_prompt`, it wrote one. So every prompt classified as "no command", and the marker
    was never written by a real session.
  - After the fix (both flavours read `prompt`, then `user_prompt`) and a reinstall, the gate
    blocked the main agent's next Bash read in the same session, as designed.
  - That first armed prompt ("continue until the plan is finished") was resolved to `plan`
    because it contains the plan trigger word, while its intent was to execute. The NL-map has
    no tie-break for a prompt that names a plan while asking to carry it out.

evidence:
  source: |
    `dist/config/claude/hooks/intent-gate-set.ps1` and `.sh` at commit d2babe3 (field read);
    the session runtime directory of this repository's MAIN_SESSION_ID on 2026-10-04 (no marker
    before the fix); a scratch reproduction with a temporary session registry (marker written
    for `user_prompt`, not for `prompt`); `tests/checks/intent_gate.py` (marker written for
    `prompt`, every available flavour); the PreToolUse refusal text of the reinstalled hook.
  counted_by: main agent
  counted_on: 2026-10-04
  notes: |
    That the payload field is `prompt` comes from the observed behavior and the hook contract
    as the main agent knows it; the Claude Code documentation was not reachable in the session.

outcome: negative
unexpected_behavior:
  - A gate described as enforced at runtime was enforced only by the prompt, since its release.
  - A prompt that asks to carry out a plan arms the gate for `plan`.
limitations:
  - One maintainer, one machine, Windows; the POSIX flavour was checked by its embedded python only.
  - Nothing measures how often the prompt layer alone held the gate before the fix.
related: [CASE-009]
related_notes: |
  CASE-009 counted verify outcomes in sessions run under this same unarmed gate; it says nothing
  about how evidence was gathered, so its figures are unaffected.

