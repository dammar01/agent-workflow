schema_version: 3
id: CASE-016
title: Codex resumes a thread on Windows through 0.154.0 and fails every resume from 0.155.0 to 0.160.0
recorded_on: 2026-10-04
visibility: public
environment: maintainer_development
repository_identity: agent-workflow
evidence_tier: creator_observation
context: |
  CASE-015 showed a resumed codex verify failing at codex's elevated Windows sandbox while a new
  thread worked, without the codex release being known. The maintainer reported that this
  happens more often on newer codex releases and did not know which release was stable, and
  allowed the global codex install to be downgraded to find out.
task: |
  Find the newest codex release on which a resumed thread works on the maintainer's Windows
  machine, to set codex's `stable_version` (DEC-028).
workflow: |
  A probe script drove the workflow's own `CodexAdapter` (the same argv, `--sandbox read-only`
  and read-deny boundary as delegated calls) from this repository's root: one call on a new
  thread with a one-word prompt, then one call resuming that thread. Each release was installed
  globally with `npm i -g @openai/codex@<release>` before its probe. Non-pre-release versions
  only.
observation: |
  | Release | New thread | Resumed thread |
  | --- | --- | --- |
  | 0.147.0 | ok | ok |
  | 0.153.4 | ok | ok |
  | 0.154.0 | ok | ok (two runs) |
  | 0.155.0 | ok | sandbox_unavailable |
  | 0.155.1 | ok | sandbox_unavailable |
  | 0.156.1 | ok | sandbox_unavailable |
  | 0.157.0 | ok | sandbox_unavailable |
  | 0.157.1 | ok | sandbox_unavailable |
  | 0.159.3 | ok | sandbox_unavailable |
  | 0.160.0 | ok | sandbox_unavailable |
  - Every failure carried the CASE-015 text: "elevated Windows sandbox requires effective
    `:root` read access", raised while loading AGENTS.md for the resumed thread, and the
    adapter classified it `sandbox_unavailable` (DEC-024).
  - A failed resume returned in about 6 s; a working one in 10 to 15 s.
  - Not every release between 0.147.0 and 0.153.4 was probed; both ends worked.
evidence:
  source: |
    The probe's JSON output per release (version line, ok and error_type of each call, the
    last 300 characters of stderr), run on 2026-10-04 on the maintainer's Windows 11 machine
    from this repository's root.
  counted_by: main agent
  counted_on: 2026-10-04
outcome: negative
unexpected_behavior:
  - New threads work on every probed release; only resuming is broken, so a session's first delegated call succeeds and its second fails.
limitations:
  - One machine, one Windows build, one probe per release (two for 0.154.0). Other Windows setups may break on other releases.
  - The probe used a one-word prompt; it shows the session start, not a long delegated task.
related: [CASE-015, DEC-024, DEC-028]
related_notes: |
  CASE-015 is the first observation of the failure; DEC-024 names it; DEC-028 sets codex's
  stable release to 0.154.0 from this case.
implementation:
  version: 3.8.0
  feature: codex adapter, resumed threads
disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-07a, RQ-09]
