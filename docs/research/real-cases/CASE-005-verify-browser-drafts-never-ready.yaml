schema_version: 1
id: CASE-005
title: "`/.verify-browser` drafts never reached `ready`"
recorded_on: 2026-09-27
visibility: public
environment: private_production
repository_identity: undisclosed
evidence_tier: creator_observation
confidentiality_note: |
  No transcripts. No company names, internal URLs, source code, or business metrics. Every
  figure is a count over job metadata; no prompt, scenario, or application content is quoted.

context: |
  The maintainer used `/.verify-browser` (versions 3.6.x–3.7.x) against one private web
  application project during its development, on one machine.

task: |
  Verify application changes in a real browser: stage 1 drafts a spec, the user confirms it,
  stage 2 runs it.

workflow: |
  Each `/.verify-browser` invocation is a background job. A `draft` job asks the secondary
  agent for an `[E2E SPEC]` section, which the runtime validates into `[E2E DRAFT]` with status
  `ready`, `invalid`, or `blocked`.

observation: |
  - 199 `verify-browser` jobs: 157 `run`, 39 `draft`, 3 failed without a phase.
  - The 39 drafts span 16 sessions. None reached `ready`: 34 `invalid`, 5 `blocked`.
  - The first draft of each session: 12 `invalid`, 4 `blocked`, 0 `ready`.
  - 157 runs happened anyway, so their scenarios were written outside the draft.

  First error of each of the 34 invalid drafts:

  | Kind | Drafts |
  | --- | --- |
  | `scenario_json: invalid JSON` | 10 |
  | a claim without `source_refs` | 9 |
  | selector shape (unknown keys such as `exact`, `state`, `visible`; no selector object; candidate order) | 6 |
  | `scenario_json: no JSON code fence` | 3 |
  | `side_effect` outside its enum | 3 |
  | other validation (claim never asserted, missing `claim_id`, non-kebab id) | 3 |

  Every one of these ended the draft on that attempt: in these builds a section that was
  present but invalid was never sent back to the secondary agent, only a missing section was.

evidence:
  source: |
    Every `storage/jobs/job_*.json` with `command: verify-browser` on the maintainer's machine
    from 2026-09-21 up to and including `job_20260927_133750_326097` — the last job before the
    3.7.3 runtime changes were used. Fields read: `output.meta.phase`,
    `output.meta.e2e.draft.status`, `output.meta.e2e.draft.errors`, `session_id`.
  counted_by: maintainer
  counted_on: 2026-09-27
  notes: |
    `storage/` is git-ignored, so the files exist only on that machine. The directory keeps
    growing; later jobs are not part of this record.

outcome: negative

unexpected_behavior:
  - The draft stage failed on its first attempt in every session, which is what was reported as "draft pembuatan verify-browser selalu gagal di pertama kali".
  - No selector error named `testid`; the selector errors were keys the schema never had.

limitations:
  - One project, one operator who is also the tool's author, one week, builds still changing.
  - Only the first error of each draft is tabulated; a draft usually carried several.
  - The job files do not record which provider or model drafted each spec.

related: [DEC-006, CASE-004]
related_notes: DEC-006 is the response; CASE-004 is the same maintainer's usage telemetry.

implementation:
  version: 3.6.x–3.7.2 (observed); response in 3.7.3
  commits_note: jobs span several commits
  feature: /.verify-browser stage 1 (draft) validation

disposition:
  implementation_status: implemented
  validation_status: observed
  validated_by: maintainer
  validated_on: 2026-09-27
