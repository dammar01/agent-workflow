schema_version: 2
id: CASE-010
title: Verify latency varies by up to 3x its median within a project, and the graph lookup grows with node count to 9 s
recorded_on: 2026-09-30
visibility: sanitized
environment: private_production
repository_identity: undisclosed (fourteen maintainer projects with a usage stream and sixteen with a graph, this repository among them)
evidence_tier: creator_observation
confidentiality_note: |
  Projects are identified only by graph size (node count), never by name, task, prompt,
  or output text. Figures are counts and durations from runtime streams, and timings of a
  read-only call into the runtime's own graph code.

context: |
  The maintainer suspected that graph work lengthens a delegated verify and wanted it
  measured before any change. Verify latency also comes from the provider and from the tests a verify decides to
  run, and the maintainer observed that reasoning effort changes speed and token use.
  The spread of verify latency also decides what a comparison can show: a difference
  smaller than the spread cannot be told from chance without pairing.

task: |
  Measure, across every local project, how much verify duration varies, how long the
  runtime's graph lookup takes as the graph grows, how often a verify runs a test command,
  and what the provider's cached input share is.

workflow: |
  Three read-only passes, by a script, on 2026-09-30:
  1. `.workflow/data/usage.jsonl` (or `.workflow/usage.jsonl` in workspaces not yet
     migrated) of each project: rows grouped into commands by `prompt_id`, a continuation
     summed into one duration, reuse hits and failed commands left out.
  2. For each `graphify-out/graph.json`: `graph_index.load_graph` and `graph_index.top_files`
     timed on this machine with a fixed four-word hint. `is_stale` was not called, because it
     writes a cache file into the project.
  3. Verify output artifacts (`logs/*_verify_*/output.raw.md`) searched for a test command
     (`tests/run.py`, `artisan test`, `phpunit`, `pest`, `npm test`, `vitest`, `jest`,
     `pytest`, and similar).

observation: |
  Window: 2026-08-15 to 2026-09-30. 14 projects, 1,890 usage rows, 543 successful verify
  commands.

  Verify duration per project (projects with at least 10 verify commands):

  | Graph nodes | Verify commands | Median | IQR / median |
  | --- | --- | --- | --- |
  | 0.3k | 12 | 240 s | 54% |
  | 1.7k | 33 | 76 s | 299% |
  | 2.0k | 171 | 38 s | 136% |
  | 2.7k | 16 | 352 s | 51% |
  | 5.0k | 11 | 266 s | 90% |
  | 5.9k (this repository) | 123 | 188 s | 104% |
  | 5.9k | 38 | 366 s | 76% |
  | 14.9k | 104 | 206 s | 113% |
  | 34.6k | 13 | 100 s | 34% |
  | all projects pooled | 543 | 122 s | 177% |

  Graph lookup, sixteen graphs (0.1-78 MB, 98-34,620 nodes): parsing graph.json took
  3-639 ms. Ranking files (`top_files`) took 44 ms-9.1 s and rose with node count (Spearman
  0.91, n = 16): 1.7 s or less up to 5.9k nodes, 4.8 s at 14.9k, 9.1 s at 34.6k. Against
  the median verify of the same project, ranking alone is 0.04-1.6% up to 5.9k nodes, 2.3%
  at 14.9k, and 9.1% at 34.6k. The one delegated call recorded with `graph_ms` (usage
  contract version 3, this repository) took 1,234 ms for the whole lookup, against 803 ms
  for ranking alone on the same graph.

  `graphify update` in the refresh hook's rows: 1.8-2.5 s on graphs up to 6 MB, 71.6 s on
  the 34.6k-node graph. Since DEC-012 it runs detached and is not part of a verify.

  Of 656 verify output artifacts on disk, 309 (47%) name a test command; per project with at
  least ten artifacts, 12% to 81%. Whether the whole suite or a subset ran is not
  distinguishable from the text.

  Provider cached input, verify commands with measured tokens: 72-96% of input per project;
  median input per verify command up to 11.5 million tokens in this repository.

  Reasoning effort is recorded nowhere in the usage stream or the call meta, so the
  maintainer's observation (high effort slower and costlier than low; similar results for
  exploration, better for analysis) cannot be read from existing data. The same pass found
  that `provider_resumed`, added to the usage row earlier that day, stayed empty for codex:
  codex reported `resumed` on the result meta only, not on the call meta the usage row
  reads. Resume itself worked: the delegated calls of that session shared one provider
  thread and reported `resumed: true` in their result.

evidence:
  source: |
    `usage.jsonl` of fourteen projects (fields command, prompt_id, ok, reused_evidence,
    duration_seconds, actual_input_tokens, actual_cached_input_tokens, graph_ms, recorded_at);
    `quality.jsonl` rows `kind: graph_refresh` (graphify_ms); `graphify-out/graph.json` of
    sixteen projects; verify `output.raw.md` artifacts under `.workflow` of each project.
  counted_by: maintainer (script run by main_agent in a maintainer session)
  counted_on: 2026-09-30
  notes: |
    Timings of the graph lookup are one run each, on one machine, with a hint that was not a
    real task. Quantiles are linear interpolation. A command's duration is the sum of its
    rows, as `telemetry.report` counts time to completion.

outcome: mixed
unexpected_behavior:
  - Ranking files in the graph lookup, not parsing the graph, is the costly part, and it runs on every delegated call, not only after a refresh.
  - "Codex resume state never reached the usage row: it was written on the result meta only."
limitations:
  - Fourteen projects of one maintainer, one machine; not a general result.
  - Graph lookup timed once per graph with a synthetic hint; a real task text can rank differently.
  - Verify duration mixes providers, models, and task sizes; the spread is an upper bound on noise, not a per-model figure.
  - The test-command search counts mentions in the reply, not test runs, and cannot tell a full suite from a targeted one.
  - These figures motivate the draft hypotheses that cite this record; they set none of their thresholds, which are fixed from general benchmarks before any run.
related: [CASE-006, CASE-008, CASE-009, DEC-012]
related_notes: |
  CASE-006 and CASE-008 gave the first latency and graph-refresh figures on two projects;
  this record widens them to all projects and adds the lookup inside each call. CASE-009
  counted verify outcomes and evidence reuse over the same streams. DEC-012 moved the refresh
  out of the turn; the lookup measured here is the part it did not touch. Draft records H-009,
  EXP-004, and H-010 take their motivation from this record, not their thresholds.

implementation:
  version: 3.7.3 with the unreleased v3.8.0 usage contract version 3 (graph_ms on one row)
  commits_note: "Observation only; the v3.8.0 telemetry it read is not committed yet."
  feature: graph leads lookup, usage stream, graph-refresh hook, verify

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-13]
