schema_version: 3
id: CASE-015
title: Codex on Windows failed a resumed verify at its elevated sandbox, and the runtime called it `unknown`
recorded_on: 2026-10-04
visibility: public
environment: maintainer_development
repository_identity: agent-workflow
evidence_tier: creator_observation

context: |
  The maintainer reported that the codex second agent often fails on Windows with an explicit
  sandbox error, more so on newer codex releases. The runtime runs codex with
  `--sandbox read-only` and resumes the session's thread for later calls.

task: |
  Two delegated verifies of the same change, in one session, through codex.

workflow: |
  `.workflow/run.ps1 verify` on Windows. The first call opened a new codex thread; the second
  resumed it (`codex exec resume <id>`).

observation: |
  - The first verify, on a new thread, completed in 471 s with a parseable verification.
  - The second, resuming that thread, failed before doing any work. codex stderr:
    "Failed to create session: failed to load AGENTS.md instructions for environment `local`:
    fs sandbox helper failed with status exit code: 1: windows sandbox failed: elevated Windows
    sandbox requires effective `:root` read access", then "thread/resume failed ... (code
    -32603)".
  - The runtime returned `ok: false`, `error_type: unknown`, and a next action that only says to
    read the logs and rerun. Nothing in the result names the sandbox or how to fix it.
  - The adapter records no codex version, so the release that produced the error is not in the
    trail.

evidence:
  source: |
    The two verify logs of this repository's session on 2026-10-04
    (`logs/20261004_054622_049477_verify_53059772` and `logs/20261004_055901_221134_verify_f2a2a14f`
    under the session directory), their runner JSON (`meta.error_type`, `meta.stderr`,
    `meta.resumed`), and `adapters/providers/codex_adapter.py` at commit 8d2d42b (error
    classification, no version capture).
  counted_by: main agent
  counted_on: 2026-10-04

outcome: negative
unexpected_behavior:
  - A new thread worked and a resumed one failed, under the same sandbox flag.
  - A sandbox failure is classified `unknown`, with no actionable next step.
limitations:
  - One failure, one machine; the maintainer's report that it is frequent is not counted here.
  - The codex release is unknown, so the dependence on version cannot be shown from this case.
related: []

implementation:
  version: 3.8.0
  commits: [8d2d42b7260139278a57924c319155a5767ddde2]
  feature: codex adapter, delegated verify

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-07a]
