schema_version: 3
id: CASE-012
title: Real-use task outcomes on nine projects — what reached main, what needed a fix, and what it cost
recorded_on: 2026-10-04
visibility: sanitized
environment: private_production
repository_identity: undisclosed (nine private projects of one maintainer, named Project A-I by task count; agent-workflow itself excluded)
evidence_tier: creator_observation
confidentiality_note: |
  Projects are described by kind, stack and size only. No project name, prompt, task text,
  file path, author, or code is recorded here. Task categories were labelled by the main
  agent from each session's first prompt and its change; the labels file lives in the
  git-ignored drafts area (`docs/research-drafts/_data/real-use-task-labels.json`).

context: |
  CASE-011 counted what a 3.7.3 session cost the user, but not whether the work was kept.
  Senior SWE-bench grades agents on underspecified, senior-level tasks by verifiers and a
  taste judge; this record applies the same question to work that was actually done with
  agent-workflow — did the change reach the main branch, and did it need fixing — without
  replaying anything. 3.6.0 and 3.7.3 are pooled and also reported apart. Between them the
  bundle changed the command registry — verify-browser moved from a local to a delegated
  command under the pre-flight gate, and `/.help` was added — and the rest of the main
  agent's instructions stayed the same (`git diff v3.6.0 v3.7.3 -- dist/config/claude/CLAUDE.md`).

  The nine projects:

  | Project | Kind | Stack | Size (source files / test files) | Tasks |
  | --- | --- | --- | --- | --- |
  | A | Frontend of a multi-tenant work-management SaaS | Next.js 16, React 19 | ~570 / 29 | 29 |
  | B | API backend of the same SaaS, multi-tenant | Laravel 12 | ~920 / 138 | 23 |
  | C | Finance and operations back-office, in use since 2022 | Laravel 13 | ~3,100 / ~360 | 13 |
  | D | Code-audit automation service run from CI | Python | ~75 / 19 | 10 |
  | E | Internal analytics dashboard with a scheduled ETL job | Next.js 16, Bun | ~100 / 9 | 10 |
  | F | Company operations app (scheduling, permissions), in use since 2020 | Laravel 13, Vue 2 | ~460 / 16 | 4 |
  | G | A second working copy of C, used for branch reviews and CI | Laravel 13 | as C | 4 |
  | H | HR performance-review frontend; works on a `production` branch | Next.js 16 | ~1,260 / 156 | 3 |
  | I | HR attendance app, in use since 2020 | Laravel 13, Vue 2 | ~520 / 45 | 1 |

task: |
  167 sessions between 2026-09-15 and 2026-10-03 whose last bundle banner is 3.6.0 (98) or
  3.7.3 (69). 97 were coding tasks — 68 features, 26 bugs, one each of performance,
  migration and refactor; the other 70 were investigation (24), review of a working tree
  (13), and operations such as upgrades, deploy reports and promotion (33).

workflow: |
  The global bundle in every session; delegated explore/analyze/plan/verify/verify-browser
  through `.workflow/run`, mostly invoked by skills; implementation by the main agent
  (`/.execute -y`); commits made by the maintainer.

observation: |
  Outcome rule (the maintainer's): a task is solved when 80% or more of the lines its
  session left behind entered branch main; solved tasks whose lines were changed on main
  within 24 hours by an author of the commits that brought them in count as fixed after the
  fact. 30-80% is partial; less is not in main.

  | Group | Tasks | Solved | Solved clean | Solved, fixed within 24 h | Partial | Not in main | No change | Prompts (median) | Active min (median) |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | All | 97 | 68 (70%) | 47 (48%) | 21 | 13 | 9 | 7 | 9 | 53 |
  | 3.6.0 | 61 | 39 (64%) | 20 (33%) | 19 | 11 | 5 | 6 | 11 | 61 |
  | 3.7.3 | 36 | 29 (81%) | 27 (75%) | 2 | 2 | 4 | 1 | 8 | 41 |
  | Feature | 68 | 46 (68%) | 31 (46%) | 15 | 12 | 8 | 2 | 10 | 64 |
  | Bug | 26 | 19 (73%) | 14 (54%) | 5 | 1 | 1 | 5 | 9 | 37 |
  | Performance, migration, refactor | 3 | 3 | 2 | 1 | 0 | 0 | 0 | 8-13 | 43-95 |

  By delegated calls per task (82 of 97 tasks delegated; median 4 calls). A call is a prompt a
  provider answered; verify-browser's spec and review stages are each one:

  | Calls | Tasks | Solved | Clean | Fixed 24 h | Prompts | Active min | Final context | Saved |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | 0 | 15 | 8 (53%) | 8 | 0 | 5 | 19 | 108k | 0 |
  | 1-2 | 20 | 14 (70%) | 12 | 2 | 6 | 33 | 152k | 170k |
  | 3-5 | 28 | 23 (82%) | 15 | 8 | 9 | 53 | 201k | 671k |
  | 6+ | 34 | 23 (68%) | 12 | 11 | 16.5 | 101 | 354k | 1.4M |

  Follow-up prompts per task (mean; the first prompt is the request): plan 0.8, execute or
  approve 1.6, fix or correction 1.5, question 2.1, verify 1.7, further exploration 0.3,
  new change request 0.5, other (reports, summaries, information) 2.4. 3.7.3 against 3.6.0:
  fix 1.0 against 1.8, plan 0.6 against 1.0, verify 1.4 against 1.9.

  Main-agent context per task: final median 210k tokens (p90 491k, largest 694k); 3
  sessions were compacted.

  Context saved — tokens kept from entering the main agent: what the second agent read
  fresh (input minus cache read) less the answers that came back to the main agent. Median
  574k per task (p90 1.8M), 78.7M over all 97, a median 2.4 times the main agent's own final
  context; 3.6.0 636k, 3.7.3 531k; features 638k, bugs 291k. Per task the second agent read
  a median 583k fresh and returned 9k; its 7k of reasoning is output and is not counted. The
  status line's `Saved` adds that reasoning (609k median, 81.3M in all). 19 tasks include rows
  the provider did not count, whose reading is missing from the figure.

  The digest saving — the part of the answer the digest stood in for,
  `premium_context_avoided_tokens` — is a lower bound beside it: median 8.0k per task, 929k
  in all. The runtime recorded 6.7k and 779k; the rest is the verify-browser rows it left
  empty (below).

  By project: A 19/29 solved (14 clean), B 20/23 (14), C 8/13 (8), D 10/10 (4), E 5/10
  (2), F 2/4 (1), G 3/4 (3), H 0/3, I 1/1 (1). 35 of 68 solved tasks touched a test file,
  20 of them in B and none in A.

evidence:
  source: |
    `python tools/maintain/measure_task_outcomes.py --projects-root <projects> --labels
    docs/research-drafts/_data/real-use-task-labels.json --version 3.6.0 --version 3.7.3`,
    which reads Claude Code transcripts `~/.claude/projects/<project slug>/*.jsonl` (prompts,
    successful Edit/Write/MultiEdit results, assistant `usage`), each project's Git history
    on branch main (first-parent states, file contents, commit authors), and each project's
    `.workflow/data/usage.jsonl` (`prompt_id`, `actual_input_tokens`,
    `actual_cached_input_tokens`, `actual_reasoning_tokens`, `premium_context_avoided_tokens`). Run on
    2026-10-04 against the repositories' state that day.
  counted_by: main agent
  counted_on: 2026-10-04
  notes: |
    The prompt classifier agreed with a hand label on 68 of 80 sampled follow-ups (85%);
    its misses were mostly problem reports without a keyword, so the fix count is a lower
    bound. It was revised once on a first sample and checked on a second.

    Four measurement errors were found and corrected before these figures: Git paths were
    compared in lower case (PHP files looked absent); files moved to another directory were
    not followed; the share was measured at HEAD, which penalised older sessions; and
    delegated calls were first counted from the main transcript, where skill-run calls do
    not appear (a median of 0 instead of 4). A fifth was the runtime's own: the digest
    saving was missing on verify-browser's rows, and the tool recovers it from the archived
    replies with the runtime's rule (`saved_tokens`), reporting the recorded figure beside
    it. Context saved first used the digest saving, then the status line's figure; it now uses
    the net reduction (`saved_net`), the maintainer's definition of saved: tokens kept from
    entering the main agent. The verify-browser rows do not affect it, because they carry
    provider token counts. The tool reproduces every figure above.

outcome: mixed
unexpected_behavior:
  - Tasks with 6 or more delegated calls were the largest (median 101 active minutes, 354k final context) and needed a fix within 24 hours most often (11 of 23 solved).
  - In 3.6.0, 19 of 39 solved tasks were changed by the same author within 24 hours, against 2 of 29 in 3.7.3; the 3.6.0 period was dominated by features built over many consecutive sessions, so the difference is not attributed to the version.
  - Delegation kept a median 2.4 times the main agent's whole final window out of it per task (1.4M for tasks with 6 or more calls), while 9k of answers came back; the digest stood in for about 1% of what was kept out (8.0k).
  - "Since commit cb98768 (2026-09-15) verify-browser's spec and review stages call `_run_delegated` directly (`core/evidence/e2e/runner.py`), skipping the digest extraction of the main delegated path (`core/provider/executor.py`), so their usage rows carry no digest and no `premium_context_avoided_tokens`. Across every local usage stream 159 such rows had a parseable digest in their archived reply, worth 334,905 tokens against 2,345,449 recorded (about 14% under-counted); 80 more had no archived reply left. The review rows are also recorded with command `verify`, which mixes verify-browser reviews into verify counts and verdicts."
limitations:
  - One maintainer, nine projects; A and B hold 52 of the 97 tasks.
  - Entering main means the maintainer accepted the change, not that it is correct; there is no behavioural verifier and no review of quality.
  - A change by the same author within 24 hours may be a continuation rather than a fix; the rule counts both as fixes.
  - Task categories and prompt kinds are heuristic labels by the main agent, not yet checked by the maintainer.
  - A session is the unit; one session can hold several tasks, and one feature can span several sessions.
  - Project H works on a `production` branch, so the main-only rule counts its 3 tasks as not in main.
  - Delegated and non-delegated tasks differ in size, so the table by calls does not show an effect of delegation.
  - Context saved assumes the main agent would have read what the second agent read; it includes the second agent's own fixed overhead per call (its system prompt and instructions, which the runtime does not separate), so it overstates the reduction somewhat. The digest saving is a lower bound.
  - No arm without agent-workflow; nothing here says the workflow raises the rate.
related: [CASE-011, CASE-009]
related_notes: |
  CASE-011 is the 3.7.3 session baseline (prompts, corrections, time) counted with
  measure_real_use.py, whose delegated-call count was corrected in the same change as this
  record. CASE-009 found that verify verdicts rarely pass, which is why acceptance on main is
  used here instead of the verify verdict. A review of correctness and quality on a sample of
  the solved tasks is drafted as H-014 and EXP-008.

