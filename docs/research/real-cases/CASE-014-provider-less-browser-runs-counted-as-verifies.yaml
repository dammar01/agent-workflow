schema_version: 3
id: CASE-014
title: Browser runs that never reached a provider were recorded as verify usage rows — 197 of 836 in the CASE-009 window
recorded_on: 2026-10-04
visibility: sanitized
environment: private_production
repository_identity: undisclosed (fourteen local projects of one maintainer)
evidence_tier: creator_observation
confidentiality_note: |
  Only counts are recorded; no project is named.

context: |
  The maintainer reported that the status line's second-agent figures did not add up after
  `/.verify-browser`. A verify-browser run that ends before its review stage (browser verdict
  incomplete, preflight refused, spec or env invalid, no request) reaches no provider, yet
  `Executor._record_usage` wrote a `verify` usage row for it from an empty call meta.

task: |
  Find the rows behind the mismatch and count how many of them the verify figures of CASE-009
  and CASE-010 contain.

workflow: |
  A read-only script over `.workflow/data/usage.jsonl` (or `.workflow/usage.jsonl`) of every
  local project, verify rows recorded 2026-08-15 to 2026-09-30, the window CASE-009 used. A
  provider-less browser row: `command: verify`, no `prompt_id`, no `provider`, not
  `reused_evidence`, and no actual or estimated input tokens. An ordinary verify always has a
  prompt id, so the shape is unambiguous.

observation: |
  | | Rows | pass | incomplete | fail | no verdict | with a duration |
  | --- | --- | --- | --- | --- | --- | --- |
  | Verify rows in the window, recounted | 836 | 19 | 445 | 280 | 92 | 639 |
  | Provider-less browser runs | 197 | 0 | 197 | 0 | 0 | 0 |
  | Delegated verify rows | 639 | 19 | 248 | 280 | 92 | 639 |

  - The 197 rows come from three of the fourteen projects (166, 19 and 12 rows).
  - Without them, pass is 19 of 639 (3.0%) instead of 19 of 836 (2.3%), and `incomplete` is
    38.8% instead of 53.2%. Verify still rarely passes; most non-passing rows are now `fail`.
  - None of the 197 carries a duration, so latency figures built from measured durations, as
    in CASE-010, do not contain them; counts of verify commands do.
  - The status line counts a row without a prompt id as one command, so each such run showed
    as one more second-agent call.

evidence:
  source: |
    `usage.jsonl` of the fourteen projects, fields command, prompt_id, provider,
    reused_evidence, actual_input_tokens, estimated_input_tokens, verdict, accepted,
    duration_seconds, recorded_at; verify rows with recorded_at 2026-08-15 to 2026-09-30,
    counted on 2026-10-04.
  counted_by: main agent
  counted_on: 2026-10-04
  notes: |
    The recount finds 836 verify rows in the window where CASE-009 counted 820 on 2026-09-30;
    the 16-row difference was not traced. CASE-009 is therefore not corrected in place: its
    figures stand as counted, and this record gives the split.

outcome: negative
unexpected_behavior:
  - A command that made no provider call was billed as a judged, zero-token verify.
limitations:
  - The rows were identified by shape, not by a field naming them; a future row of the same
    shape from another path would be counted here too.
  - The 16-row difference to CASE-009 is unexplained.
related: [CASE-009, CASE-010]
related_notes: |
  CASE-009's verify outcome table includes these rows; CASE-010's duration figures do not,
  its command counts may. DEC-022 stops writing them and drops their shape from the report.

implementation:
  version: 3.7.3 to 3.8.0
  commits: []
  commits_note: rows written by every release that shipped verify-browser before 8d2d42b
  feature: usage stream, verify-browser

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-07a, RQ-11]
