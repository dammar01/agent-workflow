schema_version: 3
id: CASE-020
title: Headless simulation of DEC-046 scenarios A, C and D — routing holds, delegated calls cannot finish
recorded_on: 2026-10-06
visibility: public
environment: synthetic
repository_identity: undisclosed
evidence_tier: creator_observation

context: |
  DEC-046 (new behavior goes through plan; only `/.execute -y` approves) followed CASE-018,
  where real use executed feature requests without a plan. The bundle carrying DEC-046 was
  installed and a re-run in real use was pending. As a stand-in, scenarios that need no human
  answer were simulated.
task: |
  Re-run CASE-018 scenarios A (feature instruction, no plan), C (fix list) and D (spec as
  text) against the 3.8.1 bundle with DEC-046, in fresh headless sessions.
workflow: |
  `claude -p` (Claude Code 2.1.291), one fresh session per scenario, in a throwaway git
  fixture with `.workflow` initialised and codex as second agent; `--permission-mode
  acceptEdits` so edits were not blocked by permissions. Round 1 left the runner and skill
  reads unpermitted; round 2 allowed them and resumed the session for a second turn.
observation: |
  Seven turns, zero files changed (`git status` after each).
  - A and C (round 1): both resolved to `/.plan`, not execute; no edit and no local gather
    after the runner was refused permission.
  - A (round 2): resolved to `/.plan`, read the plan skill, delegated to codex. The second
    turn "oke, setuju, lanjut" made no edit and stated that it does not count as approval and
    that `/.execute -y` is needed.
  - D: round 1 delegated an explore because the fresh session held no evidence; round 2
    explored first, but no evidence ever reached the second turn (below).
  - In every turn that delegated, the runner ran as a background task and `claude -p` exited
    before it finished, so no delegated call ever returned; the agent re-ran the identical
    request per the recovery rule instead of guessing.
  Approximate Claude cost USD 1.9 across the seven turns.

evidence:
  source: |
    stream-json transcripts and `git status` captured per turn in the maintainer's scratch
    directory, 2026-10-06 (tool-use counts, permission denials, result text, cost fields).
  counted_by: maintainer
  counted_on: 2026-10-06

outcome: inconclusive
unexpected_behavior:
  - Headless `claude -p` cannot complete any delegated command, because the workflow
    requires the runner as a background task and the process exits with it.
limitations:
  - Synthetic fixture and headless sessions; not the real use the release gate requires.
  - No plan ever completed, so stopping after a finished plan was not observed.
  - B (answers through AskUserQuestion) and E (writing another project) cannot be simulated headless.
  - D's trigger condition (evidence already in context) was never reached.
related: [CASE-018, DEC-046]
related_notes: |
  Re-runs CASE-018 scenarios A, C and D against DEC-046; real use for B, D and E is still pending.

