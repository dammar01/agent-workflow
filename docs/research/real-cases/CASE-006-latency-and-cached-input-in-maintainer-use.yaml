schema_version: 2
id: CASE-006
title: Latency by project and cached input share in maintainer use
recorded_on: 2026-09-29
visibility: sanitized
environment: maintainer_development
repository_identity: undisclosed (maintainer projects); agent-workflow for the counted figures
evidence_tier: creator_observation
confidentiality_note: |
  Projects other than agent-workflow are described by kind only (a frontend web project, a
  large Laravel backend). Figures are counted from metadata fields of this repository's usage
  stream; no prompt, task, or evidence text was read.

context: |
  The maintainer uses agent-workflow daily on several private projects and on this
  repository. The status line shows a "Second Agent <tokens> (<cached>)" badge, summed from
  `actual_cached_input_tokens` of the session's usage rows, and a "Saved" figure that
  excludes cache read.

task: |
  Everyday delegated work (explore, analyze, plan, verify) and execute turns.

workflow: |
  Delegated calls run as background jobs through `.workflow/run`; within one main session the
  second agent's provider thread is continued (`second_agent_thread=REUSE`, `resumed: true`).
  The graph-refresh Stop hook runs at the end of turns carrying an execution result.

observation: |
  Maintainer report (not counted):
  - Latency is felt at the end of execute turns, in execute+verify turns, in verify alone,
    and when the main agent runs `graphify update` itself.
  - Verify latency is inconsistent and follows the active project: slower on a large Laravel
    backend than on a frontend project.
  - The cached share in the status-line badge looks high.

  Counted from `.workflow/data/usage.jsonl` of this repository:
  - 219 rows carry provider token counts (2026-09-05 .. 2026-09-29): 2,335,753,298 input
    tokens, of which 2,234,455,040 cached (95.7%). Codex 211 rows at 95.7%, OpenCode 5 rows
    at 89.9%.
  - One main session on 2026-09-29, four delegated calls on one continued provider thread:

    | Call | Input tokens | Cached | Duration (s) |
    | --- | --- | --- | --- |
    | explore (new thread) | 2,771,316 | 2,600,192 | 342 |
    | analyze (resumed) | 6,884,380 | 6,485,760 | 392 |
    | plan (resumed) | 10,410,546 | 9,876,992 | 511 |
    | plan (resumed) | 12,655,542 | 11,958,528 | 851 |

evidence:
  source: |
    `.workflow/data/usage.jsonl`, rows with `actual_input_tokens` present; fields `provider`,
    `session_id`, `command`, `actual_input_tokens`, `actual_cached_input_tokens`,
    `duration_seconds`, `recorded_at`. Resume state from the call results' `meta.resumed` of
    the four jobs of session main_agent-workflow_20260929_142604838_98db.
  counted_by: main agent
  counted_on: 2026-09-29
  notes: |
    Counted by the main agent with a script over the usage stream; not yet re-counted by the
    maintainer.

outcome: inconclusive
unexpected_behavior:
  - Input per call grew about 4.6x across four calls of one continued thread.
limitations:
  - The four calls had different tasks and scopes; growth in input and duration is confounded with task size.
  - The latency comparison between projects is a report, not a measurement.
  - Cached input is what the provider reported; how the provider bills or times it is outside the runtime.
related: []
related_notes: |
  Drafts, named as plain text: H-008 explains the cached share; DEC-012 covers the hook part
  of the latency; H-004 covers knowledge reuse, which the cached share must not be read as;
  CASE-004 is the earlier telemetry snapshot of the same stream.

implementation:
  version: 3.7.3
  feature: delegated calls, provider continuation, status line, graph-refresh hook

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-13]
