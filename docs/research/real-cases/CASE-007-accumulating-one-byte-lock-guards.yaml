schema_version: 2
id: CASE-007
title: One-byte lock guards accumulate and look like a defect
recorded_on: 2026-09-29
visibility: public
environment: maintainer_development
repository_identity: agent-workflow (this repository)
evidence_tier: creator_observation

context: |
  The maintainer noticed lock files in the `.workflow/` tree that are always empty and asked
  what they are for. The concern was curiosity and visibility in the file explorer; no lock
  conflict or blocked job was reported.

task: |
  Everyday use of delegated commands; the files are a side effect of the runtime.

workflow: |
  Each main session gets `sessions/<id>/runtime/` with a runtime lock and its transition
  guard (`core/workspace/runtime_lock.py` `_RuntimeTransitionGuard`), and the evidence store
  keeps `evidence.jsonl.lock`.

observation: |
  Outside `.workflow/data/backups/`, on 2026-09-29: 83 files
  `sessions/<id>/runtime/lock.guard` and one `evidence.jsonl.lock`, each 1 byte. No
  `facts.jsonl.lock` or `e2e-knowledge.jsonl.lock` remained. The guard is written with a
  single NUL byte, locked with msvcrt/fcntl, and never removed; one is left per session.

evidence:
  source: |
    `find .workflow -path "*/backups" -prune -o \( -iname "*.lock" -o -iname "*.guard" -o
    -iname "*.reclaim" \) -printf "%s %p\n"`, grouped by path pattern.
  counted_by: main agent
  counted_on: 2026-09-29

outcome: mixed
limitations:
  - One workspace; the count grows with the number of sessions, not with any defect.
related: []
related_notes: |
  Draft, named as plain text: DEC-013 documents the guards and removes those of dead sessions.

implementation:
  version: 3.7.3
  feature: runtime lock transition guard, evidence store lock

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-13]
