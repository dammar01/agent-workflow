schema_version: 2
id: CASE-009
title: Across fourteen projects, 2% of verify rows pass and no command is served from reused evidence
recorded_on: 2026-09-30
visibility: sanitized
environment: private_production
repository_identity: undisclosed (fourteen maintainer projects, this repository among them)
evidence_tier: creator_observation
confidentiality_note: |
  Only counts per stream field are recorded, never project names, tasks, prompts or
  verdict text. The projects are the maintainer's local workspaces that carry a usage stream.

context: |
  `report` derives `accepted` from a verify row whose derived verdict is `pass`, and
  first-pass correctness and tokens per accepted task from that. In this repository it read
  1 accepted task of 63 judged, 0 first-pass, and 2.5 billion tokens per accepted task. In
  the session that recorded this, five delegated verifies ran. One was a real NEEDS FIX. The
  other four replied DONE, and the local test suite passed each time, yet the runtime derived
  `incomplete` three times and `fail` once: the second agent ran read-only, could not run
  the tests, and listed them under not_verified, which makes the derived verdict
  `incomplete`; the `fail` is the "none" entry below. The maintainer reports the
  same pattern in other projects. The same session found `report.evidence_reuse` at 0 of 173
  in this repository.

task: |
  Count, across every local project with a usage stream, how verify rows end and how often
  an exploration or reasoning command was served from a stored evidence artifact.

workflow: |
  A read-only script over `.workflow/data/usage.jsonl` (or `.workflow/usage.jsonl` in
  workspaces not yet migrated) of each project: verify rows by `verdict` and `accepted`;
  exploration and reasoning rows grouped into commands by `prompt_id` (a continuation
  counted once, as `telemetry.evidence_reuse` does) and checked for `reused_evidence`.

observation: |
  | | Rows or commands | Share |
  | --- | --- | --- |
  | Projects with a usage stream | 14 | |
  | Verify rows | 820 | |
  | derived verdict `pass` | 19 | 2.3% |
  | derived verdict `incomplete` | 438 | 53.4% |
  | derived verdict `fail` | 275 | 33.5% |
  | no verdict (call failed) | 88 | 10.7% |
  | `accepted: true` | 19 | 2.3% |
  | Exploration and reasoning commands | 999 | |
  | served from reused evidence | 0 | 0% |

  - Seven of the fourteen projects never had a verify row pass; the largest stream (343
    verify rows) had 15.
  - Evidence reuse is on by default (`allow_reuse` is true unless `--fresh-session`), yet no
    command in any project was served from a stored artifact.
  - In the recording session, one re-verify reply carried a single blocking entry whose
    problem, trigger, impact and fix all read "none"; the runtime counted it as a blocking
    finding and returned `fail` (job_20260929_150634_399054).

evidence:
  source: |
    `.workflow/data/usage.jsonl` or `.workflow/usage.jsonl` in each of the fourteen project
    roots, fields `command`, `verdict`, `accepted`, `role`, `prompt_id`, `reused_evidence`,
    all rows present on 2026-09-30 (verify rows dated 2026-08-15 to 2026-09-30). The five
    session verifies, in this repository: job_20260929_132534_553288,
    job_20260929_135338_943319 and job_20260929_141417_619771 (DONE, derived `incomplete`),
    job_20260929_145950_670536 (NEEDS FIX), job_20260929_150634_399054 (DONE, derived `fail`).
  counted_by: main agent
  counted_on: 2026-09-30
  notes: |
    Rows, not commands, for verify: a continuation writes one row per provider invocation,
    so a verify that continued is counted twice. No row records why a verdict was
    `incomplete`; the not_verified cause is shown for the recording session only.

outcome: negative
unexpected_behavior:
  - A verify whose reply says DONE and whose only gap is tests a read-only sandbox cannot run is derived `incomplete`, so `accepted`, first-pass correctness and tokens per accepted task stay near zero whatever the work's quality.
  - A blocking entry reading "none" in every field is counted as a blocking finding.
  - Evidence reuse, enabled by default, never served a command in 999.
limitations:
  - "The cause of `incomplete` is known for three verifies in one session; for the other rows it is inferred from the maintainer's report and the verdict rule, not recorded."
  - "The projects differ in provider, sandbox and size; the shares are pooled across them."
  - "Verify rows include continuation duplicates, which weigh long verifies more."
  - "Why reuse never matches (exact query and context hashes, anchor freshness) is not measured here."
related: [CASE-006]
related_notes: |
  CASE-006 counted the same usage stream for latency and cached input. Drafts, named as plain
  text: DEC-015 completes a task on a DONE verify and would inherit the derived verdict's
  bias; H-004 expects stored knowledge to reduce re-exploration, which reuse at 0 does not
  yet show; H-008 explains the high cached-input share, which is provider caching, not reuse.

implementation:
  version: 3.7.3
  feature: delegated verify contract (derived verdict, accepted), evidence reuse, report
questions: [RQ-06, RQ-07a, RQ-11]

disposition:
  implementation_status: implemented
  validation_status: observed
