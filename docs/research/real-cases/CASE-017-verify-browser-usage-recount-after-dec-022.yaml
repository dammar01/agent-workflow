schema_version: 3
id: CASE-017
title: Verify-browser usage is one row per provider invocation after DEC-022; no miscount found, and no real run yet to confirm it
recorded_on: 2026-10-04
visibility: sanitized
environment: private_production
repository_identity: undisclosed (fourteen local projects of one maintainer)
evidence_tier: creator_observation
confidentiality_note: |
  Only counts are recorded; no project is named.
context: |
  The maintainer suspected that verify-browser's call and token figures were wrong, and could
  not say whether the figures that looked wrong were seen before or after commit 8d2d42b, which
  dropped the provider-less browser rows (DEC-022, CASE-014).
task: |
  Establish whether verify-browser usage is still miscounted after 8d2d42b.
workflow: |
  Two checks. A synthetic test drove a draft (first call, continuation, repair) and a run whose
  review needed a continuation, five provider invocations in all, through a fake adapter that
  reports different token counts on every call, and compared the usage rows, the report and the
  status line's counting rule with what the adapter reported. A read-only recount went over the
  `usage.jsonl` and `quality.jsonl` of every local project.
observation: |
  Synthetic run:
  - five usage rows for five invocations; stages draft x3 and run x2; each row's input,
    output, reasoning and cached tokens equal the adapter's figures for that call;
    `browser_seconds` only on the final row; `report.provider_calls` 5, `report.calls` 2, and
    the status line's rule gives 2.
  Recount (14 projects, 2045 usage rows):
  - 1 usage row after 8d2d42b (2026-10-04 06:26Z), a plain verify; no row with `e2e_stage`
    and no e2e quality row after it. There is no real verify-browser run to recount yet.
  - 209 older verify rows of the provider-less shape (2026-09-15 to 2026-10-02), all filtered
    by `report`.
  - 0 duplicate rows on prompt id, time and invocation index; 0 prompt ids recorded twice.
  - 382 `e2e_run` quality rows; the 174 with a review all join to usage rows. In 19 of them
    more usage rows join than the quality row's `provider_calls`, because that field counts
    stages, and a review needing a continuation is two invocations in one stage. No tokens are
    lost in the join.
evidence:
  source: |
    `tests/checks/e2e_routing.py` (`_check_browser_usage_is_one_row_per_invocation`);
    `.workflow/data/usage.jsonl` and `quality.jsonl` of fourteen local projects, fields command,
    e2e_stage, prompt_id, provider, provider_call_index, recorded_at and token counts, counted
    on 2026-10-04.
  counted_by: main agent
  counted_on: 2026-10-04
outcome: positive
unexpected_behavior:
  - The status line does not drop the old provider-less rows the way `report` does; for a session that still holds them it shows one extra call per row.
  - The quality rows' `provider_calls` counts stages, not invocations, under a name that suggests invocations.
limitations:
  - The verdict after 8d2d42b rests on the synthetic run; the first real verify-browser runs on 3.8.0 should be recounted.
related: [CASE-014, DEC-022]
related_notes: |
  CASE-014 found the provider-less rows; DEC-022 removed them. This case checks the fix.
implementation:
  version: 3.8.0
  commits: [8d2d42b7260139278a57924c319155a5767ddde2]
  feature: verify-browser usage rows
disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-07a, RQ-11]
