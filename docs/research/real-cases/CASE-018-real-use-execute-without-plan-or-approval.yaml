schema_version: 3
id: CASE-018
title: Real use of 3.8.1 — feature requests executed without a plan, plan answers taken as approval
recorded_on: 2026-10-05
visibility: sanitized
environment: private_production
repository_identity: undisclosed
evidence_tier: creator_observation
confidentiality_note: |
  Two private projects (a web frontend and its API backend) of the maintainer. Project names,
  feature content and code are left out; only workflow events and counts are recorded.

context: |
  Release gate for 3.8.1 includes safe real use. The maintainer ran fresh Claude Code sessions
  in two private projects with the 3.8.1 bundle installed (auto-intent mode, Windows,
  PowerShell hooks, codex as second agent) to build four features end to end.

task: |
  Implement four features across the frontend and backend, each to be proven by
  `/.verify-browser` and a manual test.

workflow: |
  Auto-intent with the pre-flight gate armed for delegated commands only. `/.execute` is a
  local, prompt-only command; nothing in the runtime or the hooks checks that a plan exists or
  that the user approved execution.

observation: |
  Twelve sessions on 2026-10-05 between 09:15 and 10:05 local time.
  - Runtime: 11 delegated calls (analyze, plan, verify), all `ok: true`, no `error_type`.
    `task-events` recorded 99 edit and 7 skill events in the frontend.
  - A. A feature request phrased as an instruction ("make it so that, when exporting, a dialog
    shows …") was announced as `[INTENT] execute`. No plan ran, no `-y` was given, no
    delegation happened: the main agent gathered with about 46 Bash calls across both
    repositories and wrote 12 files.
  - E. From that frontend session it also wrote to the backend repository through Python patch
    scripts run in Bash, ran `git reset HEAD -- <path>` on the backend index, and ran
    `php artisan tinker --execute` and `php artisan test` there. The user had agreed to a
    frontend-plus-backend scope through AskUserQuestion; nothing asked about writing the other
    repository. A concurrent backend session then had to re-plan "on top of a parallel diff".
  - B. In another session `/.plan` ran, the user answered its open questions through
    AskUserQuestion, and the main agent made 68 edits without `/.execute -y` and with no verify
    afterwards.
  - C. "Fix the following list" was resolved to execute and correctly stopped for `-y`, but did
    not suggest a plan; the user had to ask "isn't a plan needed first?".
  - D. "Give me the spec as text only" was followed by a 7-minute delegated `/.verify` nobody
    asked for.
  - The backend's `tasks.jsonl` recorded 0 edits while more than 15 backend files changed that
    day: Bash edits pass no Edit/Write hook, and the frontend hook drops paths outside its root.
  - No `/.verify-browser` ran that day; both verifies ended `incomplete` with zero tests.
  - Separately, in this repository, a delegated plan about these findings lost two research
    anchors: file names `DEC-021-task-events-…` and `DEC-045-task-notifications-…` were redacted
    as openai-style keys (`ta[REDACTED:…]`), which capped the plan's confidence to low.

evidence:
  source: |
    The Claude Code session transcripts of both projects for 2026-10-05 (tool_use names and
    inputs, AskUserQuestion results, `[INTENT]` lines); each project's
    `.workflow/data/usage.jsonl` rows with `recorded_at` from 2026-10-05T04:00Z;
    `.workflow/data/tasks.jsonl` rows by `kind`; `git status` of both repositories;
    `tools/maintain/measure_real_use.py --version 3.8.1` at 4a09c04. The redaction case:
    `utils.redact.redact_value` on the two file names.
  counted_by: main agent
  counted_on: 2026-10-05
  notes: |
    Edit counts are tool_use counts of Edit/Write per transcript; files written through Bash
    are not in them.

outcome: negative
unexpected_behavior:
  - A feature request phrased as an instruction is routed to execute, and execute without a plan is never refused.
  - Answers to a plan's open questions were treated as approval to execute.
  - A session wrote another repository through Bash, invisible to both projects' telemetry.
  - A delegated verify ran on a request for text.
  - Kebab-case file names containing "sk-" were redacted as keys.
limitations:
  - One maintainer, two related projects, one day, one main-agent model.
  - Whether the prompt contract alone (DEC-046) changes the behavior is not measured here.
related: [CASE-013, DEC-021, DEC-045]
related_notes: |
  CASE-013 is the earlier gate failure in the opposite direction (gate never armed). DEC-021
  is why Bash edits are not events. DEC-046 and DEC-047 are the decisions taken from this case.

implementation:
  version: 3.8.1
  commits: [4a09c04611de571b2b3e05b68d01bdff245d8ad5]
  feature: auto-intent routing, /.execute approval, task-events telemetry, redaction

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-10]
