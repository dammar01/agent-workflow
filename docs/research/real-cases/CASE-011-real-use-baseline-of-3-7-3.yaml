schema_version: 3
id: CASE-011
title: Real-use baseline of 3.7.3 — prompts, corrections, changes, and time per session
recorded_on: 2026-10-04
visibility: sanitized
environment: private_production
repository_identity: undisclosed (nine private projects of one maintainer; agent-workflow itself excluded)
evidence_tier: creator_observation
confidentiality_note: |
  Projects are counted under letters; no project name, prompt, task, file path, or code is
  recorded here. The hand classification of follow-ups was read in the maintainer's terminal
  only; this record keeps the labels' counts and the criterion, not the text.

context: |
  Which release is stable in real use had only been judged from release notes and tests.
  Delegated calls were already counted (CASE-006, CASE-009, CASE-010); what the user has to
  do around them — how often they prompt, correct, or wait — had never been counted
  (RQ-02: "No human-attention instrumentation"). Across the versions installed since
  2026-08-15, 3.7.3 was the one used on the most projects with no worker death and the
  lowest share of complaint-like prompts, so its sessions are taken as the baseline.

task: |
  Everyday work on nine private projects (web frontends, Laravel backends, an automation
  service): exploration, planning, implementation, verification, deploy preparation.

workflow: |
  Global bundle 3.7.3 in every session; delegated explore/analyze/plan/verify/verify-browser
  through `.workflow/run` as background jobs; implementation by the main agent
  (`/.execute -y`).

observation: |
  69 sessions on 9 projects, 2026-09-25 .. 2026-10-03.

  Prompts the user had to send:
  - 590 prompts, 8.6 per session on average; median 7 (p25 3, p75 11, p90 17, max 49).
    133 of them (23%) were workflow commands (`/.verify`, `/.execute -y`, ...).
  - 10 sessions (14%) needed a single prompt.
  - 521 follow-ups; median 6 per session (p90 16).
  - In the 49 sessions that changed code, the first successful edit came after a median of
    4 prompts (p25 2, p75 5, p90 7, max 15).

  Corrections (sanggahan):
  - Hand count on a fixed sample of 80 follow-ups: 12 corrections, 15.0% (Wilson 95%
    interval 8.8%..24.4%). Five more were ambiguous (a new requirement or a correction);
    counting them gives 17 (21.2%), and dropping the one retry caused by the environment
    gives 11 (13.8%).
  - Pattern count: 25 follow-ups (4.8%) in 13 sessions. On the sample the pattern found 1 of
    the 12 with no false positive (recall 0.08), so it is not an estimate of the rate; it
    is kept only as a trend signal.
  - 12 interrupts in 69 sessions (0.17 per session).

  Task size:
  - Delegated calls per session: mean 3.2, median 2, p90 8, max 17 (222 in all:
    verify 65, explore 44, plan 44, analyze 41, verify-browser 28). A call is a prompt a
    provider answered; verify-browser's spec and review stages are each one, and its review
    is logged as `verify` (CASE-012).
  - Main-agent tool calls per session: median 47 (p25 17, p75 113, p90 150).
  - Claude output tokens per session: median 37,363 (p90 107,286).

  Changes landed by successful edit tools:
  - 49 of 69 sessions (71%) changed files; 955 successful edits, 402 files, +28,125 / -3,547
    lines.
  - Per changing session: files median 5 (p25 3, p75 11, p90 19); lines added median 215
    (p90 1,275); lines removed median 25 (p90 170).
  - No session ran `git commit` itself; commits were made by the maintainer outside the
    session, so landed changes are edits, not commits.

  Time from first to last activity:
  - Active time (gaps over 15 minutes dropped): median 32.6 min (p25 9.0, p75 73.0,
    p90 98.5, max 241).
  - Wall clock: median 42 min, p90 1,262 min; sessions left open across days make it a poor
    measure.

  Delegated runtime (309 usage rows of these sessions):
  - ok rate 1.000 (0 errors). Duration median 110 s (p25 73, p75 272, p90 499).
  - Median by command: verify 78 s, verify-browser 76 s, explore 140 s, analyze 142 s,
    plan 190 s.
  - Verify verdicts: fail 23, incomplete 84, no verdict 72, pass 0 (as in CASE-009).

evidence:
  source: |
    `python tools/maintain/measure_real_use.py --projects-root <projects> --version 3.7.3`
    over the maintainer's projects: each project's `.workflow/data/usage.jsonl` (rows whose
    `session_id` is bound in a 3.7.3 transcript; fields `ok`, `error_type`, `verdict`,
    `command`, `duration_seconds`) and Claude Code transcripts
    `~/.claude/projects/<project slug>/*.jsonl` whose last `Workflow Main Agent — v` banner is
    3.7.3 (user messages, `tool_use`/`toolUseResult` of Edit/Write/MultiEdit/NotebookEdit,
    assistant `usage.output_tokens`, record timestamps). agent-workflow's own sessions are
    excluded (`--exclude` default). The sample is `--sample-rebuttals 80 --sample-seed 7`.
  counted_by: main agent
  counted_on: 2026-10-04
  notes: |
    Correction criterion for the hand count: the user says the main agent's result is wrong
    or incomplete, asks to redo or revert it, corrects an assumption or action it took, or
    reports the failure a change left behind. Questions, new requirements, format requests,
    and approvals are not corrections. Labelled by the main agent, not yet by the
    maintainer. The pattern was revised once on an earlier sample and not tuned on the
    sample counted here.

    Prompts follow `core.audit.transcript.is_human_turn`, less interrupt markers, compaction
    summaries (`isCompactSummary`, which `is_human_turn` itself still counts as a human
    turn), and built-in slash commands without arguments.

outcome: inconclusive
unexpected_behavior:
  - "`core.audit.transcript.is_human_turn` counts Claude Code's compaction summary as a human turn (15 such records across the maintainer's transcripts)."
  - "Delegated calls cannot be counted from the main transcript: a skill runs `.workflow/run` inside a subagent, so the command is in the sidechain. A first count from the transcript found a median of 0 per session; the usage rows give 2."
  - No verify verdict was `pass` in 179 verify and verify-browser rows.
limitations:
  - One maintainer, one machine, nine projects; not a general result.
  - No arm without agent-workflow; nothing here says the workflow lowers prompts or corrections, only what they were with 3.7.3.
  - Tasks differ by session and project; per-session figures mix small and large work. Two projects hold 46 of the 69 sessions.
  - Version comes from the banner of the global bundle; a project's own `.workflow` could lag it.
  - A transcript file is taken as a session; resumed or compacted sessions may split or merge work.
  - Line counts include whole files created by Write and generated files; they measure edits, not reviewed code.
  - Active time drops every gap over 15 minutes, including time the user spent testing outside the session.
  - The correction rate rests on one hand-labelled sample of 80 by the main agent.
related: [CASE-006, CASE-009, CASE-010]
related_notes: |
  CASE-009 counted the same absence of verify passes on a larger stream; CASE-006 and CASE-010
  measured delegated latency, which this record repeats only for the 3.7.3 sessions. The
  comparison of a later version against this baseline is drafted as H-013 and EXP-007.

implementation:
  version: 3.7.3
  commits: [414d073]
  feature: whole workflow in daily use (global bundle, delegated commands, execute)

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-02]
