# CASE — copy to CASE-NNN-<kebab-slug>.yaml. No transcripts, company names, internal URLs,
# source code, or business metrics. Every figure needs a source that can be re-counted.
schema_version: 1
id: CASE-NNN
title: <one line>
recorded_on: YYYY-MM-DD
visibility: public          # public | sanitized
environment: private_production   # private_production | maintainer_development | team_development | public_repository | synthetic
repository_identity: undisclosed
evidence_tier: creator_observation   # creator_observation | team_observation | controlled_experiment | independent_evaluation
confidentiality_note: |     # optional
  ...

context: |
  The engineering situation, without confidential information.
task: |
  What was being attempted.
workflow: |
  The relevant agent-workflow process.
observation: |
  What actually happened, with figures.

evidence:
  source: |
    The file, fields and range the figures were counted from.
  counted_by: maintainer
  counted_on: YYYY-MM-DD
  notes: |                  # optional
    ...

outcome: inconclusive       # positive | mixed | negative | inconclusive
unexpected_behavior: []
limitations:
  - <why this should not be generalized>
related: []
related_notes: |            # optional — how the related records relate
  ...

implementation:
  version: <version observed>
  commits: []               # optional; or commits_note when it spans several
  commits_note: <optional one line>
  feature: <feature observed>

disposition:
  implementation_status: implemented
  validation_status: observed
