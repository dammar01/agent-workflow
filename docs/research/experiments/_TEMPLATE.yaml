# EXP — copy to EXP-NNN-<kebab-slug>.yaml. The benchmark method lives here (arms, metrics,
# results). No commit anywhere: pin the version under test instead.
# Tracked here only once completed or abandoned, with its results.
schema_version: 3
id: EXP-NNN
title: <one line>
date: YYYY-MM-DD
status: planned             # planned | running | completed | abandoned
hypothesis: H-NNN
version_under_test: <agent-workflow version or tag>

objective: |
  The question this experiment answers.
setup: |
  Corpus, provider and model, configuration, what is held constant. Sanitized.
method: |
  Steps, number of runs, how results are judged.
arms:                       # optional — the conditions compared
  - name: <arm>
    description: <what differs>
metrics:                    # at least one; units explicit (work units vs provider rows)
  - name: <metric>
    definition: <how it is counted>
    unit: <unit>
# results:                  # required once completed
#   summary: |
#     ...
#   data_source: <file or artifact that can be re-counted>
#   figures:
#     - {metric: <name>, arm: <arm>, value: "<value>"}
# interpretation: |
threats_to_validity:
  - <sample size, operator influence, provider variance, prompt sensitivity>
outcome: pending            # pending | supported | partially_supported | rejected | inconclusive
related: []

disposition:
  implementation_status: not_applicable
  validation_status: not_validated
questions: [RQ-NN]          # the research question(s) this record serves; each RQ lists it back (CONTRACT.md §16)
