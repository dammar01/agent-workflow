# Research record schema — the contract every file under docs/research/ is checked against.
#
# Read by tools/maintain/check_research.py; described for people in CONTRACT.md. Changing a
# field here is a change to the contract: bump schema_version and record it as a DEC.
#
# Field specs:
#   type      str | text | date | int | bool | id | commit | enum | list | map
#             str: one line, non-empty. text: prose, may span lines, non-empty.
#             date: YYYY-MM-DD. id: a record ID (PREFIX-NNN; a research question is
#             RQ-NN with an optional lowercase letter, RQ-07a). commit: 7..40 hex, or the
#             literal `uncommitted` (allowed while the change is in the working tree;
#             refused by --strict).
#   required  default true. An optional field may be absent; when present it is checked.
#   enum      name of a list under `enums`.
#   ids       for id fields and lists of ids: which record prefixes may be referenced.
#   items     for list: the spec each item follows. min_items: default 0.
#   fields    for map (and list items of type map): the nested specs.
# Unknown keys are refused at every level, so a typo is an error, not a silent new field.
#
# Version 2 (DEC-017) added the RQ type and the `questions` field. A DEC, H, EXP, CASE or SYN
# at version 2 must name the research question(s) it serves; records tracked at version 1
# are frozen (CONTRACT.md §15) and stay valid without it. RQ records and drafts are version 2.

schema_version: 2

enums:
  provenance_type: [direct, adapted, synthesized, observed, unknown]
  confidence: [low, medium, high]
  implementation_status: [not_implemented, partially_implemented, implemented, not_applicable]
  validation_status: [not_validated, observed, partially_validated, validated, rejected]
  evidence_tier: [creator_observation, team_observation, controlled_experiment, independent_evaluation]
  dec_status: [proposed, accepted, superseded, deprecated]
  hyp_status: [proposed, under_test, closed]
  outcome: [pending, supported, partially_supported, rejected, inconclusive]
  exp_status: [planned, running, completed, abandoned]
  case_outcome: [positive, mixed, negative, inconclusive]
  case_environment: [private_production, maintainer_development, team_development, public_repository, synthetic]
  visibility: [public, sanitized]
  syn_status: [draft, final]
  rq_status: [proposed, partial, answered]
  arc_status: [implemented, validated, partially_validated, deprecated, unknown]
  arc_follow_up: [become_decision, become_hypothesis, archival]
  lit_relationship: [direct, adapted, supports, challenges, conceptually_related, future_direction, unknown]
  lit_implementation: [implemented, partially_implemented, not_implemented, future, unknown]

# Shared blocks, referenced by name from a type's fields (`$ref: <name>`).
blocks:
  provenance:
    type: map
    fields:
      type: {type: enum, enum: provenance_type}
      confidence: {type: enum, enum: confidence}
      basis: {type: str, required: false}
  disposition:
    type: map
    fields:
      implementation_status: {type: enum, enum: implementation_status}
      validation_status: {type: enum, enum: validation_status}
      validated_by: {type: str, required: false}
      validated_on: {type: date, required: false}
  references:
    type: list
    required: false
    items: {type: id, ids: [DEC, H, EXP, CASE, SYN, ARC, LIT]}

types:
  DEC:
    directory: decisions
    title: Decision — what was decided, why, and in which commit
    # Tracked only once the decision is in code (CONTRACT.md §15).
    tracked_when: {"disposition.implementation_status": [implemented, partially_implemented]}
    fields:
      schema_version: {type: int}
      id: {type: id, ids: [DEC]}
      title: {type: str}
      date: {type: date}
      status: {type: enum, enum: dec_status}
      provenance: {$ref: provenance}
      problem: {type: text}
      decision: {type: text}
      rationale: {type: text}
      alternatives:
        type: list
        min_items: 1
        items:
          type: map
          fields:
            option: {type: str}
            rejected_because: {type: text}
      evidence: {$ref: references}
      evidence_notes: {type: text, required: false}
      implementation:
        type: map
        fields:
          version: {type: str}
          commits: {type: list, min_items: 1, items: {type: commit}}
          components: {type: list, min_items: 1, items: {type: str}}
      disposition: {$ref: disposition}
      validation:
        type: map
        fields:
          summary: {type: text}
          runs:
            type: list
            required: false
            items:
              type: map
              fields:
                date: {type: date}
                job_id: {type: str}
                description: {type: text}
                clean: {type: bool}
      trade_offs:
        type: map
        fields:
          better: {type: list, min_items: 1, items: {type: text}}
          worse: {type: list, min_items: 1, items: {type: text}}
      limitations: {type: list, min_items: 1, items: {type: text}}
      revisit_when: {type: list, min_items: 1, items: {type: text}}
      supersedes: {type: list, required: false, items: {type: id, ids: [DEC]}}
      revises: {type: list, required: false, items: {type: id, ids: [DEC]}}
      questions: {type: list, required: false, items: {type: id, ids: [RQ]}}

  H:
    directory: hypotheses
    title: Hypothesis — an external, testable claim; no commit reference
    tracked_when: {"outcome": [supported, partially_supported, rejected, inconclusive]}
    fields:
      schema_version: {type: int}
      id: {type: id, ids: [H]}
      title: {type: str}
      date: {type: date}
      status: {type: enum, enum: hyp_status}
      outcome: {type: enum, enum: outcome}
      provenance: {$ref: provenance}
      statement: {type: text}
      motivation: {type: text}
      sources: {$ref: references}
      external_sources: {type: list, required: false, items: {type: str}}
      counter_evidence: {type: list, required: false, items: {type: text}}
      expected_effect: {type: text}
      success_criteria:
        type: map
        fields:
          primary_metric: {type: str}
          supported_when: {type: text}
          rejected_when: {type: text}
          data_recorded: {type: bool}
          data_source: {type: str, required: false}
      experiments: {type: list, required: false, items: {type: id, ids: [EXP]}}
      limitations: {type: list, min_items: 1, items: {type: text}}
      related_decisions: {type: list, required: false, items: {type: id, ids: [DEC]}}
      questions: {type: list, required: false, items: {type: id, ids: [RQ]}}
      disposition: {$ref: disposition}

  EXP:
    directory: experiments
    title: Experiment — how a hypothesis is evaluated; replaces the benchmark harness
    tracked_when: {"status": [completed, abandoned]}
    fields:
      schema_version: {type: int}
      id: {type: id, ids: [EXP]}
      title: {type: str}
      date: {type: date}
      status: {type: enum, enum: exp_status}
      hypothesis: {type: id, ids: [H]}
      version_under_test: {type: str}
      objective: {type: text}
      setup: {type: text}
      method: {type: text}
      arms:
        type: list
        required: false
        items:
          type: map
          fields:
            name: {type: str}
            description: {type: text}
      metrics:
        type: list
        min_items: 1
        items:
          type: map
          fields:
            name: {type: str}
            definition: {type: text}
            unit: {type: str}
      results:
        type: map
        required: false
        fields:
          summary: {type: text}
          data_source: {type: str}
          figures:
            type: list
            required: false
            items:
              type: map
              fields:
                metric: {type: str}
                arm: {type: str, required: false}
                value: {type: str}
      interpretation: {type: text, required: false}
      threats_to_validity: {type: list, min_items: 1, items: {type: text}}
      outcome: {type: enum, enum: outcome}
      related: {$ref: references}
      questions: {type: list, required: false, items: {type: id, ids: [RQ]}}
      disposition: {$ref: disposition}

  CASE:
    directory: real-cases
    title: Case — a sanitized real-use observation with a re-countable source
    tracked_when: {}
    fields:
      schema_version: {type: int}
      id: {type: id, ids: [CASE]}
      title: {type: str}
      recorded_on: {type: date}
      visibility: {type: enum, enum: visibility}
      environment: {type: enum, enum: case_environment}
      repository_identity: {type: str}
      evidence_tier: {type: enum, enum: evidence_tier}
      confidentiality_note: {type: text, required: false}
      context: {type: text}
      task: {type: text}
      workflow: {type: text}
      observation: {type: text}
      evidence:
        type: map
        fields:
          source: {type: text}
          counted_by: {type: str}
          counted_on: {type: date}
          notes: {type: text, required: false}
      outcome: {type: enum, enum: case_outcome}
      unexpected_behavior: {type: list, required: false, items: {type: text}}
      limitations: {type: list, min_items: 1, items: {type: text}}
      related: {$ref: references}
      related_notes: {type: text, required: false}
      implementation:
        type: map
        fields:
          version: {type: str}
          commits: {type: list, required: false, items: {type: commit}}
          commits_note: {type: str, required: false}
          feature: {type: str}
      questions: {type: list, required: false, items: {type: id, ids: [RQ]}}
      disposition: {$ref: disposition}

  SYN:
    directory: synthesis
    title: Synthesis — a conclusion drawn from several sources
    tracked_when: {"status": [final]}
    fields:
      schema_version: {type: int}
      id: {type: id, ids: [SYN]}
      title: {type: str}
      date: {type: date}
      status: {type: enum, enum: syn_status}
      question: {type: text}
      sources: {$ref: references}
      external_sources: {type: list, required: false, items: {type: str}}
      shared_ideas: {type: list, min_items: 1, items: {type: text}}
      differences: {type: list, required: false, items: {type: text}}
      synthesis: {type: text}
      implication: {type: text}
      hypotheses_generated: {type: list, required: false, items: {type: id, ids: [H]}}
      confidence:
        type: map
        fields:
          level: {type: enum, enum: confidence}
          reason: {type: text}
      open_questions: {type: list, required: false, items: {type: text}}
      questions: {type: list, required: false, items: {type: id, ids: [RQ]}}
      disposition: {$ref: disposition}

  ARC:
    directory: design-archaeology
    title: Archaeology — a reconstructed record of a decision older than this corpus
    tracked_when: {}
    fields:
      schema_version: {type: int}
      id: {type: id, ids: [ARC]}
      title: {type: str}
      reconstructed_on: {type: date}
      introduced_in: {type: str}
      provenance: {$ref: provenance}
      what_exists: {type: text}
      reconstruction_sources: {type: list, min_items: 1, items: {type: str}}
      likely_rationale: {type: text}
      inferred: {type: list, required: false, items: {type: text}}
      known_gaps: {type: list, min_items: 1, items: {type: text}}
      current_status: {type: enum, enum: arc_status}
      follow_up: {type: enum, enum: arc_follow_up}
      disposition: {$ref: disposition}

  LIT:
    directory: literature
    title: Literature — what a source claims and how it relates to agent-workflow
    tracked_when: {}
    fields:
      schema_version: {type: int}
      id: {type: id, ids: [LIT]}
      title: {type: str}
      authors: {type: list, min_items: 1, items: {type: str}}
      year: {type: int}
      source: {type: str}
      relationship: {type: enum, enum: lit_relationship}
      implementation_relationship: {type: enum, enum: lit_implementation}
      summary: {type: text}
      relevant_claims: {type: list, min_items: 1, items: {type: text}}
      relationship_notes: {type: text}
      limitations: {type: list, min_items: 1, items: {type: text}}
      notes: {type: text, required: false}
      disposition: {$ref: disposition}

  RQ:
    directory: questions
    title: Research question — what is asked, what exists today, and which records serve it
    # A question is never carried out, so it is tracked as soon as it is asked.
    tracked_when: {}
    fields:
      schema_version: {type: int}
      id: {type: id, ids: [RQ]}
      question: {type: str}
      date: {type: date}
      status: {type: enum, enum: rq_status}
      what_exists: {type: text}
      # Tracked records only; drafts are named in `notes` as plain text (CONTRACT.md §15).
      records: {type: list, items: {type: id, ids: [DEC, H, EXP, CASE, SYN, ARC, LIT]}}
      notes: {type: text, required: false}

# Rules the field specs cannot express, enforced by the validator (CONTRACT.md §14–§16):
#   - file name is `<id>-<kebab-slug>.yaml` inside the type's directory; IDs are unique.
#   - H and EXP carry no commit anywhere (they are external to the code).
#   - a DEC whose implementation_status is implemented/partially_implemented has at least
#     one commit; `uncommitted` is a warning, and an error under --strict.
#   - validation_status other than not_validated/observed needs validated_by and validated_on.
#   - validated / partially_validated / rejected needs an evaluation: an EXP reference for
#     H, SYN, ARC and LIT; for a DEC, at least one validation run with clean: true.
#   - a tracked record meets its type's tracked_when; anything else belongs in
#     docs/research-drafts/.
#   - every referenced ID resolves to a tracked record, or to a draft when
#     docs/research-drafts/ exists; otherwise it is reported.
#   - schema_version is 2; a tracked DEC/H/EXP/CASE/SYN/ARC/LIT may stay at 1 (frozen).
#   - a version-2 DEC/H/EXP/CASE/SYN names at least one RQ in `questions`.
#   - an RQ's `records` are tracked records; an `answered` RQ lists at least one; a listed
#     version-2 record names the RQ back, and a tracked version-2 record's RQ lists it.
#   - docs/research/questions.md is generated from the RQ records (--write-inventory).
