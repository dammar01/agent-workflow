schema_version: 3
id: RQ-07b
question: "Can a workflow be replayed to validate a candidate intervention?"
date: 2026-09-29
status: unanswered
what_exists: |
  No replay of a finished run. Browser verification retries only inside the same command,
  for incomplete outcomes caused by the environment (`settings.max_retries`), and never
  replays a run afterwards.
