schema_version: 3
id: RQ-07a
question: "Can recorded trajectories support post-hoc failure diagnosis?"
date: 2026-09-29
status: unanswered
what_exists: |
  Audit, usage, quality, per-call metadata, progress, job logs, and continuation metadata
  exist, but are scattered and have no diagnosis tooling.
records: [CASE-004, CASE-009, DEC-015, DEC-020, CASE-014, CASE-015, DEC-021, DEC-022, DEC-024, DEC-028, CASE-016, CASE-017, DEC-030, DEC-034, DEC-037, DEC-041, DEC-049, DEC-050, DEC-051, DEC-052, CASE-021, DEC-053, DEC-054, DEC-055, DEC-057, DEC-058, CASE-025, CASE-026, CASE-027, H-019, EXP-011, DEC-071, DEC-078]
notes: |
  Converted from the questions.md table on 2026-09-29 (DEC-017); the question was first
  recorded before 3.7.3.

  Trajectory data (task, routing, exploration, evidence, plan, execution, failure,
  verification, intervention, outcome) accumulates only through real use, which makes it
  valuable for research. Only part of it is recorded today: the runtime keeps routing,
  evidence, verification verdicts, and continuation and recovery events, but not the plan, the
  execution, human interventions, or the task outcome (CASE-004). Corrected
  2026-10-05: task telemetry (DEC-015, `core/audit/task_telemetry.py`) records skill, edit
  and commit events and a derived task completion, and CASE-012 measured task outcomes after
  the fact; the plan's content and human interventions are still not recorded at run time. What is recorded is
  stored in each user's own `.workflow/` and contains their code and prompts. Any collection
  across users requires their consent and sanitization under CONTRACT.md section 5; nothing in
  the runtime collects it.

  Draft records: H-005 and EXP-019 (synthetic host-trigger and installed-guard pilot).

  Maintainer decision, 2026-11-09: operational edge-case handling may be validated when the
  trigger and expected handling are reproducible, the condition is a bounded edge case,
  normal operation on the tested runtime is preserved, and no related issue is found in
  examined sessions with established matching versions. EXP-019 records this post-pilot
  policy. Follow-up on 2026-11-10 (Asia/Jakarta) completed the provenance search: 336
  independent candidates, no complete ordinary-use control with established target-revision
  identity, and one version-established staging session whose later ordinary host JSON
  error recovered. The historical ordinary-runtime identity remains unresolved. Neither
  operational absence nor the separate runtime-only diagnosis claim is established, and
  this question remains unanswered.

  DEC-015 (tracked, commit 2dd7d7e) records tasks as skill sequences
  and their outcome in `tasks.jsonl`, from the runtime and a PostToolUse hook.
