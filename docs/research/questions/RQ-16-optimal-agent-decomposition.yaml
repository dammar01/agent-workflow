schema_version: 3
id: RQ-16
question: "What degree of agent decomposition is optimal for a task under constraints of token usage, latency, human intervention, and coordination overhead?"
date: 2026-10-05
status: unanswered
what_exists: |
  The runtime records, per delegated call, the tokens the provider reports, the call's
  duration, and its continuation rows in `.workflow/data/usage.jsonl`; task telemetry groups
  calls into tasks, and `tools/maintain/measure_real_use.py` / `measure_task_outcomes.py`
  count prompts, corrections and tasks that landed (CASE-011, CASE-012, metrics in
  `docs/evaluation/metrics.md`). Those cover T, L and part of H and N for the workflow as it
  runs today. Nothing varies the decomposition level on purpose: there is no arm with a
  different number of delegated executions for the same task, coordination cost K is not
  separated from agent computation, and quality is not measured against a target per task.
records: []
notes: |
  The primary question of the research charter (docs/research/CHARTER.md, CQ1), adopted
  2026-10-05. The charter's cost vector is R = (N, T, L, H, K), each measured on its own; the
  question asks for the N whose cost, normalized and weighted as an experiment states (charter
  §2), is lowest while quality still meets a target, which is task-dependent by assumption.

  Draft records: H-016 (diminishing marginal return of decomposition, the charter's CH1).
  Related tracked questions: RQ-17 (how quality changes with N), RQ-01 (token and context
  allocation), RQ-02 (human intervention and coordination), RQ-13 (latency). Related
  literature: LIT-001, which argues the capability side of composition under a shared budget.

  CASE-011 and CASE-012 bear on this question but are not listed under `records`: a listed
  record must name this question back (CONTRACT.md section 16), and both are frozen records
  that name the questions they were written for. They are cited above as what exists.

  Maintainer interview 2026-10-23 (critical_interview, sanitized summary; status unchanged):
  delegation helps most on medium tasks (3-10 files, one area); on large ones the result is less
  trusted and re-checked in a new session. The main value is not having to write detailed
  instructions; quality is only part of it. Orchestration effort fell a lot (0-1 corrections on a
  recent medium feature).

  2026-11-10 administrative consolidation: SYN-002 (draft) now describes secondary evidence gathering and initial reasoning, followed by main-agent deep reasoning, decisions and execution under two fixed roles. Historical DEC-002 and the original SYN-002 are archived with reasons in the local closure manifest. This closes description drift only; effectiveness, optimality, independent verification and learning remain separate research questions. No question status or validation authority is changed.

  2026-11-10 maintainer closure: the DEC-002/SYN-002 administrative alignment task is closed and leaves the active review backlog. SYN-002 remains the draft description of the accepted direction. This question remains unanswered; comparative effectiveness and optimality belong to a separate evaluation, not to reopening historical description alignment.
