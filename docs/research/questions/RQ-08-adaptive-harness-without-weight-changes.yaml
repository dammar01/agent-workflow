id: RQ-08
question: "Can an adaptive harness improve future coding-agent behavior without changing model weights?"
date: 2026-09-29
status: unanswered
what_exists: |
  Stateful orchestration and memory (facts) exist; experience does not.
records: []
notes: |
  Converted from the questions.md table on 2026-09-29 (DEC-017); the question was first
  recorded before 3.7.3.

  Stateful orchestration is not the same as learning from experience, and memory is not
  experience. Memory: "The repository follows pattern X." Experience: "On task X, strategy Y
  was tried and failed because of Z; strategy W worked." Experience carries state, action,
  context, outcome, and a causal interpretation. The fact store holds memory; no
  representation of experience exists yet.

