schema_version: 3
id: RQ-08
question: "Can an adaptive harness improve future coding-agent behavior without changing model weights?"
date: 2026-09-29
status: unanswered
what_exists: |
  Exoma stores selected browser-verification observations by origin and can retrieve
  them for a later verification. Their effect on agent decisions and outcomes remains
  unevaluated. General-purpose strategy learning remains open.
records: []
notes: |
  Converted from the questions.md table on 2026-09-29 (DEC-017); the question was first
  recorded before agent-workflow 3.7.3.

  The original question distinguished repository facts from accounts of an action, its
  context and its outcome. At the research pin (Exoma 1.0.2, b39cc7a), a browser run can
  record a successful selector and offer it during a later verification on the same origin.
  Retrieval establishes availability. Showing that it changed a decision requires a
  later task trace. Measuring an improvement also requires a comparable baseline.
  Source at the pin: https://github.com/dammar01/Exoma/blob/b39cc7acbaaefc206b997d12aaab061def49ba3a/src/exoma/core/evidence/e2e/knowledge.py

