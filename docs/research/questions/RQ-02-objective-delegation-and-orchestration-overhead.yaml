schema_version: 3
id: RQ-02
question: "Does objective-level delegation reduce human orchestration overhead?"
date: 2026-09-29
status: unanswered
what_exists: |
  No direct run-time human-attention measurement. `tools/maintain/measure_real_use.py`
  retrospectively counts prompts, corrections and landed edits, and derives session activity
  from adjacent transcript timestamp gaps (CASE-011, the 3.7.3 baseline). The historical
  active-time label is a session-activity proxy, not measured human work minutes.
  Clarification (2026-11-11): the user-defined burden endpoint counts questions, directions,
  rejections and reasoning corrections across sessions/projects. The current intervention
  census measures these structural events and calibrates semantic labels; objective linkage,
  full semantic coverage and a treatment comparison remain incomplete.
  `tools/maintain/measure_task_outcomes.py` adds, per coding task, whether the work reached
  main and needed a fix within 24 hours, and the kinds of follow-up prompts it took
  (CASE-012: 97 tasks, 9 projects). There is no arm without the workflow, so the question's
  comparison is not measured yet.
records: [CASE-011, CASE-012, DEC-026, DEC-027, DEC-036, DEC-038, H-014, EXP-008, CASE-028]
notes: |
  Converted from the questions.md table on 2026-09-29 (DEC-017); the question was first
  recorded before 3.7.3.

  Draft records: H-002 (archived draft); H-013 and EXP-007 (a later version against the
  CASE-011 baseline); H-018 and EXP-010 (fixes recounted with feature segments); H-020 and EXP-012
  (structured delegation and corrective intervention).

  H-014 and EXP-008 (tracked 2026-10-24): a review of 20 solved tasks judged all correct
  (17 acceptable), supporting acceptance on main as a stand-in for success, with the
  reviewer being the maintainer who accepted the work.

  Retrospective pre-workflow arm not possible (2026-10-19): an inventory of the maintainer's
  Claude Code transcripts found one session older than the first workflow banner across 17
  transcript folders; in every project the oldest transcript is the day the workflow first
  appears. Claude Code's transcript cleanup was at its default, so earlier sessions are gone.
  A comparison without the workflow has to be collected prospectively.

  Research charter (docs/research/CHARTER.md, adopted 2026-10-05): this question carries the
  charter's CQ6 (whether more decomposition reduces human intervention, moves it to another
  stage, or adds it through coordination and correction) and the human-coordination part of
  its CQ4 (task decomposition, handoff, result interpretation, synthesis). The charter's
  primary question is RQ-16.

  2026-11-10 maintainer closure: H-014/EXP-008 is accepted with partial validation under its original rubric and sample; its active disposition review is closed. The broader causal orchestration question remains unanswered. An accepted result with explicit limits is not an outstanding request to rerun that experiment.
