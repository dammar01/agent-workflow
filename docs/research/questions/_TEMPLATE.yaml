# RQ — copy to RQ-NN-<kebab-slug>.yaml (RQ-NNa for a sub-question). Schema: ../schema.yaml.
# Rules: ../CONTRACT.md §14–§16. A question is tracked as soon as it is asked.
schema_version: 3
id: RQ-NN
question: "<one line, quoted>"
date: YYYY-MM-DD
status: unanswered          # answered | unanswered — never half-answered (DEC-019)
what_exists: |
  What the repository has today that bears on the question — not whether it is answered.
records: []                 # tracked record IDs only; `answered` needs at least one validated.
                            # Each version-3 record listed here names this RQ under `questions`.
# decision:                 # required when answered — a sanitized summary, never a transcript
#   date: YYYY-MM-DD
#   method: critical_interview
#   summary: |
#     ...
notes: |                    # optional — narrative; drafts are named here as plain text
  ...
