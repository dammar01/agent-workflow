id: RQ-04
question: "Can task complexity predict when workflow activation is worthwhile?"
date: 2026-09-29
status: unanswered
what_exists: |
  `scope_width` and the per-call fan-out clusters are computed per call but kept only in
  transient result metadata; whether the provider can fan out at all is persisted
  (`.workflow/capabilities.json`, `core/runtime/state.py`). Nothing routes on them. CASE-012 sets delegated calls per task beside outcome, time
  and context on 97 real tasks; task size and delegation move together there, so it
  describes where delegation was used, not when it was worthwhile.
records: [CASE-012]
