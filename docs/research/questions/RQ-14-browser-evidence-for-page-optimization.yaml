schema_version: 2
id: RQ-14
question: "Can request metadata and ordering captured by browser verification, compared across runs, guide page optimization without exposing sensitive data?"
date: 2026-09-29
status: proposed
what_exists: |
  The browser player records console and page errors, HTTP 5xx, and a sanitized ledger of
  non-safe requests (endpoint, method, resource type, status, failure, duration). Safe reads
  are not recorded; no sizes, ordering, or cross-run comparison exist.
records: []
notes: |
  Optimization goals named by the maintainer: slow loads, heavy assets, excessive or repeated
  API calls, caching that does not work, and the flow and order of requests.

  Draft records: DEC-014.
