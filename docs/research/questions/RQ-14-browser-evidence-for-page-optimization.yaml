schema_version: 3
id: RQ-14
question: "Can request metadata and ordering captured by browser verification, compared across runs, guide page optimization without exposing sensitive data?"
date: 2026-09-29
status: unanswered
what_exists: |
  The browser player records console and page errors, HTTP 5xx, and a sanitized ledger of
  non-safe requests (endpoint, method, resource type, status, failure, duration). Since
  DEC-014 it also records ordered request metadata for every request, with type counts and
  sizes, compared across runs, never bodies or headers. Not yet measured on a real project.
records: [DEC-014, DEC-031, DEC-035]
notes: |
  Optimization goals named by the maintainer: slow loads, heavy assets, excessive or repeated
  API calls, caching that does not work, and the flow and order of requests.

  DEC-014 (tracked, commit 60263ba) is the capture; its validation needs two clean browser
  runs on a real project.
