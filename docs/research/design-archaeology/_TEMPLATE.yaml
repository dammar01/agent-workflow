# ARC — copy to ARC-NNN-<kebab-slug>.yaml. A reconstructed record of a decision made before
# this corpus existed. List every inferred statement under `inferred`; never invent sources.
schema_version: 1
id: ARC-NNN
title: <one line>
reconstructed_on: YYYY-MM-DD
introduced_in: <version, as far as it can be established>
provenance:
  type: unknown             # direct | adapted | synthesized | observed | unknown
  confidence: low
what_exists: |
  The behavior as it exists today, with file references.
reconstruction_sources:
  - <source code / git history / CHANGELOG / prompt/v*/ / docs / remembered observation>
likely_rationale: |
  The best available explanation.
inferred: []                # statements above that are inferred, not documented
known_gaps:
  - <what cannot be reconstructed>
current_status: unknown     # implemented | validated | partially_validated | deprecated | unknown
follow_up: archival         # become_decision | become_hypothesis | archival

disposition:
  implementation_status: implemented
  validation_status: not_validated
