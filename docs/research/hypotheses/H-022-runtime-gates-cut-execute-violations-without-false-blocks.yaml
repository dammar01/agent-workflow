schema_version: 3
id: H-022
title: Runtime execute gates cut violations without false blocks that interrupt legitimate work
date: 2026-10-20
status: closed
outcome: inconclusive
provenance:
  type: observed
  confidence: low

statement: |
  With DEC-067's hybrid gates installed, edits without the user's -y, writes outside scope or
  root, and unrequested commits fall to near zero, while blocks the user has to work around
  stay rare.
motivation: |
  DEC-046 deferred enforcement for fear of false blocks; DEC-067 builds only deterministic
  gates. Whether they block legitimate work is the open part.
sources: [CASE-018]
external_sources: []
counter_evidence: []
expected_effect: |
  Fewer edit events outside an execution's scope in task telemetry, and few enforcement
  overrides (policies.enforcement set to warn or off) after installation.

success_criteria:
  primary_metric: false blocks per session (EXP-014)
  supported_when: over at least 20 blocks labelled by a blind judge, false_block_rate is at most 0.10
  rejected_when: over at least 20 blocks labelled by a blind judge, false_block_rate exceeds 0.25
  data_recorded: true
  data_source: EXP-014 (transcript blocks judged by the maintainer); the hook log of DEC-070 from 2026-10-23

experiments: [EXP-014]
limitations:
  - "Endpoint-label clarification (2026-11-11): the original primary_metric wording says false blocks per session, while the actual decision predicates and EXP-014 denominator use false blocks per judged block. These are different endpoints. Evaluate the frozen 0.10/0.25 thresholds on false_block_rate over judged unique blocks; blocks_per_session is a separate descriptive metric. This clarification changes no threshold, original 7-event/6-judged cohort, unit-change caveat or inconclusive outcome, and does not measure violations reduction."
  - "EXP-014 (2026-10-23): 7 unique events total in the historical post-416cf71 cohort: 6 judged (4 false blocks, 2 legitimate) and 1 unclear, below the 20 the rule needs; inconclusive. Before 416cf71: 7 of 21 false. The unit changed to unique events after part of the labels were known."
  - "Pre-registration: Thresholds proposed by the agent and frozen on 2026-10-23, before any block was recorded (proposed-by-agent). Between 0.10 and 0.25, or below 20 labelled blocks, the outcome is inconclusive. The \"violations fall\" half of the statement has no pre-gate baseline and is not_measured by EXP-014; these criteria test only the false-block half."
  - The hooks do not record their own blocks; counting them needs either telemetry or transcripts
  - "Follow-up 2026-11-10: local pure-source unit controls, active_codex 3/4; project_bundle 3/4; active_global_bundle 3/4. Session-scoped authorization, refusal without approval and an existing directory-scope match meet expectations; a harmless quoted command mention still produces a false refusal in all three inspected policies. Marker freshness was mocked and no command/token/active gate state was executed or mutated. This is a method-separated regression follow-up, not additional real-use events in EXP-014; the historical 7 total/6 judged denominator and inconclusive outcome remain. Source identities/results: docs/research-drafts/_data/research-closure-2026-11-10/remaining/exoma-handoff-2026-11-10/recheck-results.json. Latest upstream and full host integration were not verified."
related_decisions: [DEC-067]

disposition:
  implementation_status: not_applicable
  validation_status: not_validated
questions: [RQ-10]
