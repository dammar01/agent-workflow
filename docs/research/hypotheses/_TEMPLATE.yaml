# H — copy to H-NNN-<kebab-slug>.yaml. An external claim: no commit anywhere in this record.
# Tracked here only once its outcome is recorded (not pending); until then it is a draft.
schema_version: 3
id: H-NNN
title: <one line>
date: YYYY-MM-DD
status: proposed            # proposed | under_test | closed
outcome: pending            # pending | supported | partially_supported | rejected | inconclusive
provenance:
  type: synthesized         # direct | adapted | synthesized | observed | unknown
  confidence: low           # low | medium | high

statement: |
  One testable hypothesis.
motivation: |
  Why it is being considered.
sources: []                 # record IDs (LIT, SYN, CASE, ...)
external_sources: []        # DOI / arXiv / URL, when not a LIT record yet
counter_evidence: []
expected_effect: |
  What should change if it holds.

success_criteria:
  primary_metric: <metric name, defined in the EXP>
  supported_when: <threshold, or [PLACEHOLDER] if not chosen yet — never invented>
  rejected_when: <threshold, or [PLACEHOLDER]>
  data_recorded: false      # is the data recorded today?
  data_source: <optional — where the data lives>

experiments: []             # EXP-NNN that evaluate it
limitations:
  - <what could make the result unreliable>
related_decisions: []

disposition:
  implementation_status: not_applicable
  validation_status: not_validated
questions: [RQ-NN]          # the research question(s) this record serves; each RQ lists it back (CONTRACT.md §16)
