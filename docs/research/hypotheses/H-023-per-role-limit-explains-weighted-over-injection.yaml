schema_version: 3
id: H-023
title: DEC-066's per-role limit, not its scoring, is why the weighted rule serves more facts than the one-token rule
date: 2026-10-23
status: closed
outcome: supported
provenance:
  type: observed
  confidence: low

statement: |
  In EXP-013 the weighted arm served more facts than the one-token arm (injection_rate 0.027
  against 0.022) although its floor drops facts the one-token rule keeps. The weighted arm
  allows 4 facts to reasoning calls and 3 to exploration (DEC-066); the one-token arm allows 3
  to every call. With the weighted arm capped at 3 for every role, its injection rate is no
  higher than the one-token arm's.
motivation: |
  H-021 was rejected on injection as well as use. If the limit explains the injection half,
  DEC-066's scoring can be kept and only the reasoning limit revisited; if not, the floor or
  the weights are what serve more.
sources: [EXP-013]
external_sources: []
counter_evidence: []
expected_effect: |
  weighted@3 injection_rate <= one-token injection_rate on the same calls and store.

success_criteria:
  primary_metric: replay.injection_rate@1 (EXP-016)
  supported_when: over at least 30 replayed calls, the weighted arm with limit 3 for every role has an injection_rate at most the one-token arm's
  rejected_when: over at least 30 replayed calls, the weighted arm with limit 3 for every role has an injection_rate above the one-token arm's
  data_recorded: true
  data_source: tools/maintain/replay_facts.py --weighted-limit 3 over the maintainer's projects

experiments: [EXP-016]
limitations:
  - "2026-11-10 maintainer disposition and closure: The maintainer accepts the supported claim under the frozen rule: weighted retrieval capped at three has no higher injection rate on the same replay corpus than the one-token arm. Validation is confined to that cap comparison; it does not establish superior scoring, an optimal cap, independent replication of EXP-013 or improved task outcomes. DEC-072 remains a separate proposed implementation. Active review of H-023/EXP-016 is closed; no experiment rerun is requested for this conclusion. Reopen when: Recorded served-facts evidence, another cap value or a changed retrieval policy is used to justify a new operational decision."
  - "EXP-016 (2026-10-23, 1576 replayed calls): weighted-3 injection_rate 0.0221 (2399) vs one-token 0.0225 (2440); use rate 0.212 vs 0.214, reported, not deciding."
  - "Pre-registration: thresholds proposed by the agent and frozen on 2026-10-23, before --weighted-limit existed or any limit-3 replay ran (proposed-by-agent, maintainer-approved as a rule). Use rate is reported but does not decide the outcome."
  - The replay is counterfactual on today's store, as in EXP-013.
related_decisions: [DEC-066]

disposition:
  implementation_status: not_applicable
  validation_status: validated
  validated_by: maintainer
  validated_on: 2026-11-10
questions: [RQ-06]
