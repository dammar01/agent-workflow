# SYN — copy to SYN-NNN-<kebab-slug>.yaml. Tracked here only once final.
schema_version: 3
id: SYN-NNN
title: <one line>
date: YYYY-MM-DD
status: draft               # draft | final
question: |
  The question this synthesis answers.
sources: []                 # LIT / CASE / H IDs
external_sources: []
shared_ideas:
  - <idea present across sources>
differences: []
synthesis: |
  The conclusion from combining them — an interpretation, not a claim of any one source.
implication: |
  How it could affect agent-workflow.
hypotheses_generated: []
confidence:
  level: low                # low | medium | high
  reason: <why>
open_questions: []

disposition:
  implementation_status: not_applicable
  validation_status: not_validated
questions: [RQ-NN]          # the research question(s) this record serves; each RQ lists it back (CONTRACT.md §16)
