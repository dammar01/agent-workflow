schema_version: 3
id: DEC-048
title: Providers declare their enforced write boundary; codex runs with approval_policy never
date: 2026-10-06
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Real-CLI write probe against codex-cli 0.154.0 (CASE-019)
problem: |
  The runtime described each provider's read boundary (doctor `second_agent_read_boundary`)
  but said nothing about writes. agy can write and is only detected by `agy_guard`; codex was
  assumed write-blocked by `--sandbox read-only`, and CASE-019 showed it was not: its
  apply_patch tool wrote a file under that sandbox.
decision: |
  - Every provider bundle in `config/providers.py` declares `boundary: {reads, writes}` as
    enforced, read through `provider_boundary()`: opencode `secrets_denied`/`denied`, codex
    `unbounded`/`sandboxed`, agy `unbounded`/`unbounded`; an undeclared provider reads as
    unbounded on both sides.
  - The codex adapter passes `-c approval_policy="never"` on every call, `exec` and
    `exec resume`, which makes codex reject an apply_patch outside the writable roots.
  - Doctor reports `checks.second_agent_write_boundary` and, for unbounded writes only, a
    second `WARNING` in `recommended_fixes` (never an issue). Every delegated result that
    reached the provider carries `meta.provider_boundary`, plus `meta.provider_write_warning`
    when writes are unbounded.
  - An opt-in real-CLI probe re-proves both codex write paths on both branches.
rationale: |
  Trusting a reader is not trusting a writer; the two need separate statements, and the one
  for writes has to be true. One declaration per bundle keeps doctor and every result reading
  the same claim. `never` is the only approval policy under which codex rejects such a patch,
  and passing it per call means no config file can loosen it, the same reason the sandbox
  flag already rides argv.
alternatives:
  - option: Relabel codex writes unbounded and warn like agy
    rejected_because: A flag that closes the hole existed; warning about a fixable hole would leave it open.
  - option: Add a working-tree guard to codex like agy_guard
    rejected_because: Detection after the fact; prevention was available.
  - option: Keep the --help-based claim without a probe
    rejected_because: CASE-019 showed the claim was false for the edit tool.
evidence: [CASE-019]
evidence_notes: |
  `tests/checks/codex_write_probe.py` (opt-in): PASS on fresh and resumed calls with the
  flag, FAIL without it. `tests/checks/provider.py` doctor read/write warnings per provider;
  `tests/checks/session_persistence.py` `provider-boundary` meta per provider. Default suite,
  `e2e-smoke` and `tools/e2e/e2e.py --full` pass on the commit.
implementation:
  version: 3.8.1
  commits: [895aa6fc459f831014cc3a6658c73b930b231f8c]
  components:
    - config/providers.py (boundary per bundle, provider_boundary())
    - adapters/providers/codex_adapter.py (_APPROVAL_ARGS on exec and exec resume)
    - core/audit/diagnostics.py (second_agent_write_boundary, write WARNING)
    - core/provider/executor.py (meta.provider_boundary, provider_write_warning, call meta)
    - tests/checks/codex_write_probe.py, tests/checks/provider.py, tests/checks/session_persistence.py
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    The probe proves the flag closes both write paths on codex-cli 0.154.0, Windows, fresh
    and resumed. Not probed on other OSes or releases; `--full` exercises opencode, not codex.
trade_offs:
  better:
    - The codex write claim is now true and re-provable; agy's write risk is visible on every result.
  worse:
    - A codex call can no longer write even if a future command wanted it to; that needs a new decision.
    - The probe costs a real codex call, so it is not in the default suite.
limitations:
  - A codex release may change how approval policy and sandbox interact; the probe must be re-run per stable release.
  - Calls refused before the provider step (e.g. `session_capture_failed`) carry no boundary.
revisit_when:
  - The probe fails on a new codex release or another OS.
  - codex gains a project-scoped config layer that could carry the policy instead of argv.
questions: [RQ-10]
