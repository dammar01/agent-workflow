schema_version: 1
id: DEC-007
title: The browser player's poll waits inside Playwright, not beside it
date: 2026-09-27
status: accepted
provenance:
  type: observed
  confidence: high
  basis: "maintainer runs: login POST duration tracked the step timeout"

problem: |
  A `/.verify-browser` login scenario on a private project failed at `expect_url` twice: the
  login POST returned 200, but the URL assertion never saw the redirect. Raising
  `step_timeout_ms` from 8 s to 30 s did not help. The POST's recorded duration was
  8,805 ms in the first run and 30,763 ms in the second — each about 0.8 s past the step
  timeout — and the page captured at failure already showed the application's
  post-login "redirecting" state.

  The player uses the sync Playwright API, which dispatches events (route handlers,
  `framenavigated`, responses) only while the calling thread is inside a Playwright call.
  The polling loops waited with `time.sleep`, and `expect_url` and the `url` readiness
  condition read `page.url`, a cached attribute with no round trip. So nothing dispatched for
  the whole step: the POST, which passes through the write guard's `context.route` handler,
  stayed unrouted until the assertion had already failed and the failure path's
  `wait_for_load_state` let events through.

  Checks that go through the browser (`count()`, `get_by_text`, `title()`) were not affected,
  because each of those is a Playwright call.

decision: |
  - The three polling loops (selector resolution, readiness, text polls) wait through
    `Session.pause()`, which spends the interval in `page.wait_for_timeout(POLL_S * 1000)`.
  - `Session(sleep=...)` defaults to `None`, meaning "wait through the page". A test that
    drives its own clock still passes `sleep`, and keeps its instant waits.
  - If `wait_for_timeout` raises (for example, a page that has closed), it falls back to `time.sleep`.

rationale: |
  The fault is in how the loop waits, not in what it reads. Putting the wait inside Playwright
  covers every poll in one place, and it covers cached reads that get added later.

alternatives:
  - option: Raise the timeout
    rejected_because: Rejected by the evidence — the POST finished just after the timeout, whatever it was.
  - option: Replace `expect_url` with `page.wait_for_url`
    rejected_because: Fixes one action, leaves the `url` readiness condition and any future cached read starving events the same way.
  - option: Make `_page_url` evaluate `location.href`
    rejected_because: A round trip does dispatch, but it ties the fix to how each read is written rather than to how the loop waits.

evidence: []
evidence_notes: |
  - Two maintainer runs on 2026-09-27 (private project, not reproducible outside that machine):
    POST durations 8,805 ms at an 8 s timeout and 30,763 ms at a 30 s timeout; `step05.html`
    showed the post-login state in both.
  - `tests/checks/e2e_browser.py` `_check_polling_keeps_events_flowing`: a fake page that
    delivers queued events only inside `wait_for_timeout`. `expect_url` and a `url` readiness
    condition pass with the new wait. The same step fails when the wait is a plain sleep.
    Reverting `pause()` to `time.sleep` makes the check fail.

implementation:
  version: 3.7.3
  commits: [dd70afda3e1a70f85c90d7cdbaa52ae3feb80bb2]
  components:
    - core/evidence/e2e/browser.py (Session.pause, sleep default)
    - tests/checks/e2e_browser.py (_DispatchPage, _TickingClock, _check_polling_keeps_events_flowing)

disposition:
  implementation_status: implemented
  validation_status: validated
  validated_by: maintainer
  validated_on: 2026-09-28

validation:
  summary: |
    The offline suites pass, including the dispatch regression check. The login scenario that
    exposed the problem has not been re-run against the real application since the change.

    2026-09-28, real use on the maintainer's private web project with the originating shape — a guarded login POST followed by
    `expect_url`: the POST finished in 864 ms (HTTP 200) at the default 8 s step timeout, no
    longer tracking it, and `expect_url /home` passed. Validated by the maintainer on the run
    named below.
  runs:
    - date: 2026-09-28
      job_id: "job_20260928_035021_734713"
      description: "Guarded POST /api/v1/auth/login (864 ms, 200) then expect_url /home passed; Login + dashboard on the maintainer's private web project: 7/7 steps passed, browser verdict pass; the run verdict was incomplete only because mobile rendering was listed under not_verified."
      clean: true
  uses: 55
  consistent: true
  maintainer_decision: |
    2026-10-03, critical interview: kept validated. Step timing stayed plausible over every run
    that reached the browser. Two runs ended `stuck` with no recorded cause; they are an open
    limit of this record, not evidence against it.
  measurements:
    - source: "quality.jsonl (kind e2e_run) of the maintainer's private web project, rows recorded 2026-09-28..2026-10-02, counted by the primary agent on 2026-10-03"
      value: "55 runs reached the browser; run duration median 40.6 s, max 174.9 s; 2 ended stuck"

trade_offs:
  better:
    - Events reach the page during polls, so every poll — including cached reads added later — sees the page's events in time.
  worse:
    - Every poll interval is now a round trip to the Playwright driver. It's small at 100 ms, but it isn't free.
    - Dialogs, route handlers and observers run mid-step instead of in a burst after the step; observers now see timing they did not see before.

limitations:
  - The dispatch model is checked against a fake page that imitates it, not against Playwright itself; `e2e-smoke` (real Chromium) does not yet include a guarded write followed by `expect_url`.
  - The application in the originating case was also slow to navigate after login in manual use (dev-server compile), so a pass after this fix may still need a longer timeout.

revisit_when:
  - A real run where a guarded request's duration again tracks `step_timeout_ms`.
  - A move of the player to the async Playwright API (which dispatches on its own event loop).
