schema_version: 1
id: DEC-009
title: Literal credentials in the task, draft and request are found by value and put back to placeholders
date: 2026-09-28
status: accepted
provenance:
  type: observed
  confidence: high
  basis: "maintainer report: secret values reached the /.verify-browser request draft"

problem: |
  The maintainer confirmed that credential values reached the `/.verify-browser` request
  draft. The runtime already kept resolved values out of the player's artifacts, but the
  files written BEFORE substitution had no such guard:
  - `validate_scenario` accepted any string as a `fill` value, while the stage-1 prompt forbade
    literal credentials — the rule existed only as a request to the model;
  - `_draft_result` wrote `draft.json` through the generic secret scanner, which recognises
    token-shaped secrets and misses an email or a plain password;
  - the skill tells the main agent to copy the draft's scenario into `request.json`, so a
    literal in the draft became a literal in the request, and nothing read the request for it;
  - the task text went verbatim into the stage-1 and stage-3 prompts and their archives.

decision: |
  - One lookup-aware scrub (`redact.scrub_literals`) runs over agent-written input, using the
    same lookup the player resolves from (the selected secrets.json profile plus registered
    environment names). A string that IS a value is replaced by its `${NAME}` whatever its
    length (down to 4 characters); a value inside a longer string only when it is at least
    8 characters, so a short credential never rewrites an ordinary word such as a claim id.
  - Applied to the task before any prompt is built, to the parsed stage-1 scenario before
    validation and `draft.json`, again inside `_draft_result` as the last step before disk,
    and to `request.json`, which is rewritten in place (`request.scrub_request_file`).
  - The run continues: the placeholder resolves back to the same value for the player. It is
    flagged by name only — `meta.e2e.secret_literals` (`task` | `draft` | `request`) and a
    `config_warnings` line; the draft quality row lists the names.
  - Independently of the lookup, a `fill` into a field whose selector names a password must
    carry a placeholder (`spec.py`); a literal there is `spec_invalid`. That catches a password
    the lookup does not know yet.

rationale: |
  Only the lookup knows what the real values look like; a pattern scanner cannot tell a login
  email from any other text. Replacing rather than refusing keeps the run the same run —
  the value the player receives is unchanged — while the value leaves every file, prompt and
  result. Rewriting `request.json` matters because the file on disk is the leak.

alternatives:
  - option: Refuse a request or draft that contains a literal value
    rejected_because: |
      The user would have to find and fix a value the runtime already knows how to replace, and
      the refused file would still sit on disk holding it.
  - option: Only strengthen the prompt and the skill wording
    rejected_because: The prompt already forbade literal credentials; the leak came from that rule not being enforced.
  - option: Substring scrub for every value length
    rejected_because: A short credential such as `user` rewrote the claim id `login-valid-user` and broke the scenario (seen in the hardening suite).

evidence: [CASE-005]
evidence_notes: |
  - Code paths before the change: `spec.py` accepted any string `fill.value`;
    `runner._draft_result` wrote through `utils.redact.redact_value` only;
    `request.load_request` read the scenario without inspecting values;
    `dist/config/claude/skills/verify-browser.md` STEP 5 copies the draft into the request.
  - `tests/checks/e2e_routing.py`: a draft reply and a task carrying the value, and a request
    copied with the value, end with the placeholder in `draft.json`, `request.json`, every
    prompt, the result and the artifacts; a literal password into a password field is
    refused. `tests/checks/e2e_redact.py`: whole-string vs substring rule.

implementation:
  version: 3.7.3
  commits: [uncommitted]
  components:
    - core/evidence/e2e/redact.py (scrub_literals, MIN_LITERAL_SUBSTRING)
    - core/evidence/e2e/request.py (scrub_request_file)
    - core/evidence/e2e/runner.py (task/request/draft scrub, secret_literals meta)
    - core/evidence/e2e/spec.py (password-field placeholder rule)
    - dist/config/claude/skills/verify-browser.md, docs/runtime-contracts.md
    - tests/checks/{e2e_routing,e2e_redact}.py

disposition:
  implementation_status: implemented
  validation_status: not_validated

validation:
  summary: |
    Offline suites (fake provider, fake player), then one real draft on the maintainer's
    private web project (2026-09-28). That draft exposed a defect in the first version of the
    rule: the profile's password was an ordinary word, the model named a step `fill-password`,
    and the substring rule rewrote the id to `fill-${E2E_PASS}` — a false leak report and an
    invalid draft. Fixed the same day: structural fields are never rewritten and a substring
    match must stand as its own token. The next draft wrote the grounded selector
    `{"css": "#password"}`, which the token rule still rewrote (a `#` is not an identifier
    character). Selector fields now match a letters-only value only as the whole string; any
    other value is still found as a token inside a selector (verification caught that a
    whole-string-only rule let `{"text": "Welcome user@example.test"}` through; a second
    pass caught that non-letter values of 4–7 characters were never token-matched, now they
    are from 4). A credential that is an
    ordinary word stays inherently ambiguous for substring matching — see limitations. The leaking run the maintainer first observed has not
    been repeated.

trade_offs:
  better:
    - A value typed out by an agent no longer survives in draft.json, request.json, the stage prompts, the result or the artifacts.
    - The leak is reported by credential name, so it is seen rather than silently patched.
  worse:
    - A literal that merely equals a credential value (a search for the test user's email) is also turned into its placeholder; the player still receives the same value.
    - Every run reads secrets.json before the draft/request scrub, as it already did before substitution.

limitations:
  - Not covered — the raw provider reply archived before parsing (`response.last.md`, `output.raw.md`) and job records that store the task before the runner sees it.
  - A value shorter than 4 characters is matched only as the whole of a `value` field; one of 4–7 characters only as a whole string.
  - A letters-only credential inside a longer selector, or one under 8 characters inside any longer string, is not scrubbed — for a plain word the match is more likely the word than the value.
  - A credential that is an ordinary word (e.g. a weak development password) can still be flagged in free text such as the task, where it may be the word rather than the value; the flag names the key, and substitution restores the same text, so the run is unchanged.
  - A literal the lookup does not hold (secrets.json not filled yet) is caught only in a password field; a user name typed into an email field is indistinguishable from test data such as a registration address.
  - A provider with filesystem access can still read secrets.json itself (Codex has no enforceable read boundary); this record does not change that.

revisit_when:
  - A literal credential is found in a provider archive or job record in real use; then scrub those writers too.
  - Users report a legitimate literal being replaced in a way that changes a run.
