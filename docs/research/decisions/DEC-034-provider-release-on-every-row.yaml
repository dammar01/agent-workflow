schema_version: 3
id: DEC-034
title: Every usage row names its provider release, the version is cached per user, and codex sandbox refusals are read from stderr
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Local branch review of DEC-028 and DEC-024 before release; versions measured on the maintainer's machine
problem: |
  DEC-028 promised that every call's usage row names the provider release and whether it was
  tested. The status was stamped into a copy of the adapter metadata that single-invocation
  rows never read, and continuation rows copied neither field, so opencode and agy rows had
  no version and codex rows no status. Reading the version also ran `<cli> --version` on every
  delegated run, because the cache lived for one process: 1.23 s for opencode and 0.28 s for
  codex on the maintainer's machine. DEC-024's sandbox classifier searched stderr plus stdout,
  and stdout carries the agent's own tool output, so a file the agent read that mentions a
  sandbox failure turned an unrelated non-zero exit into `sandbox_unavailable` with a fix that
  does not apply.
decision: |
  The version is stamped on the metadata each row is built from, single call and every
  continuation row, for every provider. `read_version` takes the first line holding a semver,
  from stdout then stderr, and persists it per user keyed by the executable's resolved path,
  mtime and size, expiring after 24 h; a CLI without a version is cached as null and a timeout
  is not cached. codex `sandbox_unavailable` is classified from stderr only.
rationale: |
  The trail DEC-028 describes exists to answer which release a failure ran on; a field that
  is null on most rows answers nothing. A per-call cost to produce it contradicts the latency
  question the trail serves.
alternatives:
  - option: Keep the process-local cache and accept the per-run cost
    rejected_because: Every delegated run is a new process, so the cache never hit.
evidence: [DEC-028, DEC-024]
evidence_notes: |
  `tests/checks/usage_tokens.py`: a single call and a two-call continuation through
  `Executor.execute` give rows that carry both fields (previously `(None, None)`).
  `tests/checks/provider.py`: cache hit without spawn, invalidation on mtime, null cached,
  timeout not cached, unusable cache path fails open; sandbox phrases only in stdout are not
  `sandbox_unavailable`. Timings above are one measurement each, not a distribution.
implementation:
  version: 3.8.0
  commits: [77a6f86d3814df22c6faa54795b4fc550d5c21aa]
  components:
    - core/provider/executor.py (stamp on row metadata, continuation rows)
    - core/provider/versions.py (persistent cache, version line parsing)
    - adapters/providers/codex_adapter.py (sandbox from stderr)
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    The suites above pass. No real-use usage stream has been read back since the change.

    2026-10-04, the usage stream of this repository read back: every delegated row written after
    this decision's commit (13 rows: verify, analyze, explore, plan) carries `provider_version`
    and `provider_version_status: stable`; the rows without a status all predate the commit,
    the gap this record describes. Rows from a second project the same day carry both fields
    too. No run is marked clean: the maintainer has not yet confirmed it. Observed, not validated: one provider (codex) and one release.
  runs:
    - date: 2026-10-04
      job_id: "job_20261004_135445_347290"
      description: "Analyze row with provider_version and status stable after the change."
      clean: false
trade_offs:
  better:
    - Usage rows can attribute failures to a provider release.
    - The version read no longer costs each delegated run.
  worse:
    - An upgrade that leaves a `.cmd` shim byte-identical keeps the old reading for up to 24 h.
limitations:
  - codex rate-limit, stream and permission classifiers still read stdout as well.
revisit_when:
  - A failure is attributed to the wrong release because of the cache.
revises: [DEC-028, DEC-024]
questions: [RQ-07a, RQ-09]
