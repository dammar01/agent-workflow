schema_version: 3
id: DEC-020
title: A task is closed by a verify the runtime derives as pass; a commit is recommended, not required
date: 2026-10-03
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer critical interview 2026-10-03
problem: |
  DEC-015 closed a task with a commit after a verify whose declared verdict was DONE, and kept
  a DONE the runtime derived as `incomplete` for not_verified gaps. The maintainer's definition
  of finished is different: the work is finished when verification passes; a commit only marks
  that the edit is done and can be deployed. Declared DONE and derived pass also diverge widely
  (CASE-009), so a task closed on the declared verdict claims more than the runtime shows.
decision: |
  The runtime's task event for verify carries both verdicts: `verdict` (declared, NEEDS FIX on
  a blocking finding) and `derived` (pass | incomplete | fail). A task is `completed` when a
  verify with `derived: pass` follows its edits. A commit closes nothing: it joins the open
  task whose files it includes, or else the task the session last completed. An edit after a
  pass opens the next task. States are completed, open, read_only, unknown; `ready_to_commit`
  and `unverified_closed` are gone. Events written before this change carry no `derived`, so
  their tasks stay open.
rationale: |
  The derived verdict is already the acceptance signal (`UsageRecord.accepted`); closing a task
  on anything else made the task stream disagree with verification. Keeping the declared verdict
  in the event keeps the gap between the two measurable.
alternatives:
  - option: Close on commit after a declared DONE (DEC-015)
    rejected_because: A commit is a recommendation, not the end of the work, in the maintainer's definition.
  - option: Close on a declared DONE
    rejected_because: The maintainer chose the derived verdict; the declared one is what CASE-009 shows to be optimistic.
evidence: [DEC-015, CASE-009]
