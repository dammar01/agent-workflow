      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only task-telemetry --only telemetry` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
    - date: 2026-11-10
      job_id: "local-source-recheck-20261110-verdicts"
      description: "Read-only own-repository telemetry recount and pure validator gap probe; not a clean direct-use run. Original 39 events and newer 15 retained; main-agent final verdict not independently captured. Source: docs/research-drafts/_data/research-closure-2026-11-10/remaining/exoma-handoff-2026-11-10/recheck-results.json."
      clean: false

trade_offs:
  better:
    - A completed task is one the runtime verified, whether or not it was committed.
    - Declared and derived verdicts are both in the stream, so their gap can be counted.
  worse:
    - Few tasks will read completed while the derived pass rate stays low (CASE-009).
    - History written before this change reads as open, since it lacks the derived verdict.
limitations:
  - A verify that passes on a task with no edits closes nothing; read-only checks stay read_only.
  - A commit that includes files of both an open and a completed task joins the open one only.
  - "2026-11-10: the maintainer's revised final-main_agent authority is an explicit policy direction; implementation/integration and capture of a distinct final main-agent verdict are not established. Reviewer DONE and runtime pass do not substitute for that new field."
revisit_when:
  - The derived pass rate stays so low that completed tasks no longer describe real work.
  - Deploy becomes observable and the maintainer wants it as the closing signal.
revises: [DEC-015]
questions: [RQ-07a]
