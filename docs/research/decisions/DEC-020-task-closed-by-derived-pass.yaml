validation:
  summary: |
    The task-telemetry, telemetry, and contracts suites pass. Not yet run on real use.
    Result added 2026-10-27 (creator_observation, maintainer_development): 39 verify task events
    carry `derived` (`tasks.jsonl`): pass 3, incomplete 25, fail 11. Tasks closed on a derived
    pass 3 times. That pass rate is low enough to meet the first revisit_when item; whether the
    completed tasks still describe real work was not judged. Source: this repository's
    `.workflow/data/` telemetry on the maintainer's machine (re-countable there only), window
    2026-10-18 to 2026-10-27, counted 2026-10-27.
    Maintainer interview 2026-10-27: first judged the verdicts that keep tasks open usually
    fair. Shown why they end as they do (CASE-032: every incomplete verify in this repository
    had the reviewer's own DONE, and the verdict fell only on its not_verified items), the
    maintainer judged incomplete to appear too often. The low pass rate therefore meets the
    first revisit_when item as a reported problem, and the record stays not_validated.

    Maintainer re-evaluation 2026-11-10: the main_agent owns final task-closure reasoning. Its final DONE
    may accept or disregard second_agent incomplete findings after analysis; reviewer findings and
    runtime-derived verdict remain separate evidence. This revisits the earlier derived-pass-only policy
    as the intended acceptance direction, not as a claim that a revised runtime has been implemented.
    Local recount preserves the original 39 verify events (3 pass, 25 incomplete, 11 fail; 28 reviewer DONE).
    The newer window from 2026-10-28 to the captured 2026-11-10 cutoff has 15 verify events: 13 reviewer
    DONE; runtime 1 pass, 12 incomplete, 2 fail. These declarations are the reviewer's, not separately
    captured final main-agent verdicts; no main-agent completion count or task-success rate is inferred.
    Current validator probes also show that an explicitly out-of-scope not_verified item can derive
    incomplete from a clean DONE. Source/method/cutoff:
    docs/research-drafts/_data/research-closure-2026-11-10/remaining/exoma-handoff-2026-11-10/recheck-results.json.
    Historical verdicts, the older implementation history and not_validated remain unchanged.

  maintainer_decision: |
    Maintainer re-evaluation 2026-11-10: final task-closure authority is the main_agent. A final
    main_agent DONE may accept or disregard second_agent incomplete findings after main-agent reasoning.
    Preserve second-agent judgement and runtime-derived verdict as separate evidence; neither substitutes
    automatically for the main-agent final decision. Earlier telemetry declared DONE came from the
    reviewer, not a captured main-agent final verdict. This revises the intended acceptance policy;
    implementation/evaluation of that revised policy is not established by this statement. Historical
    verdicts/counts and current validation labels remain unchanged.

  runs:
