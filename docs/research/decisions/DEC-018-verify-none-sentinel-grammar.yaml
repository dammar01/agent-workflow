    outputs since 2026-10-18 (`sessions/*/logs/*verify*/output.raw.md`), 39 of them with a
    sentinel line; no verify row carries an `error_type`. The sentinel grammar ran in real use
    without a parse failure. The remeasurement named above (clean verifies derived `fail`) was
    not made. Source: this repository's `.workflow/data/` telemetry on the maintainer's machine
    (re-countable there only), window 2026-10-18 to 2026-10-27, counted 2026-10-27.

    Result added 2026-11-10 (designed fixture; not clean direct use), Exoma pin 1071c2f: closure group parser recorded status fail, 8/12 registered checks meeting expectations. Source: docs/research-drafts/_data/research-closure-2026-11-10/runs/20261110T010132779372Z/parser/result.json; parent result-manifest.json and protocol.json identify the run and method. Existing parenthetical/plain-none continuation limits are reproduced. Main validator continuation handling is also measured; no product fix was applied. No validation authority or disposition label is changed. Counterexamples retained: none. /   caller X fails [fixture.py:1]; none (caller X fails); none /   caller X fails [fixture.py:1]; browser normalizer preserves none /   caller X fails [fixture.py:1].


    Result added 2026-11-10 (local pure-source recheck; not clean direct use): project_pin 8/12;
