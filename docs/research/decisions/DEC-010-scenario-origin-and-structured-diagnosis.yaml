schema_version: 1
id: DEC-010
title: Scenario-caused failures get their own origin, stay out of the repeat brake, and every non-pass carries a structured diagnosis
date: 2026-09-28
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: "maintainer report: the 3x repeat block counted draft-writing mistakes and its message did not help"
revises: [DEC-008]

problem: |
  The repeat brake (DEC-005, DEC-008) counted every browser run that did not pass into an
  `app`, `harness` or `timeout` streak. A scenario the draft wrote wrongly — a guessed selector
  that matched nothing, a write or navigation the run's own policy refused — was classified
  `harness` and counted like an environment failure, so three drafting mistakes braked the
  origin. The refusal then answered with one generic sentence. Nothing structured said why a
  run failed, what failed, what to do next, what to fix, or what the next draft should know,
  and a draft that never became `ready` left no countable record at all (CASE-005 was tallied
  by hand from job files).

decision: |
  - A fourth failure origin, `scenario` (`classify.ORIGIN_SCENARIO`), on evidence only: a
    heuristic selector that missed, a selector of any provenance that matched several
    elements (`selector_ambiguous`), `mutation_blocked`, `navigation_blocked`. A run whose
    undecided failures are all `scenario` ends `incomplete: scenario_error`, which is neither
    retried nor counted — and does not clear a standing streak either
    (`classify.NOT_COUNTED_REASONS`, `meta.e2e.repeat_not_counted`). A grounded selector
    missing from a settled page stays `app`, as before.
  - `classify.diagnose(report)`: `{version, cause, next_step, failed, reason, fix_hint,
    reusable}` for every non-pass run, with `cause` and `next_step` as enums and `fix_hint` as
    fixed text per cause — never page text. It travels in meta, report.json, the reviewer's
    evidence block and the quality row. The repeat record stores the newest cause, so a brake
    refusal carries the same diagnosis.
  - Reusable causes (`scenario_selector`, `selector_not_rendered`) are written to browser
    knowledge as `failure_hint` entries for the next draft and retired by a passing run.
  - Drafts: validator messages are mapped to an ordered category enum
    (`spec.error_category`); a non-ready draft carries a diagnosis (`draft_invalid`,
    `draft_secrets`, `draft_blocked`) and every draft writes a `kind: e2e_draft` quality row;
    `--command report` aggregates them as `e2e.drafts`.

rationale: |
  The brake exists for loops the scenario cannot fix. A scenario mistake is the opposite case:
  the next run is a different scenario, so counting it locks people out of the fix, and letting
  it clear a streak lets a typo erase evidence of a real environment problem. The rest is the
  maintainer's request for failures that explain themselves in enums that can be counted, so
  the draft problem in CASE-005 can be measured from telemetry instead of by hand.

alternatives:
  - option: Keep `harness` and only exclude heuristic selector misses from the count
    rejected_because: The run would still be reported and retried as an environment problem, and the refusal text would still name the wrong owner.
  - option: Free-text diagnosis written by the reviewer (stage 3)
    rejected_because: It is not countable, costs a provider call, and does not exist for incomplete runs, which skip the reviewer.
  - option: Reclassify grounded selector misses as `scenario` too
    rejected_because: A selector the codebase names that vanished is the application-changed case; calling it the scenario's would hide regressions (the `unknown`-is-never-promoted rule).

evidence: [CASE-005, DEC-005, DEC-008]
evidence_notes: |
  - Code before the change: `classify.classify_step` returned `harness` for heuristic selector
    misses and policy refusals; `runner` counted every non-pass report; `knowledge.note_repeat_failure`
    stored a fixed note; `_record_run` wrote runs only.
  - Tests: `tests/checks/e2e_normalize.py` (classification, diagnosis, no page text),
    `tests/checks/e2e_routing.py` (scenario_error not retried, streak neither counted nor
    cleared, diagnosis in meta and report.json, failure_hint written and retired, brake
    diagnosis, draft diagnosis and quality row), `tests/checks/e2e_spec.py` (error categories),
    `tests/checks/e2e_metrics.py` (draft aggregation).

implementation:
  version: 3.7.3
  commits: [uncommitted]
  components:
    - core/evidence/e2e/classify.py (ORIGIN_SCENARIO, NOT_COUNTED_REASONS, diagnose, diagnosis_for_cause)
    - core/evidence/e2e/runner.py (diagnosis wiring, repeat skip, failure_hint, draft diagnosis and quality row)
    - core/evidence/e2e/knowledge.py (failure_hint kind, repeat entries carry cause and hint)
    - core/evidence/e2e/spec.py (DRAFT_ERROR_CATEGORIES, error_category)
    - core/evidence/e2e/normalize.py (diagnosis line in the evidence block)
    - core/evidence/e2e/player.py (fake modes harness_fail / scenario_fail)
    - core/runtime/state.py (cause on the repeat record)
    - core/audit/telemetry.py (e2e.drafts)
    - dist/config/claude/skills/verify-browser.md, docs/runtime-contracts.md
    - tests/checks/{e2e_normalize,e2e_browser,e2e_routing,e2e_spec,e2e_metrics}.py

disposition:
  implementation_status: implemented
  validation_status: not_validated

validation:
  summary: |
    Offline suites (fake provider, fake player), then real use on the maintainer's private web
    project (2026-09-28). The first real run failed at a login password field whose grounded
    `label` selector matched two elements (the field and its show/hide toggle): the run was
    classified `app`, the reviewer called it an application failure, and it fed the app
    streak — the complaint this decision answers, reproduced. `selector_ambiguous` was then
    moved to `scenario` whatever its provenance, with its own cause
    (`scenario_selector_ambiguous`); before, the diagnosis read `selector_not_rendered`, whose
    hint says the element is missing. The draft categories have not been compared with a
    recount of real jobs.

trade_offs:
  better:
    - A drafting mistake no longer spends the repeat brake, and a real environment streak survives it.
    - Every non-pass run and refusal says why, what, next step and fix in enums that can be counted.
    - Draft failures become telemetry, so CASE-005's tally can be reproduced from `--command report`.
  worse:
    - Heuristic selector misses and policy refusals are no longer retried as flakes; a flaky page that sometimes hides a guessed selector now ends at the first attempt.
    - The category mapping reads validator message text; renaming a message can move it to another category unless the pattern list is updated.

limitations:
  - The `scenario` origin covers only evidence the player reports today; a wrong readiness condition or assertion the draft invented still lands in `unknown` or `app`.
  - "`fix_hint` is generic per cause; it names the next step, not the specific fix."
  - Draft categories count the first reply and what the repair left, not every intermediate error.

revisit_when:
  - Real runs show `scenario_error` hiding an application change (a guessed selector that was right before a regression).
  - The e2e.drafts categories disagree with a hand recount of the same jobs.
