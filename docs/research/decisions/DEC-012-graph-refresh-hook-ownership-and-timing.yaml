schema_version: 2
id: DEC-012
title: The Stop hook is the only graph-refresh trigger, prunes before it walks, and records its cost with project size
date: 2026-09-29
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: "maintainer latency report (CASE-006); source reading of graph-refresh.ps1"

problem: |
  Latency is part of RQ-13. The maintainer feels it after execute, in execute+verify turns,
  in verify alone, and when the main agent runs `graphify update` itself; it is worse on a
  large Laravel backend (CASE-006). Verify alone never runs the hook, so the hook explains
  only the implementing turns. For those:
  - The graph-refresh Stop hook runs at the end of any turn carrying `[EXECUTION RESULT]` or
    `[REFACTOR RESULT]`, so its cost is felt as part of that turn.
  - `graph-refresh.ps1` runs `Get-ChildItem -Recurse` over the whole project and drops the
    skip directories (`vendor`, `node_modules`, `.workflow`, ...) only afterwards, so the
    mtime check walks every dependency file. `graph-refresh.sh` already prunes first.
  - The bundled `CLAUDE.md` ("Auto `graphify update` setelah code change") and
    `skills/refactor.md` also tell the main agent to run it — a second trigger, which the
    maintainer has observed.
  - Measured before the change (CASE-008): the scan costs 2-3.5 s on a Laravel backend with
    4,141 source files and on a frontend with 582 alike, because it walks 23,810 and 62,528
    files in skip directories; a pruned scan takes 193 ms and 37 ms.
  - `graphify update` took 44 s on the Laravel graph (34,620 nodes) and exited 1 because the
    HTML visualisation is too large, although `graph.json` was rewritten. The hook waits at
    most 45 s, so a larger change risks a kill before the graph is written.
  Nothing records the hook's duration or the project's size at run time, so neither cost can
  be told apart from delegated-call latency in use.

decision: |
  - The Stop hook is the single owner of `graphify update`; the prompt wording that asks the
    main agent to run it is removed (`CLAUDE.md`, `skills/refactor.md`).
  - `graph-refresh.ps1` walks with an explicit directory stack that skips excluded directory
    names before descending, like `graph-refresh.sh`.
  - `graphify update` runs detached from the turn: a stale graph makes the hook create
    `graphify-out/.refresh.lock` exclusively ({pid, token, started}), start a worker (the
    same script with -WorkerRoot, or the embedded python with start_new_session), hand the
    lock to the worker's pid, and return. On Windows the worker is created through WMI
    Win32_Process.Create with a hidden window: Start-Process -WindowStyle Hidden flashed a
    terminal (Windows 11 hands new consoles to Windows Terminal, which ignores SW_HIDE), and
    CreateNoWindow inherits the pipes Claude Code reads the hook through, which held the
    hook until the child exited (6.4 s against a 6 s child). Start-Process remains the
    fallback when WMI fails. The worker bounds graphify at 600 s, records one
    row, and removes the lock only when it still carries its token.
  - graphify rewrites graph.json in place (a read during a refresh parsed half a file in 2
    of 49 reads), so a held lock — live pid, younger than 15 minutes — makes the graph
    unavailable to the runtime (`graph_index.load_graph` returns None) and stale to the main
    agent (CLAUDE.md Graphify section). A live lock also stops a second refresh
    (`skipped_running`). The hand-off to the worker's pid is staged beside the lock and
    renamed over it, and a lock that exists but cannot be read counts as held while young:
    the first version truncated and rewrote it, which a delegated verify
    (job_20260929_145950_670536) found could let a reader through mid-write.
  - Each run past gate 1 appends one fail-open row, `kind: graph_refresh`, to
    `.workflow/data/quality.jsonl` when that directory exists: outcome (skipped_fresh |
    skipped_running | no_graphify | refreshed | timeout | error), hook_ms (what the turn
    paid), scan_ms, files_visited, dirs_skipped, and for a refresh graphify_ms,
    graphify_exit, graph_rewritten. A turn that implemented nothing writes no row.
    `report` summarises them as `graph_refresh`.
  - A graphify run counts as `refreshed` when `graph.json` was rewritten, whatever its exit
    code: on a large graph graphify exits 1 over the HTML visualisation alone (CASE-008).

rationale: |
  Recording size next to duration is what lets latency be compared across projects (RQ-13).
  Pruning makes the fresh-graph path independent of dependency size; one trigger removes a
  duplicate `graphify update`.

alternatives:
  - option: Keep the prompt trigger and drop the hook
    rejected_because: A prompt instruction is unenforced and fires on the model's judgement; the hook has explicit gates.
  - option: Keep graphify synchronous inside the hook (the first version of this decision)
    rejected_because: "On the stale path the large graph's graphify outlived the 45 s wait and was killed before writing: the turn paid 47 s and the graph never refreshed (CASE-008, second run). The overlap with the next turn's read that first ruled out a detached run is handled by the refresh lock."
  - option: Skip graphify on graphs above a size threshold
    rejected_because: The large graph, where the cost is, would never refresh automatically; the threshold would need calibrating.
  - option: Refresh on git post-commit (`graphify hook install`)
    rejected_because: Writes into each project's .git/hooks beside the user's own hooks, makes a commit on the large project wait for graphify, and leaves the graph stale between execute and commit.
  - option: Keep post-filtering and lower the 45 s timeout
    rejected_because: On a fresh graph the walk, not graphify, is the cost; a lower timeout only cuts refreshes.

evidence: [CASE-006, CASE-008]
evidence_notes: |
  Research question: RQ-13.
  Code at the time: dist/config/claude/hooks/graph-refresh.ps1 (lines 59-71 recursive walk then
  Where-Object, 97 45 s wait), graph-refresh.sh (lines 44-58 prune first),
  dist/config/claude/CLAUDE.md (Graphify section), dist/config/claude/skills/refactor.md.

implementation:
  version: 3.8.0
  commits: [98449fe044cead6046d5565fc7c040271ea03cd4]
  components:
    - dist/config/claude/hooks/graph-refresh.ps1 (pruned walk, refresh lock, detached worker, row)
    - dist/config/claude/hooks/graph-refresh.sh (refresh lock, detached worker, row)
    - core/graph/graph_index.py (refresh_in_progress; load_graph honours the lock)
    - core/audit/telemetry.py (report.graph_refresh)
    - dist/config/claude/CLAUDE.md, dist/config/claude/skills/refactor.md (prompt trigger removed, lock rule)
    - tools/maintain/measure_graph_hook.py (--wait-refresh)
    - docs/reference.md (Graphify, report), docs/runtime-contracts.md, docs/team-guide/troubleshooting.md
    - tests/checks/graph_refresh.py (new suite graph-refresh), tests/checks/telemetry.py

disposition:
  implementation_status: implemented
  validation_status: observed

validation:
  summary: |
    Before the change: recorded in CASE-008 with tools/maintain/measure_graph_hook.py on a
    large Laravel backend and a frontend (installed hook on a fresh graph: 2,136 ms and
    2,328 ms). After: the same script and the hook's own maintenance rows on the same two
    projects. Supported when the hook on a fresh graph stays under [PLACEHOLDER] ms on both
    and no longer depends on the size of skipped directories, and no implementing turn runs
    graphify twice. Rejected when the fresh-graph path stays a material share of the turn
    after pruning. The stale-graph path was not measured before the change; before
    implementing, `measure_graph_hook.py --run-hook --force-stale` backdates graph.json on each
    project (sources untouched), so the installed hook takes the refresh path; the result is
    added to CASE-008: 47,028 ms with graphify killed and the graph not refreshed on the
    Laravel backend, 3,774 ms and refreshed on the frontend. The revisit condition on the 45 s
    limit is met before the change.

    After, commit 98449fe, 2026-09-29 (CASE-008 third run, hook driven directly): the turn paid
    527 ms and 393 ms; graphify finished 72 s and 2.2 s later and rewrote both graphs. The
    graph-refresh suite passes for the .ps1 and the .sh flavour's python on Windows. Not yet
    shown: a real Claude Code turn letting the worker outlive the hook, and the bash wrapper
    on POSIX.
  runs:
    - date: 2026-09-29
      job_id: "measure_graph_hook --force-stale --wait-refresh, two projects"
      description: "Hook driven directly on the maintainer's Laravel backend and Next.js frontend with the graph backdated: the turn paid 527 ms and 393 ms, graphify rewrote both graphs (72 s, exit 1; 2.2 s, exit 0). Not a Claude Code turn."
      clean: false
    - date: 2026-09-29
      job_id: "job_20260929_145950_670536"
      description: "Delegated verify: NEEDS FIX on the lock hand-off (truncate then rewrite let a reader through); fixed by a staged rename and fail-closed readers."
      clean: false
    - date: 2026-09-29
      job_id: "job_20260929_150634_399054"
      description: "Delegated re-verify after the fix: the race is closed; the reply's blocking section held one entry reading none, which the runtime counted as NEEDS FIX. Full offline suite passed locally."
      clean: false

trade_offs:
  better:
    - Near-zero hook cost on a fresh graph, independent of dependency size.
    - A stale graph no longer holds the turn, and a large graph refreshes instead of being killed.
    - Hook latency and project size become recorded figures.
  worse:
    - The graph is stale for as long as graphify runs after the turn (72 s on the large graph).
    - A lock, a worker process and a token to maintain in two flavours.
    - One quality row per implementing turn, in a stream nothing prunes.
limitations:
  - Verify latency outside implementing turns is not addressed here (RQ-13, H-008).
  - The main agent's own graph reads honour the lock only through a prompt rule; the runtime honours it in load_graph.
  - "If Claude Code ends a hook's detached children, the refresh is lost and the graph stays stale, as it did before on the large graph; the turn stays fast."
revisit_when:
  - After pruning, the hook stays a significant share of execute turns on large projects.
  - Maintenance rows show graphify runs near the 45 s limit or killed on large projects; then reconsider running it asynchronously, or skipping the HTML visualisation if graphify offers that for update.
  - graphify gains an incremental mode that makes the mtime walk unnecessary.
questions: [RQ-13]
