schema_version: 3
id: DEC-025
title: Verify tests are chosen by the main agent and run by the runtime; the second agent only reads and traces
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer critical interview 2026-10-04; CASE-009, CASE-010
problem: |
  Who ran tests inside a delegated verify depended on the provider. codex's read-only sandbox
  blocks writes only, so its verifies ran whole test suites (CASE-010: verify medians up to
  366 s per project, 47% of outputs naming a test command); opencode can run no command, so its
  verifies listed tests under not_verified and came back `incomplete` (CASE-009). The prompt
  said nothing about which tests to run, and the maintainer named "the second agent runs every
  test" as the bottleneck.
decision: |
  The second agent verifies by reading and tracing and is told not to run test runners. Before
  calling verify, the main agent picks the tests that cover the change and its dependents and
  writes them, with a reason, to the session's `verify/tests.json`. After the review returns,
  the runtime runs each command that starts with a prefix in `commands.verify_test_commands`,
  without a shell, under a per-command timeout, and writes the results into the review's
  [VERIFICATION] block: one `runtime:` line in checks_run per command; a failure, timeout or
  run error is a blocking finding with origin `unknown`; a refused command or a missing request
  is a not_verified gap. The derived verdict is computed from that block as before, so `pass`
  needs green tests and a review with no blocking finding. `commands: []` with a reason declares
  that no test covers the change. The allowlist is empty by default.
rationale: |
  In the interview the maintainer chose the main agent to choose the tests per change, and the
  second agent to only read. Asked how test results should decide the verdict, the maintainer
  left it to the main agent's recommendation: the runtime executes and records, rather than the
  main agent reporting its own results, so the evidence is captured by the machine and not
  claimed by the party that wrote the code; and the second agent never sees the test output,
  so its review is not anchored by it.
alternatives:
  - option: Second agent runs targeted tests under a policy
    rejected_because: opencode cannot run them at all, so behavior would still differ by provider.
  - option: Main agent runs the tests and reports the result to the review
    rejected_because: The result would be a claim by the author of the change, not evidence the runtime captured.
evidence: [CASE-009, CASE-010]
evidence_notes: |
  `tests/checks/verify_tests.py`: green tests with a clean review derive pass; a red test fails;
  no request is incomplete; an explicit empty request keeps the review's verdict; commands
  outside the allowlist or carrying shell syntax never run; an empty allowlist runs nothing.
implementation:
  version: 3.8.0
  commits: [3a378c7b3a961cad8be93f02184f7adc334a0604]
  components:
    - core/evidence/verify_tests.py (request, allowlist, run, merge)
    - core/provider/executor.py (apply after a delegated verify)
    - core/prompt/prompt_builder.py, dist/config/*/AGENTS.md (read and trace, no test runners)
    - dist/config/claude/skills/verify.md (choose tests, write tests.json)
    - core/runtime/config_defaults.py (verify_test_commands, verify_test_timeout_seconds)
    - core/evidence/contracts.py (tests_requested, tests_run, tests_failed, tests_seconds)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The verify-runtime-tests suite and the full suite pass. No real verify has run under the new
    split yet, and no project has an allowlist configured.
trade_offs:
  better:
    - The same verify behavior on every provider, and no whole-suite runs inside a review.
    - A verdict that needs test evidence the runtime captured, not a description of it.
  worse:
    - The main agent decides which tests count; a narrow choice can miss a regression elsewhere.
    - Every project needs an allowlist before any test runs; until then verifies are incomplete.
    - A verify without a request is now incomplete, which is stricter than before for providers that used to pass on reading alone.
limitations:
  - Test commands are matched by prefix; an allowlisted runner can still run any test it is pointed at.
  - Test wall time is added to the verify, sequentially, after the review.
revisit_when:
  - Verifies stay incomplete because projects never configure the allowlist.
  - A regression a broader test choice would have caught reaches the main branch.
questions: [RQ-11, RQ-13]
