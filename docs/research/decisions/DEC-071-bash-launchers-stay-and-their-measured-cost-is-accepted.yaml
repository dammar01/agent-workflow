schema_version: 3
id: DEC-071
title: The bash hook launchers stay, and their measured cost over PowerShell 5.1 is accepted
date: 2026-10-23
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: H-019 rejected by EXP-011's pre-registered fifth pass

problem: |
  DEC-021 and DEC-030 shaped the hooks around PowerShell's spawn cost; DEC-055 then made every
  hook a bash launcher on every OS and the `.ps1` flavour was retired (2e41ffc). H-019 claimed
  the bash launcher costs no more than PowerShell 5.1. EXP-011's fifth pass rejected it under
  a 1.25 × margin: graph-refresh's median `.sh` call is 1.256 × its `.ps1` call (0.453 against
  0.361 s); the other five hooks are within 0.99-1.18 ×. DEC-021 and DEC-030 are frozen, so the
  consequence needs its own record.
decision: |
  Keep the bash launchers on every OS. Accept the measured cost (about 0.04-0.09 s per hook
  call against PowerShell 5.1, far below every hook timeout of 10/15/60 s) as the price of one
  launcher per hook instead of two. No `.ps1` flavour returns.
rationale: |
  The miss is narrow and on one hook, and the cost per call is small next to delegated calls
  measured in hundreds of seconds (CASE-006, CASE-008). Two flavours per hook doubled the
  contract surface the hook tests cover (DEC-055). Restoring them for 0.09 s on a Stop hook
  would trade a measured, bounded latency for a maintenance cost that DEC-055 already judged
  larger.
alternatives:
  - option: Restore the `.ps1` flavour on Windows
    rejected_because: Two flavours per hook again, for a gap under 0.1 s per call.
  - option: Optimise the graph-refresh launcher (cache the interpreter probe of DEC-054)
    rejected_because: Not rejected, deferred; it needs its own measurement, and the probe exists to refuse an old Python, which a cache could miss.
evidence: [H-019, EXP-011, DEC-021, DEC-030, DEC-054, DEC-055]
implementation:
  version: 3.9.0
  # The decision keeps what 2e41ffc shipped (the .ps1 hooks retired, one bash launcher each).
  commits: [2e41ffc]
  components:
    - dist/config/claude/hooks/*.sh (the launchers kept, unchanged by this decision)
disposition:
  implementation_status: implemented
  validation_status: validated
  validated_by: maintainer
  validated_on: 2026-11-01
validation:
  summary: |
    observed. Accepted by the maintainer on 2026-10-23; rests on EXP-011's fifth pass only.
    Result added 2026-10-27 (creator_observation, maintainer_development): every hook in the
    maintainer's sessions since the decision ran through the bash launchers on Windows; the task
    hook wrote events on each day from 2026-10-23 to 2026-10-27 (`tasks.jsonl`). Hook call times
    were not measured in this use. Source: this repository's `.workflow/data/` telemetry on the
    maintainer's machine (re-countable there only), window 2026-10-18 to 2026-10-27, counted
    2026-10-27.

    Result added 2026-11-01: a whole maintainer session on Windows ran through the bash
    launchers (DEC-055 run of the same date). The maintainer felt no delay when sending a
    message, when the agent used a tool, or when it finished. Hook call times were again not
    measured in use; the measurement remains EXP-011's fifth pass.
  runs:
    - date: 2026-11-01
      job_id: "session main_agent-workflow_20261101_163310423_c63b"
      description: "Windows 11: every hook of the session ran through the bash launchers; no delay reported, no hook error, no manual workaround."
      clean: true
  uses: 6
  consistent: true
  maintainer_decision: |
    2026-11-01, critical interview: kept; the measured cost over PowerShell 5.1 stays accepted.
    In daily use the maintainer has not noticed a delay.
trade_offs:
  better: [one launcher per hook on every OS stays]
  worse: [hook calls on Windows cost up to 0.09 s more than PowerShell 5.1 did]
limitations:
  - One machine and one run of 30 calls per hook; graph-refresh sits 0.006 over the margin.
revisit_when:
  - a hook call approaches half its timeout
  - a cached interpreter probe is measured
questions: [RQ-07a, RQ-13]
