schema_version: 3
id: DEC-061
title: /.commit skips the canonical secret-file list instead of name substrings
date: 2026-10-18
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: the first live /.commit run after DEC-060 skipped DEC-060's own record because its file name contains "secret"
problem: |
  DEC-060 skipped any path matching `*credential*` or `*secret*`. On its first live run the
  skill left out `docs/research/decisions/DEC-060-...-skips-secret-names.yaml`, a document whose
  name only describes secrets, and the commit went out without the record the reference cited.
  The skill's list was also a second, hand-written secret list beside the canonical one in
  `core/policy/secret_patterns.py`, with nothing keeping the two in step.
decision: |
  `skills/commit.md` carries `SECRET_READ_PATTERNS` and `SECRET_READ_ALLOWLIST` verbatim between
  `<!-- secret-patterns -->` markers, as `skip` and `keep`. main_agent lowercases the path, uses
  `/` as separator, and skips it when it matches a `skip` pattern (fnmatch) and no `keep`
  pattern. The `*credential*` and `*secret*` substrings are gone. The provider-seam suite
  asserts the block equals the canonical tuples in order, and asserts the skip decision on
  fixed paths: the DEC-060 file name, a `secret-handling.md`, and a `credential_store.py` are
  staged; `.env`, `.ENV.local`, `id_RSA` with a backslash path, `credentials.json`, a `.ssh/`
  file and an upper-case `.PEM` are skipped; `.env.example` is staged.
rationale: |
  The canonical list is already the read boundary for every provider and is tested against the
  OpenCode artifact; reusing it gives the skill the same definition of a secret file and a test
  that fails when either drifts. Copying it into the skill, rather than calling Python, keeps
  the skill usable in any project without agent-workflow on the path.
alternatives:
  - option: Keep the substrings and exempt documentation extensions (.md, .yaml, .txt)
    rejected_because: Still a second hand-written list, and a `secrets.yaml` holding real values would then be staged.
  - option: Have the skill call a Python helper over secret_patterns.py
    rejected_because: The skill would depend on the interpreter and on agent-workflow being importable from the user's project.
evidence: [DEC-060]
evidence_notes: |
  The false positive is commit history: 1d43cbe was committed without the DEC-060 file, which
  had to be staged by hand. provider-seam carries the parity and decision assertions. A full
  suite run and the installer check follow the change.
implementation:
  version: 3.8.4
  commits: [251acd7]
  components:
    - dist/config/claude/skills/commit.md (canonical skip/keep block)
    - tests/checks/provider.py (block parity and skip decisions)
    - docs/reference.md (prompt-layer contracts), dist/manifest.json
disposition:
  implementation_status: implemented
  validation_status: validated
  validated_by: maintainer
  validated_on: 2026-11-01
validation:
  summary: |
    Covered by the parity and decision assertions, and by two live /.commit runs on this
    repository on Windows with no correction. Not run on Linux or macOS.
    2026-11-01: two more live /.commit runs on this repository on Windows (881ef2b, 7949e41),
    each staging only the changed paths, with no correction. None of the four recorded runs had
    a secret-named file in the working tree, so they show that nothing legitimate was skipped,
    not that a secret was held back. That a changed secret file was held back rests on the
    maintainer's report from other projects (below), not on a recorded run.
  runs:
    - {date: 2026-10-18, job_id: commit-251acd7, description: live /.commit on this repository committed 251acd7 on Windows with no correction, clean: true}
    - {date: 2026-10-18, job_id: commit-18fda9e, description: live /.commit on this repository committed 18fda9e on Windows with no correction, clean: true}
    - {date: 2026-11-01, job_id: commit-881ef2b, description: live /.commit on this repository staged pyproject.toml and uv.lock only and committed 881ef2b on Windows with no correction, clean: true}
    - {date: 2026-11-01, job_id: commit-7949e41, description: live /.commit on this repository staged four research files only and committed 7949e41 on Windows with no correction, clean: true}
  uses: 4
  consistent: true
  maintainer_decision: |
    2026-11-01, critical interview: kept as it is. The maintainer reports that /.commit never
    skipped a file that should have been committed, and that in other projects a changed secret
    file was held back and not committed. Validated on the four clean runs above; the held-back
    case is the maintainer's report, not a recorded run.
trade_offs:
  better:
    - Documents named after secrets are committed
    - One definition of a secret file for providers and for /.commit, held by a test
  worse:
    - A secret under an ordinary name (my-secret.txt, prod-credentials.txt) is no longer skipped
    - The skill text is longer by the 31 patterns
limitations:
  - main_agent applies the patterns; nothing checks what it actually stages
revisit_when:
  - A /.commit run stages a file holding a secret under a name outside the list
questions: [RQ-10]
revises: [DEC-060]
