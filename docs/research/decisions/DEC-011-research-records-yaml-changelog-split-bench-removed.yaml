schema_version: 1
id: DEC-011
title: Research records are schema-checked YAML, release notes live per version, and bench/ is retired
date: 2026-09-28
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: "maintainer report on the 3.7.3 cycle: writing research records was the bottleneck, too abstract, and hard to verify"

problem: |
  During the 3.7.3 cycle the research records became the bottleneck. They were Markdown with a
  fenced metadata block and free prose sections, largely generated, so a record could be long
  without answering the questions CONTRACT.md asks, and nothing checked it: enums were comments,
  a decision's commit was `unknown` in every record, and the README inventory was written by
  hand beside the records. `CHANGELOG.md` had grown into one long file that repeated behavior
  already described in the reference. `bench/` held a frozen harness at SUT v3.4.5 that no CI
  step ran, while benchmark method belongs with the hypotheses and experiments it tests.

decision: |
  - Every research record (DEC, H, EXP, CASE, SYN, ARC, LIT) is a `.yaml` file checked against
    `docs/research/schema.yaml` by `tools/maintain/check_research.py`: required fields, enum
    values, file naming, unique IDs, strict unknown-key refusal, and the rules the schema cannot
    express — a DEC that is implemented names its commit(s); H and EXP carry no commit; validation
    beyond `observed` needs the maintainer and an evaluation; a tracked record meets its type's
    tracked gate. The README inventory is generated from the records. The check runs in the test
    suite and in CI; PyYAML is a development dependency only (`requirements-dev.txt`).
  - The existing tracked records (CASE-004/005, DEC-001, DEC-004..008) are converted with their
    content unchanged; the commit each DEC named as `unknown` or blank is filled from Git history
    (dd70afd), which is a factual correction against the source (CONTRACT.md §15).
  - `CHANGELOG.md` becomes an index; each version's notes move to `docs/releases/v<version>.md`.
  - `bench/` is deleted. Benchmark method is recorded as H + EXP records (arms, metrics, results
    in the EXP schema). The harness never produced a ledger (its own `bench/STATE.md`), so no
    result is lost; `docs/evaluation/benchmark.md` says so and points at commit dd70afd.

rationale: |
  A fixed schema turns "is this record complete?" from a reading exercise into a check, and
  enums make the corpus countable. Filling the commit makes each decision traceable to the code
  that carries it. Splitting release notes keeps one short index and puts detail where it is
  read. An unrun frozen harness is maintenance without evidence; the experiment record is where
  a benchmark's design and results have to be anyway.

alternatives:
  - option: Keep Markdown and add YAML front matter only
    rejected_because: Offered and declined by the maintainer; prose sections would stay unchecked.
  - option: A YAML metadata file beside each Markdown narrative
    rejected_because: Offered and declined by the maintainer; two files per record to keep in sync.
  - option: Convert new records only and leave tracked ones as Markdown
    rejected_because: Declined by the maintainer; the corpus would have two formats and the check could not cover it.
  - option: A hand-written YAML subset parser to stay dependency-free
    rejected_because: Declined by the maintainer in favour of PyYAML as a development-only dependency.
  - option: Tag the last bench/ state before deleting it
    rejected_because: Declined by the maintainer; Git history already keeps it.

evidence: [CASE-005]
evidence_notes: |
  Before the change: no parser or validator for research records existed in the repository;
  every tracked DEC carried `commit: unknown` or an empty commit; `bench/` was not referenced by
  `.github/workflows/ci.yml`; `tools/maintain/stamp_version.py` excluded `bench/` because its
  SUT was frozen at v3.4.5.

implementation:
  version: 3.7.3
  commits: [665bb4c6da5098238eab8036a54ef12a9aae2332, c584748bc0c5faf3f26c45e8d88c04217fe7e621]
  components:
    - docs/research/schema.yaml (new), docs/research/*/_TEMPLATE.yaml
    - docs/research/decisions/*.yaml, docs/research/real-cases/*.yaml (converted)
    - tools/maintain/check_research.py (new), tests/checks/research.py (new), tests/run.py
    - requirements-dev.txt (new), .github/workflows/ci.yml
    - docs/research/CONTRACT.md, docs/research/README.md, CLAUDE.md
    - CHANGELOG.md, docs/releases/ (new), RELEASE.md
    - bench/ (removed), docs/evaluation/, docs/reference.md, tools/maintain/stamp_version.py, tests/checks/workflow_layout.py

disposition:
  implementation_status: implemented
  validation_status: validated
  validated_by: maintainer
  validated_on: 2026-09-28

validation:
  summary: |
    `check_research.py` passes over the converted corpus and the suite's fixtures reject each
    rule it enforces. Whether YAML records are faster to write and easier to verify than the
    Markdown ones is the maintainer's judgement over the next cycle, not yet recorded.

    Observed, not validated: the strict gate passes only where docs/research-drafts/ exists until
    the held CASE-004 fix lands.

    2026-09-28: CASE-004 was moved back to drafts instead (every record it relates to is a
    draft), and CASE-005 no longer references it. `check_research.py --strict --git` then passed
    both with docs/research-drafts/ present and with it moved away (a clean-clone equivalent),
    10 records, 0 warnings, and the `research` suite passed. Validated by the maintainer on
    that run.
  runs:
    - date: 2026-09-28
      job_id: "local check 2026-09-28"
      description: "`check_research.py --strict --git` passes on the maintainer's machine after commits 665bb4c and c584748; in a clean clone it fails on CASE-004's draft references (fix held)."
      clean: false
    - date: 2026-09-28
      job_id: "local check after CASE-004 moved to drafts"
      description: "`check_research.py --strict --git` with and without docs/research-drafts/ (clean-clone equivalent): 10 records, 0 warnings; `tests/run.py --only research` passed."
      clean: true
    - date: 2026-09-28
      job_id: "local release-layout scan after CASE-004 moved to drafts"
      description: "Changelog split and bench removal: `stamp_version.py --check` and `gen_manifest.py --check` pass; a scan of every tracked Markdown/YAML file outside prompt/ found 0 broken relative links, including every link from CHANGELOG.md into docs/releases/; every remaining mention of `bench/` describes its removal; `tests/run.py --only stamp-version --only manifest --only deps` passed."
      clean: true
  uses: 10
  consistent: true
  maintainer_decision: |
    2026-10-03, critical interview: kept validated. Research records have been written and
    checked as schema YAML in every research change since the conversion.
  measurements:
    - source: "git log --since=2026-09-28 -- docs/research, counted on 2026-10-03"
      value: "10 commits touching docs/research; check_research.py OK on 38 records at 4e5582e"

trade_offs:
  better:
    - Completeness, enums, commits and the tracked gate are checked in CI instead of by reading.
    - Each decision names the commit that implements it; the inventory cannot drift from the records.
    - One short changelog index; per-version notes in their own files.
  worse:
    - Long prose is written as YAML block scalars; Markdown rendering on the forge is lost.
    - A development dependency (PyYAML) is needed to run the check; the runtime stays stdlib-only.
    - bench/ and its frozen SUT are gone from the tree; reproducing the old study needs Git history.
    - Converting records required a `better` trade-off in two decisions (DEC-007, DEC-008) that had none written; it was taken from each record's own rationale.

limitations:
  - The schema checks that fields are present and well-formed, not that their content is true or specific.
  - The drafts in docs/research-drafts/ written before this change are still Markdown; `--drafts` refuses each one until the maintainer converts it, and CI does not run `--drafts` (drafts are git-ignored).
  - An `uncommitted` commit is allowed until the commit exists; only `--strict` refuses it.

revisit_when:
  - Records still take long to write after a cycle, or fields are routinely filled with filler to pass the check.
  - A benchmark study is needed that the EXP schema cannot describe.
