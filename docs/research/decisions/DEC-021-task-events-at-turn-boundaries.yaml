schema_version: 3
id: DEC-021
title: Task events are read at turn boundaries — skills from the prompt, commits from HEAD — not from every Read and Bash call
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Measured hook cost in a maintainer session, 2026-10-04
problem: |
  DEC-015 registered the `task-events` hook on PostToolUse for Read, Skill, Edit, Write,
  MultiEdit, NotebookEdit and Bash, and on PreToolUse for Bash, to catch a local skill being
  loaded (a Read of its skill file) and a `git commit` (HEAD before and after the call). Every
  run starts a fresh PowerShell on Windows: 422-486 ms per run, measured three times on the
  maintainer's machine. Read is the most frequent tool call and paid that for nothing almost
  every time; Bash paid it twice, beside the gate's own PreToolUse hook.
decision: |
  The hook runs on three events. UserPromptSubmit: a prompt opening with `/.<name>` naming a
  local skill is a skill event, and the session's first prompt snapshots HEAD under
  `.workflow/data/task-hook/<session>.head`. PostToolUse, matcher
  `Skill|Edit|Write|MultiEdit|NotebookEdit`: the Skill tool and file edits, as before. Stop,
  and every later prompt: the commits between the snapshot and HEAD, first-parent and oldest
  first, each with its paths, then the snapshot moves. Events are version 2. The installer
  removes a shipped hook's command from an event the template no longer registers it on, so
  upgrading drops the old PreToolUse entry.
rationale: |
  A skill is invoked from the prompt and a commit is a HEAD that moved; both can be read once
  per turn. The per-turn cost is two hook runs plus one per edit, instead of one per Read and
  two per Bash. A commit made in a terminal between turns is now caught too.
alternatives:
  - option: Keep the tool hooks and narrow them inside the script
    rejected_because: The cost is the process start, paid before the script can decide anything.
  - option: Derive edits as well as commits from git at Stop
    rejected_because: The working tree also holds the user's own changes; a per-edit event says which files the agent touched.
evidence: [DEC-015]
evidence_notes: |
  Spawn time measured with the shipped PowerShell hook and an empty Read payload (three runs,
  422, 454 and 486 ms). `tests/checks/task_telemetry.py` exercises every available flavour on a
  real git repository: prompt skill, Read ignored, edits, two commits recorded once at Stop, and
  a commit between turns recorded on the next prompt.
implementation:
  version: 3.8.0
  commits: [8d2d42b7260139278a57924c319155a5767ddde2]
  components:
    - dist/config/claude/hooks/task-events.ps1 and task-events.sh (events, HEAD snapshot)
    - dist/config/claude/settings.template.json (UserPromptSubmit, PostToolUse, Stop entries)
    - installer/settings.py (_drop_relocated_hooks)
    - core/evidence/contracts.py (TASK_EVENT_VERSION 2)
    - core/audit/task_telemetry.py (docstring)
disposition:
  implementation_status: implemented
  validation_status: validated
  validated_by: maintainer
  validated_on: 2026-11-01
validation:
  summary: |
    The task-telemetry and installer suites pass. Installed by the maintainer on 2026-10-04;
    no real session has been counted yet.
    Result added 2026-10-27 (creator_observation, maintainer_development): 755 task events, all
    version 2, on 9 days (`tasks.jsonl`); 58 commit events, every one with its paths; 45 session
    head snapshots in `task-hook/`. Source: this repository's `.workflow/data/` telemetry on the
    maintainer's machine (re-countable there only), window 2026-10-18 to 2026-10-27, counted
    2026-10-27.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only task-telemetry --only hook-launchers` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
    - date: 2026-11-01
      job_id: "session main_agent-workflow_20261101_163310423_c63b"
      description: "Maintainer session on this repository, Windows: five commits (881ef2b, 7949e41, aeccd6b, b43b64d, b8888b8), each recorded once in `tasks.jsonl` as a version-2 commit event with its paths; seven skill events and eight edit events in the same session; no manual workaround."
      clean: true
  uses: 10
  consistent: true
  maintainer_decision: |
    2026-11-01, critical interview: kept. The maintainer never found a commit missing from the
    log or recorded with the wrong files.
  measurements:
    - source: "this repository's `.workflow/data/tasks.jsonl`, rows dated 2026-11-01 (and the 2026-10-18..2026-10-27 window counted 2026-10-27)"
      value: "5 of 5 session commits recorded with paths; 58 commit events with paths in the earlier window"
trade_offs:
  better:
    - No hook run on Read or Bash; a turn pays two runs plus one per edit.
    - Commits made outside the agent between turns are recorded.
  worse:
    - A skill loaded by a Read without its prefix (auto-intent from plain language) is no longer recorded.
    - A commit is recorded at the end of its turn, after any verify in that turn, not at the moment it was made.
limitations:
  - A turn that ends abnormally without Stop leaves its commits for the next prompt.
  - Ownership of a commit still depends on its paths matching the task's edits (DEC-020).
revisit_when:
  - Task reports show plain-language local skills missing in a way that matters.
  - Claude Code offers a hook filter by input, which would let a Read hook stay cheap.
revises: [DEC-015]
questions: [RQ-07a, RQ-13]
