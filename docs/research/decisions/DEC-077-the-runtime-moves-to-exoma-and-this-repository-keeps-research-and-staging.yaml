schema_version: 3
id: DEC-077
title: The runtime moves to Exoma, and this repository keeps research and staging against a pinned Exoma commit
date: 2026-10-25
status: accepted
provenance:
  type: direct
  confidence: high
  basis: maintainer decision; Exoma's development guide already assigns the two roles

problem: |
  Exoma began as a fork of agent-workflow 3.9.0 and became the released runtime (PyPI package
  `exoma`, `python -m exoma`, package-local `_bundle`). This repository still carried a full
  runtime copy (`core/`, `adapters/`, `config/`, `utils/`, `installer/`, `main.py`,
  `install.py`, `check.py`, `dist/`), its tests, its release surface and its runtime
  documentation. Two runtimes meant a measurement could run against code no user runs, and a
  fix could land in the copy that is not shipped. A module-by-module audit found every root
  module with an Exoma counterpart; the differences were the checkout-to-package migration.
decision: |
  This repository depends on Exoma through a git pin in `pyproject.toml` (resolved in
  `uv.lock`) and carries no runtime copy. Removed: the runtime packages and entry points,
  `dist/`, the runtime's unit, integration and product end-to-end checks, the version stamp
  and manifest tooling, the release notes, and the runtime documentation (reference, runtime
  contracts, architecture, installation, team guide, security, limitations), which Exoma
  owns. Kept and migrated to `exoma.*` imports: the research and measurement harnesses
  (`check_research`, `export_blind_sample`, `measure_real_use`, `measure_task_outcomes`,
  `measure_graph_hook`, `replay_facts`) and the delegated staging run (`tools/e2e`). The suite
  is the research, fact-replay and blind-sample checks plus a check that every harness
  imports against the pin. No product version: `pyproject.toml` carries the required
  placeholder `0`, and an experiment names the Exoma version it ran against in
  `version_under_test`. Tracked records are unchanged.
rationale: |
  CHARTER §12 fields for the change:
  Research question: does a delegated run measured here describe the runtime users run?
  Hypothesis: with one runtime, pinned by commit, every measurement and staging result is
  attributable to a named Exoma version.
  Variable changed: where the runtime under study comes from (in-tree copy vs pinned package).
  Experiment enabled: staging an Exoma release candidate (Exoma RELEASE.md step 6b) by moving
  the pin and re-running the harnesses and the delegated run against it.
  Expected measurement: per candidate, which harnesses import and which staging checks pass,
  against the exact commit `uv.lock` records.
  Why existing mechanisms are insufficient: the in-tree copy had no link to a released
  version after the fork; `version_under_test` could name a version no package carries.
  Complexity introduced: harnesses import Exoma internals, not a public API, so an Exoma
  refactor can break them; `tests/checks/harnesses.py` names a broken one when the pin moves.

alternatives:
  - option: Vendor Exoma as a git submodule and import from its source tree
    rejected_because: Staging would no longer exercise the installed package, which is what Exoma's staging step is meant to test.
  - option: Keep the root runtime frozen under `legacy/`
    rejected_because: The maintainer chose deletion; git history keeps the code, and a frozen copy invites imports from it.
  - option: Keep both runtimes active
    rejected_because: Exoma's development guide states this repository does not carry its own copy of the runtime.

evidence: []
evidence_notes: |
  Divergence audit of `core/`, `adapters/`, `config/`, `utils/`, `installer/` against
  `exoma/src/exoma` at the pinned commit (delegated explore, 2026-10-25): no module without a
  counterpart. Exoma `docs/development.md` ("Two repositories, two jobs", "Staging a release
  in agent-workflow"). After the change: `uv run python tests/run.py` passed its four suites
  and `check_research.py` reported no error, against Exoma b0d4fc2.

implementation:
  version: exoma b0d4fc2
  commits: [71cf7b7]
  components:
    - pyproject.toml, uv.lock (new; Exoma git pin, PyYAML dev group)
    - core/, adapters/, config/, utils/, installer/, main.py, install.py, check.py, dist/ (removed)
    - tests/ (runtime checks removed; harnesses.py added; replay.py imports exoma)
    - tools/maintain/ (stamp, manifest, extract, sync tools removed; harness imports moved to exoma)
    - tools/e2e/ (product checks removed; the delegated run calls python -m exoma)
    - .github/workflows/ci.yml, e2e-full.yml (uv sync --locked; research and staging checks only)
    - README.md, RELEASE.md (staging procedure), CHANGELOG.md (closed at 3.9.0), CLAUDE.md, docs/README.md

disposition:
  implementation_status: implemented
  validation_status: validated
  validated_by: maintainer
  validated_on: 2026-11-01

validation:
  summary: |
    observed. The suites pass against the pin. When this decision was recorded no candidate had
    been staged and the delegated run had not been run since the move.
    Result added 2026-10-27: the Exoma 0.2.0 and 0.3.0 candidates were staged here against the
    pin, each with the delegated run passing 7 of 7 on Windows and on macOS (DEC-078, DEC-081).
    Delegated calls in real use from 2026-10-25, the day of the move (some may precede it that
    day): 7 (`usage.jsonl`, 2026-10-25 and 2026-10-27), all ok. Across the maintainer's
    projects, Exoma's per-user job metadata holds 156 completed jobs from 2026-10-25 to
    2026-10-27 (analyze 34, plan 42, verify 63, explore 13, verify-browser 4), none with a
    recovery attempt. Source: this repository's `.workflow/data/` telemetry and Exoma's job
    metadata on the maintainer's machine (re-countable there only), window 2026-10-18 to
    2026-10-27, counted 2026-10-27.
    Result added 2026-11-01: five pin moves since the split (66b8f54, 2c9d3ae, a2b4a71, 74affed,
    881ef2b, re-countable with `git log -- pyproject.toml`), each with the suites passing. At
    a2b4a71 Exoma moved its bundle to `hosts/<name>/` and the task-outcome harness was changed
    to read the intent map there. The harness reads that file at import
    (`measure_task_outcomes.py`), and the harness check present since the split asserts it
    exists, so the suite fails by name on that move; how it was noticed at the time was not
    recorded and the maintainer does not recall. It is counted as the import check working as
    designed, not as a use pointing the other way.
  runs:
    - date: 2026-11-01
      job_id: "staging exoma 2888b15"
      description: "Pin moved 3f9f2b7 -> 2888b15 (1.0.0, breaking release) on Windows: `uv lock`, `uv sync --locked`, `tests/run.py --keep-going` four suites pass, `check_research.py --git` OK, `tools/e2e/e2e.py --full --provider codex --model gpt-5.6-luna` 7 of 7; no change in this repository was needed and none was made (DEC-082)."
      clean: true
  uses: 5
  consistent: true
  maintainer_decision: |
    2026-11-01, critical interview: kept. The maintainer reports that since the move no fix was
    made inside this repository to make a candidate pass; runtime fixes went to Exoma.
  measurements:
    - source: "git log -- pyproject.toml in this repository, 2026-10-25..2026-11-01"
      value: "5 pin moves after the split; delegated run 7 of 7 recorded for 0.2.0, 0.3.0, 5df83fa and 2888b15"

trade_offs:
  better:
    - one runtime; every measurement names the Exoma commit it ran against
    - a runtime fix has one place to land
  worse:
    - harnesses depend on Exoma internals and can break on an Exoma refactor
    - the product checks (local, integrity, installer, promote) run only in Exoma's CI
limitations:
  - The harness import check proves imports, not that a measurement computes the same figures after a pin move.
  - tools/sim/sim_flows.py was outside the change's scope and still imported the removed runtime; d0a31e5 moved it onto exoma.
revisit_when:
  - an Exoma refactor breaks a harness the import check did not catch
  - Exoma publishes a public API for the internals the harnesses read
questions: [RQ-15]
