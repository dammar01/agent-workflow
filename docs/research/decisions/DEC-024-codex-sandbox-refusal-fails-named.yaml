schema_version: 3
id: DEC-024
title: A codex Windows sandbox refusal fails as `sandbox_unavailable` with ordered fix steps; the runtime never lowers the sandbox
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: CASE-015, upstream codex issues, maintainer critical interview 2026-10-04
problem: |
  codex on Windows can refuse to start a session at its own OS sandbox (CASE-015: a resumed
  verify failed with "elevated Windows sandbox requires effective `:root` read access" while a
  new thread worked). The runtime classified it `unknown` with "inspect the logs and rerun",
  recorded no codex version, and flagged `thread_changed` for a call that never named a thread.
decision: |
  The codex adapter matches the sandbox's own failure text before the permission signs and
  returns `error_type: sandbox_unavailable`. Its next action lists, in order: start a new main
  session (a new codex thread) and rerun; if new threads fail too, update codex and approve its
  sandbox setup interactively; meanwhile switch the second agent with /.provider. The runtime
  does not fall back to a weaker sandbox. `codex --version` is read once per process and
  recorded in the call meta, the usage row (`provider_version`) and doctor. `thread_changed`
  (codex, agy) needs a thread id from the call before it can be true.
rationale: |
  Asked how the runtime should behave on this failure, the maintainer chose a clear failure
  with fix steps over an opt-in weaker sandbox or an automatic fallback. The read-deny profile
  the workflow sends needs the elevated backend; lowering it silently would trade the boundary
  for availability without the user deciding. The upstream reports (openai/codex#46312 for a
  resumed thread, #46114 for every thread) say the failure tracks codex releases, so the
  version has to be in the trail.
alternatives:
  - option: Retry automatically on a new thread when a resumed one is refused
    rejected_because: The thread's work would be lost silently; the maintainer chose to fail clearly.
  - option: Fall back to the unelevated sandbox
    rejected_because: It cannot enforce the read-deny profile, and choosing a weaker sandbox is the user's decision.
evidence: [CASE-015]
evidence_notes: |
  `tests/checks/provider.py` (`_assert_codex_provider`): a resumed codex call whose stderr
  carries the sandbox failure returns `sandbox_unavailable`, a next action naming /clear and
  /.provider, and the version in both the result meta and last_call_meta. The maintainer's
  machine reports `codex-cli 0.160.0`.
implementation:
  version: 3.8.0
  commits: [73518464e120ec4abbab720021ba358423f3e497]
  components:
    - adapters/providers/codex_adapter.py (_SANDBOX_SIGNS, codex_version, thread_changed)
    - adapters/providers/agy_adapter.py (thread_changed)
    - core/evidence/contract.py (sandbox_unavailable)
    - core/evidence/contracts.py (provider_version)
    - core/audit/diagnostics.py (doctor provider_version)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The provider-seam suite passes on a simulated refusal. A real refusal has not been
    observed since the change.
trade_offs:
  better:
    - The failure names itself and its remedy; a bug report can quote the codex release.
  worse:
    - One `codex --version` process per runtime process.
    - A resumed thread that fails is not retried; the user starts a new session.
limitations:
  - The match is on codex's error text; a reworded message falls back to `unknown`.
  - The fix steps follow upstream reports, not a fix verified on this machine.
revisit_when:
  - codex fixes resume under its elevated sandbox, or rewords the error.
  - The maintainer wants an opt-in weaker sandbox after all.
questions: [RQ-07a]
