schema_version: 3
id: DEC-039
title: The pre-flight gate lets a skill definition under ~/.claude/skills be read while a delegation is pending
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: A false refusal in a real maintainer session; the first one the maintainer reported
problem: |
  Invoking a workflow skill hands the agent an instruction to read `~/.claude/skills/<name>.md`,
  while the prompt that invoked it has already armed the gate. `intent-gate-check` blocked
  that Read like any gather, so the instruction saying how to dispatch was unreadable until
  after the dispatch. The agent dispatched from memory of the global instructions; a skill
  with a pre-dispatch step of its own would have been skipped.
decision: |
  Under any pending marker a Read passes when its path is absolute, has no `..` segment, ends
  in `.md`, names an existing file, and its real path (every symlink or junction followed) lies
  inside the real path of `~/.claude/skills`. A link may point anywhere inside that folder, not
  out of it. Grep and Glob over the folder, other extensions, and relative paths stay blocked.
  Both hook flavours carry the same rule.
rationale: |
  A skill is the instruction for the run, not evidence about the codebase. Resolving the real
  path keeps a skills folder kept in a dotfiles repository working while refusing a link that
  leads out to a project file.
alternatives:
  - option: Refuse every symlink under the skills folder
    rejected_because: A skills folder linked from a dotfiles or agent repository would stop working.
  - option: Allow any Read under ~/.claude
    rejected_because: Settings, memory and transcripts there are not instructions for the run.
evidence: [DEC-032, DEC-030]
evidence_notes: |
  `tests/checks/intent_gate.py` (`gate-prompt-field`, `_check_skill_read_lane`), both flavours:
  a skill and a nested skill pass under plan, analyze and verify; `.txt`, a missing `.md`, a
  `.md` beside the folder, `..`, a relative path, a project file and a Grep stay blocked; a
  link out of the folder is blocked and a link inside it passes (exercised where the machine
  may create symlinks).
implementation:
  version: 3.8.1
  commits: [56c2a64766e3966d21c139458a24cab7c69b84ab]
  components:
    - dist/config/claude/hooks/intent-gate-check.ps1 (Get-RealPath, Test-SkillRead)
    - dist/config/claude/hooks/intent-gate-check.sh (skill_read)
    - dist/config/claude/CLAUDE.md, docs/reference.md, docs/runtime-contracts.md
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The gate suites pass on Windows PowerShell 5.1 and through the .sh flavour's embedded
    python; the bash wrapper on macOS or Linux was not run.
trade_offs:
  better:
    - The skill that defines a delegated command can be followed before its dispatch.
  worse:
    - A file placed in the skills folder can be read before a dispatch, whatever it holds.
limitations:
  - The .ps1 flavour follows links by hand on 5.1; a link it cannot read is refused rather than followed.
revisit_when:
  - A skill needs a file other than a .md, or a refusal is reported for a Read inside the skills folder.
revises: [DEC-032]
questions: [RQ-10]
