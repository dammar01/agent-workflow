schema_version: 3
id: DEC-032
title: The pre-flight gate parses runner calls, covers the PowerShell tool, and refuses writes to the runner scripts
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Local branch review of dev against main before release; each bypass reproduced against the hook sources
problem: |
  A review of the gate hooks found three ways past `intent-gate-check` while a delegated
  marker was active. The PreToolUse matcher named `Bash` but not Claude Code's `PowerShell`
  tool, so on Windows `Get-Content` or `Select-String` ran ungated. The runner allowlist was a
  regex that accepted any directory before `.workflow/run.sh` and any interpreter flag, so a
  script written elsewhere under a `.workflow/` folder, or `powershell -c .workflow/run.ps1
  (Get-Content X)` (PowerShell evaluates the parenthesised argument), passed. Write was not
  gated at all, so the runner script itself could be overwritten and then run. Separately,
  the ps1 hooks read the UTF-8 session registry as ANSI, so a non-ASCII project root wrote the
  marker under a garbled path that `.workflow/run` never cleared.
decision: |
  The gate matcher adds `PowerShell`, `Write`, `Edit`, `MultiEdit` and `NotebookEdit`. A Bash
  call is split into words as a POSIX shell would, after the existing metacharacter refusal; it
  passes only as the runner itself, `powershell`/`pwsh` with `-NoProfile`, `-NonInteractive`,
  `-ExecutionPolicy Bypass` and then `-File <runner>`, or `bash`/`sh` with no flag. A
  PowerShell tool command is parsed with the PowerShell parser (the `.sh` flavour uses a
  stricter tokeniser): one statement, one pipeline element, no redirection, `&` or no call
  operator, every argument a constant string. In both, the runner path must resolve to exactly
  `<root>/.workflow/{run,check,inspect}.{ps1,sh}`. While armed, a write to one of those files
  is refused; other writes pass. The ps1 hooks read the registry, marker and intent map as
  UTF-8.
rationale: |
  Two of the three bypasses came from matching text rather than structure, so another regex
  would trail the next quoting trick. A parser turns the rule into a shape: one plain call with
  constant arguments to one known file. The gate is meant to hold the main agent to the
  division of labour, and a model that drifts reaches for the tool the platform offers, which
  on Windows is PowerShell.
alternatives:
  - option: Tighten the existing regexes and add PowerShell to the matcher
    rejected_because: Still a blacklist; every new quoting form needs a new pattern and both flavours must track it.
  - option: Block every Write while armed
    rejected_because: verify-browser drafts its request with Write before dispatch, and the verify lane writes tests.json.
evidence: [DEC-029, DEC-030]
evidence_notes: |
  `tests/checks/intent_gate.py`: `gate-runner-parsed` runs one case matrix through both hook
  flavours (`.ps1` under Windows PowerShell 5.1, the `.sh` flavour through its embedded Python)
  and expects the same verdict; `gate-runner-tamper` and `gate-non-ascii-root` cover the write
  block and a `proyék` root. All three failed against the previous hooks. Parser behaviour was
  checked by hand on PS 5.1.26100 against `(...)`, `"$(...)"`, `"$env:X"`, `;`, `@{}`, pipe and
  redirect forms.
implementation:
  version: 3.8.0
  commits: [3e50003bc40641ecef093045507a01087a0a887c]
  components:
    - dist/config/claude/settings.template.json (gate matcher)
    - dist/config/claude/hooks/intent-gate-check.ps1, intent-gate-check.sh (parsed runner, PowerShell lane, write block, UTF-8)
    - dist/config/claude/hooks/intent-gate-set.ps1 (UTF-8 reads)
    - dist/config/claude/CLAUDE.md, core/prompt/prompt_builder.py (gate description)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The suites above pass on Windows. pwsh 7 was not available to run; the parser API is the
    same since PowerShell 3, which is an assumption until a run on pwsh. The bash wrapper of
    the `.sh` flavour was not exercised on Windows.
trade_offs:
  better:
    - The known bypasses are refused by shape, not by a list of characters.
    - A non-ASCII project root no longer locks the gate for the turn.
  worse:
    - A relative runner call from a shell that changed directory is refused; the agent must call it from the root or by absolute path.
    - Existing installs keep the old matcher until the installer runs again.
limitations:
  - Files the runner reads (`.workflow/config.json`, `second_agent.json`) are still writable while armed.
  - On Windows the write block does not resolve symlinks; the `.sh` flavour uses realpath.
revisit_when:
  - A main agent reaches code through a tool the matcher does not name.
  - A legitimate runner call is refused in real use.
revises: [DEC-029]
questions: [RQ-10]
