# DEC — copy to DEC-NNN-<kebab-slug>.yaml. Schema: ../schema.yaml. Rules: ../CONTRACT.md §14–§16.
# Tracked here only once implemented (implementation_status implemented/partially_implemented).
schema_version: 1
id: DEC-NNN
title: <one line>
date: YYYY-MM-DD
status: proposed            # proposed | accepted | superseded | deprecated
provenance:
  type: observed            # direct | adapted | synthesized | observed | unknown
  confidence: medium        # low | medium | high
  basis: <optional one line — where the decision came from>

problem: |
  What problem required a design or behavioral decision?
decision: |
  What was decided?
rationale: |
  Why this approach?

alternatives:               # at least one
  - option: <one line>
    rejected_because: <why>

evidence: []                # record IDs — CASE-NNN, EXP-NNN, SYN-NNN, LIT-NNN, H-NNN, DEC-NNN
evidence_notes: |           # optional — code, tests, sanitized runs that are not records
  ...

implementation:
  version: <TOOL_VERSION>
  commits: [uncommitted]    # commit hash; `uncommitted` only until the commit exists (--strict refuses it)
  components:
    - path/to/file.py (what changed)

disposition:
  implementation_status: implemented   # not_implemented | partially_implemented | implemented | not_applicable
  validation_status: not_validated     # not_validated | observed | partially_validated | validated | rejected
  # validated_by / validated_on — maintainer only; required beyond not_validated/observed

validation:
  summary: |
    What evidence supports it today. `validated` needs a run below with clean — true.
  runs: []                  # - {date: YYYY-MM-DD, job_id: <id>, description: <sanitized>, clean: true}

trade_offs:
  better: [<what became better>]
  worse: [<what became worse>]
limitations:
  - <when this decision could be wrong>
revisit_when:
  - <evidence that should reopen it>
# supersedes: [DEC-NNN]    revises: [DEC-NNN]    (optional)
