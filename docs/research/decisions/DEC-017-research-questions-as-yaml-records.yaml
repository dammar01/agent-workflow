schema_version: 2
id: DEC-017
title: Research questions become YAML records, linked to records both ways
date: 2026-09-29
status: accepted
provenance:
  type: direct
  confidence: high
  basis: "maintainer rule: every research record must have a question or evidence leading to a feature change"
revises: [DEC-011]

problem: |
  CONTRACT.md required every research question in `questions.md` to link at least one
  record, and the maintainer requires every new record to trace to a question or evidence
  that leads to a change in this project. Nothing enforced either: `check_research.py`
  validated records and the README inventory, but never read `questions.md`, a Markdown table
  whose Records column was free text and mostly named git-ignored drafts. Records named their
  question only in prose (`evidence_notes`), if at all. The ID grammar (`PREFIX-NNN`) could
  not even express `RQ-07a`.

decision: |
  - A record type `RQ` in `schema.yaml`, stored as `docs/research/questions/RQ-NN-<slug>.yaml`
    (`RQ-NNa` for a sub-question) with fields: schema_version, id, question, date, status
    (proposed | partial | answered), what_exists, records, notes (optional). A question is
    tracked as soon as it is asked (`tracked_when: {}`).
  - `schema_version` becomes 2. A version-2 DEC, H, EXP, CASE or SYN carries a required
    `questions: [RQ-NN]` field. Records tracked at version 1 are frozen (CONTRACT.md §15),
    stay valid without it, and are linked from the RQ side only. RQ records and drafts are
    always version 2.
  - An RQ's `records` name tracked records only; drafts serving it are named in `notes` as
    plain text, so a clean clone without drafts validates the same way.
  - The validator checks both directions: a version-2 record an RQ lists names that RQ, and
    a tracked version-2 record's RQ lists it. An `answered` RQ lists at least one record;
    `proposed` and `partial` may list none yet. IDs are unique across tracked and drafts.
  - `questions.md` RQ-01..RQ-12 were converted one to one, narratives kept in `notes`;
    `questions.md` is now an index generated by `--write-inventory`, and RQ records stay out of
    the README inventory. RQ-13..RQ-15 were added.

rationale: |
  Traceability written only in prose drifts; a field the validator checks does not. Linking
  both ways lets a question list its evidence and lets a record show which question it
  serves. Keeping RQ records to tracked references avoids a release gate that depends on a
  git-ignored directory. Exempting frozen records avoids rewriting them.

alternatives:
  - option: Keep questions.md and parse its table
    rejected_because: The table format becomes a fragile contract; free-text cells cannot carry typed IDs reliably.
  - option: No enforcement; name the RQ in evidence_notes
    rejected_because: Rejected by the maintainer — it is what existed and it was not checked.
  - option: Let tracked RQs list draft IDs
    rejected_because: Rejected by the maintainer — drafts are absent from a clean clone, where `--strict` turns the unresolved reference into a release error.
  - option: Every RQ lists at least one record, whatever its status
    rejected_because: No RQ-01..RQ-12 had a tracked record; the rule would have refused the conversion. Only an answered question must show its records.

evidence: [DEC-011]
evidence_notes: |
  Research question: RQ-15.
  Code at the time: tools/maintain/check_research.py (read records and the README only;
  `_ID` required three digits), docs/research/CONTRACT.md §14 (every RQ links a record),
  docs/research/questions.md (Markdown table).

implementation:
  version: 3.8.0
  commits: [7150b0dd3f565c3139fb0fb74bb1eb23548b5592]
  components:
    - docs/research/schema.yaml (schema_version 2, RQ type, rq_status, questions field)
    - tools/maintain/check_research.py (ID grammar, version dispatch, _check_question_links, duplicate IDs, questions index)
    - docs/research/questions/_TEMPLATE.yaml, RQ-01..RQ-15
    - docs/research/questions.md (generated index)
    - docs/research/CONTRACT.md (§14-16), docs/research/README.md, RELEASE.md, docs/reference.md
    - tests/checks/research.py (_check_research_questions)

disposition:
  implementation_status: implemented
  validation_status: observed

validation:
  summary: |
    2026-09-29: the offline suite passes (`tests/run.py`, full scenario), including fixtures
    that show each new rule refusing a broken record: version-2 record without questions, RQ
    at version 1, bad RQ file names (RQ-7, RQ-900, DEC-90), one-way links in both directions,
    an RQ listing a draft, an answered RQ without records, a stale questions index, a draft
    duplicating a tracked ID, a version-1 draft, and an archived draft not being read.
    `check_research.py --strict --git` passes on the tracked corpus (28 records) and with the
    drafts directory absent (a simulated clean clone). A delegated verify
    (job_20260929_121802_053901) found no blocking finding.

    Observed, not validated: no CI run on the pushed commit is recorded here yet, and no new
    record has been written through the RQ flow by someone other than the maintainer.
  runs: []

trade_offs:
  better:
    - Every new record traces to a question, checked in the test suite and CI.
    - questions.md can no longer drift from the records.
  worse:
    - One more record type and a schema bump; version-1 and version-2 records coexist.
    - The validator carries two ID grammars and a per-version dispatch.
limitations:
  - Frozen version-1 records stay linked from one side only.
  - A new tracked record written at version 1 still passes without `questions`; the validator cannot tell it from a frozen one. The templates are version 2.
  - Converted RQ-01..RQ-12 carry the conversion date, not the date each question was first recorded.
revisit_when:
  - Most research questions end up with a single record, making the RQ layer overhead.
  - A new record lands at version 1 to avoid naming a question.
questions: [RQ-15]
