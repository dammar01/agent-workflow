schema_version: 3
id: DEC-033
title: A runtime test gap exits nonzero, a no-test request is not a check, and runtime tests keep the job alive
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Local branch review of DEC-025 and DEC-029 before release; each defect reproduced
problem: |
  The review found that DEC-025's runtime tests could still bend the verdict or lose the run.
  A request with `commands: []` added `runtime: no test requested` to `checks_run`, and the
  validator counted it, so a review with no checks of its own went from `incomplete` to `pass`
  with nothing run. The exit-0 relaxation meant for gaps the agent declared also covered gaps
  the runtime wrote (no request, refused commands), so the CLI exited 0 on `incomplete` when
  the main agent forgot tests. A command containing NUL passed every filter and raised
  `ValueError` at spawn, which escaped after the paid review. The worker beat its heartbeat
  only while the provider ran, so minutes of tests read as a stalled job that the runner could
  probe and reap. And a runner that exited 0 but left a server holding its stdout waited the
  full timeout and was reported as one.
decision: |
  The no-test line stays visible but is not counted as a check. `not_verified` lines the
  runtime writes carry the `tests:` prefix and raise `runtime_gap`, which exits 2; only
  `verification_gap` keeps the exit-0 relaxation. Commands with control characters are refused
  before spawn, spawn errors are `error` outcomes, and any other exception in the step returns
  the review with a `tests: runtime tests crashed` gap. Runtime tests beat the job heartbeat
  before each command and every 20 s. `run_bounded` ends when the direct child exits, drains
  the pipes for at most `drain_seconds`, then kills what still holds them (process group on
  POSIX, a job object on Windows) and returns the real exit code.
rationale: |
  DEC-025 made the verdict the machine's evidence; a pass that no check supports, or an exit
  0 that hides that the requested tests never ran, is the failure that decision exists to
  prevent. The rest keeps a verify the user paid for from being lost to the runtime's own
  bookkeeping.
alternatives:
  - option: Treat a no-test request as a `not_verified` gap
    rejected_because: The maintainer chose to let the review's own checks decide; a change with nothing to test should not be forced to `incomplete`.
evidence: [DEC-025, DEC-029]
evidence_notes: |
  `tests/checks/verify_tests.py` (`verify-runtime-tests`): `commands: []` with `checks_run:
  - none` is `incomplete`; runtime gaps exit 2 and declared gaps exit 0; NUL is refused, a
  spawn `ValueError` and an `apply` exception keep the review; beats arrive during a 1.2 s
  command; a child leaving a 60 s grandchild on stdout returns code 0 in seconds and the
  grandchild is gone. Each failed against the previous code.
implementation:
  version: 3.8.0
  commits: [77a6f86d3814df22c6faa54795b4fc550d5c21aa]
  components:
    - core/evidence/contract.py (no-test item, runtime_gap, exit status)
    - core/evidence/verify_tests.py (control characters, spawn errors, heartbeat, crash gap)
    - core/provider/executor.py (_apply_runtime_tests)
    - utils/osutil.py (run_bounded ends on exit; Windows job object)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The suites above pass on Windows. No delegated verify with runtime tests has run in real
    use since this change.
trade_offs:
  better:
    - A verify with nothing checked cannot report pass, and a forgotten test request is visible in the exit code.
    - Long suites no longer race the stall reaper.
  worse:
    - Scripts that relied on exit 0 for a verify without tests.json now see exit 2.
    - An agent gap written with a `tests:` prefix is read as a runtime gap.
limitations:
  - Test beats carry no idle measure, so a hung test reads as alive until its own timeout.
  - A grandchild that leaves the Windows job, or starts before the child is assigned to it, survives.
revisit_when:
  - Real verifies are classified `runtime_gap` for reasons the main agent cannot act on.
revises: [DEC-025, DEC-029]
questions: [RQ-11, RQ-13]
