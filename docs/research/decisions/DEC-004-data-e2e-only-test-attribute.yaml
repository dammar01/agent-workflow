schema_version: 1
id: DEC-004
title: "`data-e2e` is the only test attribute"
date: 2026-09-27
status: accepted
provenance:
  type: observed
  confidence: high
  basis: "maintainer report: drafts suggested data-testid while tags said data-e2e"

problem: |
  Two test attributes coexisted. Tagging proposed `data-e2e` (`tagging.TAG_ATTRIBUTE`), but
  the stage-1 prompt ranked `data-testid` among selectors and its JSON example used
  `{"testid": ...}`; the selector schema, the page probe and the player's locator all read
  `data-testid`. Drafts therefore recommended `data-testid`, contrary to the project's rule,
  and a tag the runtime proposed was not the attribute its own selectors looked for.

decision: |
  One attribute, `data-e2e`, reached through the selector key `e2e`
  (`[data-e2e="<value>"]`, `spec.e2e_css`). `testid` is removed from `SELECTOR_KEYS` and
  `SELECTOR_RANK`; `testid`, `data-testid` and `data-e2e` as selector keys are refused with an
  error naming `e2e` (`spec.RETIRED_SELECTOR_KEYS`). The prompt, the probe, the player and the
  knowledge store follow; knowledge entries recorded with `testid` are no longer offered.

rationale: |
  What tagging writes and what selectors read must be the same thing, or a proposed tag never
  becomes a usable selector. A retired key refused with its replacement is repairable by the
  stage-1 repair continuation, so the breaking change costs a draft one repair rather than a
  dead draft.

alternatives:
  - option: Keep `testid` as a fallback key
    rejected_because: Rejected by the maintainer — it keeps the second attribute alive, and drafts would keep reaching for it.
  - option: Configure Playwright's test-id attribute to `data-e2e`
    rejected_because: It would keep the key name `testid` meaning a different attribute than its name says.

evidence: []
evidence_notes: |
  Code at the time: `core/prompt/prompt_builder.py` (selector ranking and example),
  `core/evidence/e2e/spec.py` (`SELECTOR_KEYS`), `core/evidence/e2e/browser.py`
  (probe and `get_by_test_id`), against `core/evidence/e2e/tagging.py` (`data-e2e`).

implementation:
  version: 3.7.3
  commits: [dd70afda3e1a70f85c90d7cdbaa52ae3feb80bb2]
  components:
    - core/evidence/e2e/spec.py (E2E_ATTRIBUTE, e2e_css, RETIRED_SELECTOR_KEYS)
    - core/evidence/e2e/browser.py (probe, locator)
    - core/evidence/e2e/normalize.py
    - core/evidence/e2e/knowledge.py (retired entries not offered)
    - core/prompt/prompt_builder.py
    - tests/checks/{e2e_spec,e2e_browser,e2e_tagging,e2e_routing}.py, tests/fixtures/e2e_app/

disposition:
  implementation_status: implemented
  validation_status: observed
  validated_by: maintainer
  validated_on: 2026-09-28

validation:
  summary: |
    The offline suites pass with the fake browser; no real Chromium run (`e2e-smoke`) or real
    application has exercised the `e2e` locator yet.

    2026-09-28, real use on the maintainer's private web project: every draft proposed the `e2e` selector key (never `testid`) and
    the validator accepted it.

    2026-09-28, maintainer statement and a count in this environment: across the maintainer's
    projects the requests have asked for `data-e2e`, never `data-testid`; in the two private
    projects that use browser verification, 146 and 10 source files carry `data-e2e` and none
    carry `data-testid` (grep over *.tsx/*.jsx/*.vue/*.blade.php/*.html, excluding
    node_modules and vendor). Observed, not validated: the decided behavior includes the
    player's `e2e` locator, and no kept run report shows it driving an element — candidates run
    strongest first (role > label > e2e), so the runs so far matched `label`. It becomes
    validated on a clean run where a draft reaches the `e2e` candidate naturally (an element
    with no role or label) and the run passes.
  runs:
    - date: 2026-09-28
      job_id: "job_20260928_034916_758883"
      description: "Draft proposed an `e2e` candidate for the login email field (no `testid` anywhere); accepted by the validator. The run matched candidate 0 (`label`), so the `e2e` locator was not exercised."
      clean: false

trade_offs:
  better:
    - One attribute everywhere; drafts, tags and selectors agree.
  worse:
    - Breaking for a project whose markup carries only `data-testid` — its drafts must fall back to role, label or text until the proposed `data-e2e` tags are applied.

limitations:
  - Applications that cannot add attributes (third-party widgets) have no test attribute at all and rely on role, label, text or css.

revisit_when:
  - Real runs show drafts falling back to weak `css`/`text` selectors because `data-e2e` is absent and cannot be added; then reconsider reading an existing `data-testid` read-only.
