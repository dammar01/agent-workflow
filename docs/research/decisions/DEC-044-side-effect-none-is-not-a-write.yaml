schema_version: 3
id: DEC-044
title: Browser knowledge reads side_effect "none" as no write, so explicit drafts record selectors
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: A real browser run on the maintainer's private web project that passed cleanly and recorded no selector; traced to the knowledge observer
problem: |
  `knowledge.observations` treated a step as a write when `side_effect` was truthy. The spec
  names no write `"none"` (`spec.SIDE_EFFECTS`), and the spec validator already reads it that
  way, but the observer took the string as truthy. A draft that spelled `side_effect: "none"`
  on every step, as current drafts do, made every step a write: no selector was observed, no
  `proven` entry or `proven_scope` was stored, and a passing run only refreshed the login,
  navigation and readiness entries. Selector knowledge (DEC-016, DEC-031, DEC-035, DEC-040)
  could not grow from such drafts, silently. The suite never used `"none"`.
decision: |
  The observer counts a step as a write only when `side_effect` is a value other than `"none"`
  or when the step names a `request`, the same reading as the spec validator.
rationale: |
  One meaning per field: the validator and the observer must agree on what a write is, or the
  knowledge store records a different run from the one that was checked.
alternatives:
  - option: Have the draft omit side_effect on read-only steps
    rejected_because: The spec accepts "none" and drafts write it; the observer has to read the spec's own value.
evidence: [DEC-016, DEC-035, DEC-040]
evidence_notes: |
  Real use, 2026-10-04: a login-then-home run on the maintainer's private web project passed 6
  of 6 steps on its single attempt; the knowledge summary was `confirmed: 3, added: 0` and no
  selector entry was touched. `tests/checks/e2e_knowledge.py`
  (`_check_side_effect_none_is_not_a_write`): a passed click with no side_effect and with
  `"none"` is a selector observation, with `creates_test_data` it is not; the `"none"` case
  fails against the previous observer (`got ['navigation']`).
implementation:
  version: 3.8.1
  commits: [e9c63d71490e74d0636a584ebd05a1898fbde66c]
  components:
    - core/evidence/e2e/knowledge.py (what observations count as a write)
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    The knowledge suite passes, and fails on the previous code. No real run has recorded a
    selector since the change.

    2026-10-04, real use on the maintainer's private web project after the fix: the same
    login-then-home scenario passed 6 of 6 on one attempt and recorded its four selectors with
    `proven_scope` (`added: 3, confirmed: 4`); a new draft was offered those four as proven, and
    its run passed again and confirmed them (`confirmed: 7`, each selector's pass count up by
    one). Before the fix the same scenario recorded none. No run is marked clean: the runtime
    verdict was `incomplete`, because the review listed the scope the task excluded under
    not_verified, and the maintainer has not confirmed the runs. Observed, not validated.
  runs:
    - date: 2026-10-04
      job_id: "job_20261004_170324_538395"
      description: "Browser pass; four selectors recorded with proven_scope."
      clean: false
    - date: 2026-10-04
      job_id: "job_20261004_170458_073847"
      description: "New draft offered the four as proven; browser pass confirmed them."
      clean: false
trade_offs:
  better:
    - Drafts that declare no write explicitly feed selector knowledge again.
  worse:
    - Selector entries recorded from now on may sit beside older entries for the same element under a moved source path until those age out.
limitations:
  - A step that writes through a request the draft did not declare is still read as no write; the request ledger, not the observer, reports it.
revisit_when:
  - A passing run again records no selector for steps that matched.
revises: [DEC-035]
questions: [RQ-06, RQ-14]
