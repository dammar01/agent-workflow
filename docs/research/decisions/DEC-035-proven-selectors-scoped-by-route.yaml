schema_version: 3
id: DEC-035
title: Proven selectors are scoped by route and within, weakened once per run, and recorded only from runs that passed
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Local branch review of DEC-016 and DEC-031 before release; confirmed by reading and by tests that failed on the previous code
problem: |
  The proven-selector accounting retired good selectors early and blamed the app falsely. The
  set that stops an entry being weakened twice was rebuilt for each step, so two steps of one
  run that missed the same proven selector retired it in a single run. A step that failed after
  its selector matched (a click timeout) still weakened its own entry through the older
  per-key path. A run whose only attempt failed still recorded its passing steps as proven,
  against the documented "a run that passed". And proven selectors were offered for the whole
  origin, without the route or `within` they were proven under, so a selector cited on another
  page that was missing there was classified as an app failure and demoted the valid entry.
  The network ledger also kept token-shaped path segments (`;jsessionid=`, short or
  letters-only tokens) now that every GET is recorded.
decision: |
  One weakened set per ingest, covering both the proven-miss and the per-key path. A failed
  step whose selector matched is not a miss. Passes are recorded only when exactly one attempt
  ran and its browser verdict is pass. A clean pass stores `proven_scope: {route, within}`;
  `proven_selectors` returns `{selector, route, within}`, validation accepts `proven` only on a
  step with the same route and `within`, and demotion touches only entries with the same
  origin, route, `within` and matched selector. Rows written before this are hints until
  re-proven. `sanitize_endpoint` drops `;` path parameters and folds more token shapes to `:id`.
rationale: |
  DEC-016 counts misses across runs; per-step counting made one unlucky run decide. Scope by
  route was rejected in DEC-031 as unnecessary; the false `ORIGIN_APP` verdicts it allows show
  that a selector is only evidence where it was observed.
alternatives:
  - option: Keep origin-wide proven selectors and stop treating proven as grounded in classification
    rejected_because: It hides the false app verdict but keeps leading drafts with selectors from other pages.
evidence: [DEC-016, DEC-031, DEC-014]
evidence_notes: |
  `tests/checks/e2e_knowledge.py` (`e2e-knowledge`): one run weakens an entry once; a failure
  after the match is not a miss; a failed run proves nothing; proven is scoped by route and
  `within`, and old rows stay readable. The first two failed against the previous module.
  `tests/checks/e2e_hardening.py`: the reproduced token forms become `:id`, ordinary words stay.
implementation:
  version: 3.8.0
  commits: [0c387f967b30681a753aaaa0f0050d9190e7ebd8]
  components:
    - core/evidence/e2e/knowledge.py (per-run weakening, match-aware fail path, proven scope)
    - core/evidence/e2e/spec.py (proven checked against route and within)
    - core/evidence/e2e/runner.py (clean only on a passing single attempt)
    - core/evidence/e2e/redact.py (path parameters and token shapes)
    - core/prompt/prompt_builder.py, dist/config/claude/skills/verify-browser.md (proven scope in the draft rules)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The e2e suites pass with the fake player; the real-Chromium smoke was not run.
    Correction (2026-10-04): the generic real-Chromium smoke (`e2e-smoke`) was run for the
    3.8.0 release and passed, as its release note says. It drives the runner with a direct run
    request and does not ingest knowledge or look up proven selectors, so it is no evidence
    for this decision; a selector-knowledge run in a real browser is still missing.
trade_offs:
  better:
    - A good selector needs two missing runs to retire, and an app verdict needs a selector proven on that page.
  worse:
    - Existing proven selectors lose their rank until a clean run re-proves them on their route.
    - Knowledge builds more slowly on flaky apps, since failed runs record no passes.
limitations:
  - The token heuristic can fold a long lowercase route with digits (`annualreport2024q1`) to `:id`.
revisit_when:
  - Drafts stop gaining proven selectors on routes that pass repeatedly.
revises: [DEC-016, DEC-031]
questions: [RQ-06, RQ-14]
