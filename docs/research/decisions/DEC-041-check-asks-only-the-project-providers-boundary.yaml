schema_version: 3
id: DEC-041
title: install --check asks only for the project boundary of the provider the project runs
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Two e2e failures on a machine whose provider seed selects codex, reproduced by hand and traced to the check
problem: |
  `install --check` run inside a workspace required every provider's shipped project boundary,
  which in practice is opencode's `<project_root>/opencode.json`, whatever provider the project
  ran. init and upgrade install only the boundary of the project's own provider
  (`_install_project_boundary`), and codex has none it can enforce, so a codex project was
  reported `MISSING opencode/opencode.project.json` and DRIFTED, and neither `install --apply`
  nor `init` could clear it. The e2e installer checks hid this as a test fault: they ran init as
  a subprocess, the machine's `config/second_agent.seed.json` chose codex for the throwaway
  project, and the two project checks failed on that machine only (recorded as a known gap in the
  3.8.0 release notes).
decision: |
  The project boundary is checked only for the provider `selected_provider(project_root)`
  returns, the resolver the runtime uses. For any other provider `--check` prints `project
  scope: SKIPPED — the project runs <provider>, so the <bundle> boundary ... was not checked`
  instead of MISSING. A project that names no provider resolves to the default, so its boundary
  is still checked. The e2e installer checks write the project's `.workflow/second_agent.json`
  from the shipped example before init, which init never overwrites, so the machine seed no
  longer picks their provider; a codex workspace and an opencode workspace without its boundary
  are both checked through real subprocesses.
rationale: |
  `--check` exists to answer what an install would change. Requiring a file that no command
  installs is a drift report without a repair, and it teaches the user to ignore DRIFTED. Using
  the runtime's resolver keeps check, init and the executor agreeing on which provider a project
  runs.
alternatives:
  - option: Have init write opencode.json in every project
    rejected_because: It ships an unused file into codex projects and implies a boundary that does not apply to the provider that runs.
  - option: Fix only the e2e isolation
    rejected_because: Every codex user would still see a DRIFTED status no command could clear.
evidence: [DEC-037, DEC-030]
evidence_notes: |
  `tools/e2e/e2e.py`: before the change, 135 passed and 2 failed (`init installs the project
  opencode boundary`, `project-scoped install passes check`) with a codex machine seed; by hand,
  `install --check` in a codex project printed `MISSING opencode/opencode.project.json`. After:
  139 passed, 0 failed, including `check skips the opencode boundary in a codex project` and
  `check still requires the boundary in an opencode project`.
implementation:
  version: 3.8.1
  commits: [8dcc67219768dd37449701121d13075dc0622115]
  components:
    - installer/check.py (project boundary scoped to the selected provider)
    - tools/e2e/e2e_installer.py (project seeded from the example; codex and missing-boundary cases)
    - docs/reference.md (--check scope)
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    The e2e installer checks pass on Windows with a codex machine seed. No real codex workspace
    has been checked since the change.

    2026-10-04, real use on this repository, a codex workspace: `install.py --apply` then
    `--check` reported `project scope: SKIPPED — the project runs codex` and status READY,
    where the previous check would have reported the opencode boundary missing. Observed, not
    validated: one workspace, one provider switch direction.
trade_offs:
  better:
    - A codex workspace can reach a clean `--check`; DRIFTED again means something an install would fix.
    - The e2e result no longer depends on the machine's provider pick.
  worse:
    - A project switched from opencode to codex keeps a stale opencode.json that `--check` no longer looks at.
limitations:
  - A project whose second_agent.json is unreadable resolves to the default provider, so it is checked as opencode.
  - The e2e `install --apply` still rebuilds the repository's own seed, keeping the machine's selection.
revisit_when:
  - A provider other than opencode ships a project boundary file.
questions: [RQ-07a]
