schema_version: 1
id: DEC-008
title: An app repeat streak is keyed by failure signature, and a runtime change releases it
date: 2026-09-27
status: accepted
provenance:
  type: observed
  confidence: high
  basis: "maintainer runs: three different login failures braked as one streak"
revises: [DEC-005]

problem: |
  Revises part of DEC-005. DEC-005 is frozen and not edited. Its project-fingerprint release,
  its knowledge entry and its environment buckets still hold.

  The repeat brake keyed on origin plus a coarse bucket (`timeout`, `harness`, `app`). In
  maintainer use on a private project, three consecutive `/.verify-browser` login runs
  failed in `app`, each in a different way:
  1. A form field was missing because the page had not rendered its form yet.
  2. `expect_url` failed because the runtime itself held back the redirect (DEC-007).
  3. The same `expect_url` failure again.

  The fourth run was refused. It was the first run in which both the scenario and the runtime
  were right.

  Two gaps compounded:
  - A different app failure is a different thing to fix, but the bucket counted all three as one loop.
  - The fix for failures 2 and 3 was in the runtime. The project fingerprint cannot see the
    runtime, so the brake did not release.

decision: |
  - `classify.failure_signature(report, scenario)` signs an `app` failure as `v1:<digest>`
    over the page, the action, the field and the condition:
    - page: `url_after` through `sanitize_endpoint`, with query and fragment dropped and
      identifier segments folded to `:id`;
    - field: the step's selectors from the placeholder scenario;
    - condition: the error kind, the step's expectation, and the unmet readiness conditions.

    It excludes the step id and the free-text detail. A `fail` with no failed step is signed
    by the run's reason.
  - An `app` streak continues only when the signature matches. `timeout` and `harness` stay
    keyed on the bucket.
  - Every counted outcome records `runtime` (`TOOL_VERSION` plus a digest of
    `core/evidence/e2e/*.py`). A streak at the limit written by a different runtime is
    released: `repeat_released.by = runtime_changed`.
  - Migration: an `app` record without a signature is read as no streak. A record without
    `runtime` is not released by the runtime rule.
  - `repeat_failure` knowledge keeps one entry per distinct app signature.

rationale: |
  What the brake is for differs by bucket. An environment loop looks different on every run,
  so it has to be counted coarsely. An application failure is one precise thing, so it has
  to be counted precisely. The runtime is part of what a run depends on, so it needs its own
  release, like the project does.

alternatives:
  - option: Exact signature for every bucket
    rejected_because: |
      One environment problem answers to several reasons in turn, and the loop the brake exists
      for edits the scenario between runs. An exact key would reset on every edit and never
      brake that loop (`classify.py`, `state.note_e2e_outcome` docstring).
  - option: Reset when the failing step moves later in the scenario
    rejected_because: Simpler, but it does not tell fields or conditions apart, and a reordered scenario looks like progress.
  - option: Version only for runtime identity
    rejected_because: It misses fixes made during development without a version bump, which is exactly how the originating fix was made.

evidence: [DEC-005, DEC-007]
evidence_notes: |
  - Four maintainer runs on 2026-09-27 against one private project and one origin. The
    failure kinds and steps are in the problem. The job files are git-ignored and kept on
    the maintainer's machine only.
  - `tests/checks/e2e_hardening.py` `_check_failure_signature_names_page_field_and_condition`
    and the streak checks: three different signatures give streaks 1, 1, 2, and the
    environment buckets still reach the limit. An `app` record without a signature reads as
    no streak.
  - `tests/checks/e2e_routing.py`: a real app failure through the runner is recorded with its
    signature and runtime; a streak from another runtime is released with `runtime_changed`;
    a streak from this runtime still brakes.

implementation:
  version: 3.7.3
  commits: [dd70afda3e1a70f85c90d7cdbaa52ae3feb80bb2]
  components:
    - core/evidence/e2e/classify.py (failure_signature, failure row fields)
    - core/runtime/state.py (note_e2e_outcome signature/runtime, legacy app migration)
    - core/evidence/e2e/runner.py (runtime_identity, runtime_changed release)
    - core/evidence/e2e/knowledge.py (repeat_failure entry per signature)
    - docs/runtime-contracts.md, docs/reference.md, dist skill verify-browser

disposition:
  implementation_status: implemented
  validation_status: observed
  validated_by: maintainer
  validated_on: 2026-09-28

validation:
  summary: |
    Offline suites only. Per CONTRACT.md §14, this becomes `validated` after a clean direct-use
    run that exercises it: the originating login re-run proceeds without `ignore_repeat_brake`,
    released by `runtime_changed` or with no streak; and a later identical app failure brakes.

    2026-09-28, correction: the paragraph above named the private project in "the originating
    login re-run"; the name was replaced under CONTRACT.md §5. Nothing else in it changed.

    2026-09-28, real use on the maintainer's private web project: an app failure was recorded with its signature and runtime
    identity (streak 1) and a later pass cleared it. The brake had refused 5 `app` runs on that
    project between 2026-09-25 and 2026-09-27, none carrying a signature — all before this
    decision, and the pattern it describes. Since the change no streak has reached the limit
    and no job record carries `repeat_released`, so neither a signature-narrowed brake nor a
    `runtime_changed` release has happened in real use — observed, not validated.
  runs:
    - date: 2026-09-28
      job_id: "job_20260928_031504_658555"
      description: "App failure recorded with signature v1 and runtime identity; streak 1; cleared by a later pass."
      clean: false

trade_offs:
  better:
    - Different app failures no longer add up to one streak, so the run that finally has a right scenario and runtime is not refused.
    - A runtime fix releases a streak the project fingerprint cannot see.
  worse:
    - The brake fires less often on the `app` bucket. A loop that keeps producing different app failures (a flaky app failing in a new place each run) is no longer braked; it relies on the in-run retry comparison and on the person reading the failures.
    - Every edit to the runtime's browser package releases at-limit streaks during development.

limitations:
  - The signature relies on the placeholder scenario and on the report's `url_after`. A single-page app that never changes its URL signs every failure on one page by field and condition alone.
  - The runtime digest covers `core/evidence/e2e/` only. A runtime fix elsewhere (the provider or the prompt) does not release a streak.
  - A runtime-caused failure is still classified `app` (`expect_url` is always `app`). The signature only stops different ones from adding up.

revisit_when:
  - A real loop of distinct app failures that the brake should have stopped.
  - A runtime fix outside `core/evidence/e2e/` that should have released a streak.
