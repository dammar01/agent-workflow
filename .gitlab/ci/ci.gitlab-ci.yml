# Mirror of .github/workflows/ci.yml.
#
# Every gate here already existed as a command someone had to remember to run. Two of them
# were failing on the default branch when this workflow was first added — a stamp target
# that had never been created and a stale manifest — which is the whole argument for the
# file.
#
# Both operating systems, deliberately. The runtime ships a PowerShell runner and generates
# a POSIX one, the workspace checks shell out to whichever the platform has, and path
# handling differs where it matters most (locks, session dirs). A single-OS run would pass
# while half the product stayed untested. GitHub expresses that as a matrix over `runs-on`;
# GitLab picks runners by tag, so here it is two jobs sharing one script block.
#
# THE IMAGE IS DECLARED ONCE, in .gitlab-ci.yml at `default:` — `python:$PYTHON_VERSION`
# with `pull_policy: if-not-present`. No job in this file overrides it.
#
# It was not always there. The Linux job originally said `image: python:${PYTHON_VERSION}`
# under the runner's default pull policy of `always`, which is how a docker executor pins a
# toolchain (GitLab has no `actions/setup-python`). On a self-hosted runner with restricted
# egress that turned every pipeline into a Docker Hub dependency, and it failed exactly
# there:
#
#   ERROR: Job failed: failed to pull image "python:3.13" ...
#   Head "https://registry-1.docker.io/v2/library/python/manifests/3.13":
#   net/http: TLS handshake timeout
#
# The image was dropped, and for a while this comment argued that a `pull_policy` fallback
# would only have made that failure rarer. That reasoning holds for `retry`; it does not
# hold for `if-not-present`. Under `always` the registry is contacted on every single run,
# so a network it cannot reliably reach is a permanent tax. Under `if-not-present` a runner
# that already holds the image never opens the connection at all — the pull happens once,
# and the steady state contains no network call to be one hiccup away from red. Seeding the
# runner with `docker pull python:3.13` closes even the first-run gap, on a machine that can
# reach the registry once.
#
# What the imageless era bought is kept: a version ASSERTED rather than assumed.
# `before_script` still checks the interpreter it found, because a runner registered with a
# shell executor ignores `image:` and would otherwise run whatever Python it happens to
# carry. The check is free where the container already settles it, and load-bearing where
# it does not.

.checks:
  stage: check
  timeout: 20 minutes
  interruptible: true
  script:
    # Version stamp is in sync
    - python tools/maintain/stamp_version.py --check
    # Manifest matches dist/
    - python tools/maintain/gen_manifest.py --check
    # Runtime is stdlib-only. Its own step rather than only inside the suite: this is the
    # gate that decides whether the absence of a lockfile is still correct, and a reader
    # scanning the log should be able to see it hold.
    - python tests/run.py --only deps
    # Unit and integration suites. --keep-going so one failure does not hide the rest; the
    # scenario suite is still internally sequential, so it stops at its own first assertion
    # either way. --record writes the outcome to the workspace quality stream, so
    # `--command report` can show a test pass rate over time rather than only the latest run.
    - python tests/run.py --keep-going --record .
    # End-to-end (local + integrity + installer). Without --full: no provider CLI is invoked
    # and no quota is spent. The delegated checks stay opt-in because they cost real money
    # and need credentials this pipeline deliberately does not hold.
    - python tools/e2e/e2e.py

# The POSIX half of the preflight. Two things it must settle before the shared script runs.
# The container settles both for free — this exists for the shell-executor case, where
# `image:` is ignored and neither is settled by anything:
#   1. `python` may not exist even where `python3` does — most distributions ship only the
#      versioned name. A shim on PATH keeps ONE script block serving both platforms; the
#      alternative is a `$PYTHON_BIN` variable that PowerShell and sh disagree about how to
#      expand.
#   2. The version is asserted, not installed. A mismatch stops here with a sentence naming
#      both numbers, instead of surfacing later as whatever a wrong interpreter happens to
#      break first.
.posix-python-preflight: &posix_python_preflight
  - |
    set -e
    if ! command -v python3 >/dev/null 2>&1; then
      echo "[ci] no python3 on this runner. Install Python $PYTHON_VERSION on the machine"
      echo "[ci] backing this job, or point LINUX_RUNNER_TAG at a runner that has it."
      exit 1
    fi
    if ! command -v python >/dev/null 2>&1; then
      # Outside the checkout on purpose: a shim written into $CI_PROJECT_DIR would leave an
      # untracked directory in the working tree the rest of the job then inspects.
      shim_dir=$(mktemp -d)
      ln -sf "$(command -v python3)" "$shim_dir/python"
      export PATH="$shim_dir:$PATH"
    fi
    found=$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
    if [ "$found" != "$PYTHON_VERSION" ]; then
      echo "[ci] runner has Python $found, this pipeline expects $PYTHON_VERSION."
      echo "[ci] Install $PYTHON_VERSION on the runner, or set the PYTHON_VERSION variable"
      echo "[ci] to $found if that is the version you mean to test against."
      exit 1
    fi
    python --version

checks:linux:
  extends: .checks
  # Untagged: any runner willing to take untagged jobs picks this up. A guard that skipped
  # the job when no tag is set would leave a project with no Linux coverage and a green
  # pipeline, which is worse than a job that has to wait for a runner.
  rules:
    - if: $LINUX_RUNNER_TAG == null || $LINUX_RUNNER_TAG == ""
      when: on_success
    - when: never
  before_script: *posix_python_preflight

checks:linux:tagged:
  extends: .checks
  # The same job, addressed to a specific runner. Exactly one of this pair is ever created.
  tags:
    - ${LINUX_RUNNER_TAG}
  rules:
    - if: $LINUX_RUNNER_TAG == null || $LINUX_RUNNER_TAG == ""
      when: never
    - when: on_success
  before_script: *posix_python_preflight

checks:windows:
  extends: .checks
  tags:
    - ${WINDOWS_RUNNER_TAG}
  rules:
    # An unmatched tag does not fail a job on GitLab — it leaves it queued forever with "no
    # runners that match all of the job's tags". Named tag: the job runs. No tag: the job is
    # never created, and the pipeline result reflects Linux only rather than sitting stuck.
    # Unlike the Linux pair there is no untagged fallback: an untagged job would be picked
    # up by a Linux runner and would fail on the first PowerShell line.
    - if: $WINDOWS_RUNNER_TAG == null || $WINDOWS_RUNNER_TAG == ""
      when: never
    - when: on_success
  before_script:
    - |
      if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
        Write-Host "[ci] no python on this runner. Install Python $env:PYTHON_VERSION on the"
        Write-Host "[ci] machine backing WINDOWS_RUNNER_TAG."
        exit 1
      }
      # No quote characters inside the -c argument: PowerShell strips inner double quotes
      # when handing an argument to a native executable, and Python then receives
      # `print(%d.%d % ...)` and dies on a SyntaxError. chr(46) is the dot.
      $found = (python -c 'import sys; print(sys.version_info[0], sys.version_info[1], sep=chr(46))')
      if ($found -ne $env:PYTHON_VERSION) {
        Write-Host "[ci] runner has Python $found, this pipeline expects $env:PYTHON_VERSION."
        Write-Host "[ci] Install it on the runner, or set the PYTHON_VERSION variable to $found."
        exit 1
      }
      python --version
